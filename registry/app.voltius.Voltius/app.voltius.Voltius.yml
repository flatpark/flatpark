id: app.voltius.Voltius
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: voltius
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Tauri/WebKitGTK app: one binary that links webkit2gtk-4.1, gtk-3,
  # libsoup-3, libsecret and dbus, all in org.gnome.Platform. No tray.
  - --share=ipc
  # SSH, SFTP, the E2EE vault sync and the update check.
  - --share=network
  - --socket=wayland
  # Not a fallback: the app uses tauri-plugin-clipboard-manager (arboard), and
  # Flatpak's Wayland socket does not pass the data-control protocol it wants,
  # so X11 is its only clipboard route. The window stays native Wayland.
  - --socket=x11
  - --device=dri
  # Saved passwords and keys go to the system keyring (Secret Service).
  - --talk-name=org.freedesktop.secrets
  # The grants below were requested by upstream so the package behaves like
  # their .deb (VoltiusApp/voltius#357).
  # Local terminal tab: from the release after 0.42.0 the app opens the user's
  # host login shell through `flatpak-spawn --host` when it may talk to
  # org.freedesktop.Flatpak, and falls back to a sandbox shell otherwise.
  - --talk-name=org.freedesktop.Flatpak
  # ssh-agent authentication and agent forwarding.
  - --socket=ssh-auth
  # ~/.ssh (keys, config import) and the local side of SFTP transfers.
  - --filesystem=home
  # Serial ports.
  - --device=all
modules:
  - name: voltius
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 voltius-wrapper /app/bin/voltius
      - install -Dm644 app.voltius.Voltius.desktop /app/share/applications/app.voltius.Voltius.desktop
      - install -Dm644 app.voltius.Voltius.metainfo.xml /app/share/metainfo/app.voltius.Voltius.metainfo.xml
      - install -Dm644 app.voltius.Voltius.png /app/share/icons/hicolor/256x256/apps/app.voltius.Voltius.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: voltius.deb
        only-arches:
          - x86_64
        url: https://github.com/VoltiusApp/voltius/releases/download/v0.62.0/Voltius_0.62.0_amd64.deb
        sha256: b8018b90734690f977aa7ee84d478d3d165cf9ed815a4a65b8e2831f346d0db3
        size: 15763306
      - type: extra-data
        filename: voltius.deb
        only-arches:
          - aarch64
        url: https://github.com/VoltiusApp/voltius/releases/download/v0.62.0/Voltius_0.62.0_arm64.deb
        sha256: da308c603ec44e560263eb47ae2d5d80bf610ddcd4196fcd29dc5a98f6291cd5
        size: 15212380
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: voltius-wrapper
      - type: file
        path: app.voltius.Voltius.desktop
      - type: file
        path: app.voltius.Voltius.metainfo.xml
      - type: file
        path: app.voltius.Voltius.png
