id: io.github.leejet.StableDiffusionCpp.CPU
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: sd-server
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Serve the embedded Web UI and HTTP API on loopback.
  - --share=network
modules:
  - name: stable-diffusion
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 sd-server-wrapper /app/bin/sd-server
      - install -Dm755 sd-cli-wrapper /app/bin/sd-cli
      - install -Dm644 io.github.leejet.StableDiffusionCpp.CPU.desktop /app/share/applications/io.github.leejet.StableDiffusionCpp.CPU.desktop
      - install -Dm644 io.github.leejet.StableDiffusionCpp.CPU.metainfo.xml /app/share/metainfo/io.github.leejet.StableDiffusionCpp.CPU.metainfo.xml
      - install -Dm644 io.github.leejet.StableDiffusionCpp.CPU.png /app/share/icons/hicolor/512x512/apps/io.github.leejet.StableDiffusionCpp.CPU.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: sd.zip
        only-arches:
          - x86_64
        url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-1122-3b12781/sd-master-3b12781-bin-Linux-Ubuntu-26.04-x86_64.zip
        sha256: da09c1fdf5ef2ee901233be54ee81814f5414213ecc50b991681562def2b1ee2
        size: 30797167
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: sd-server-wrapper
      - type: file
        path: sd-cli-wrapper
      - type: file
        path: io.github.leejet.StableDiffusionCpp.CPU.desktop
      - type: file
        path: io.github.leejet.StableDiffusionCpp.CPU.metainfo.xml
      - type: file
        path: io.github.leejet.StableDiffusionCpp.CPU.png
