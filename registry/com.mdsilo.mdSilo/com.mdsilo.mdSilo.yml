id: com.mdsilo.mdSilo
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: mdsilo
separate-locales: false
build-options:
  no-debuginfo: true
  strip: true
finish-args:
  # RSS feeds, podcasts, HTTPS Git sync and publishing.
  - --share=network
  # GTK windowing and WebKit rendering; the app has no native clipboard plugin.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Podcast audio output.
  - --socket=pulseaudio
  # Tauri's tray icon registers with the watcher using its unique bus name.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
modules:
  # Tauri's tray loads AppIndicator dynamically; GNOME does not provide it.
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v2/ayatana-stack-ayatana-v2-gnome-51-x86_64.tar.xz
        sha256: 1051a537f22d335eb79557b8c5a610a12c326712dac74032de8e76e78b876fdc
  # On version bumps, verify the upstream Tauri updater is still disabled.
  - name: mdsilo
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 mdsilo-wrapper /app/bin/mdsilo
      - install -Dm644 com.mdsilo.mdSilo.desktop /app/share/applications/com.mdsilo.mdSilo.desktop
      - install -Dm644 com.mdsilo.mdSilo.metainfo.xml /app/share/metainfo/com.mdsilo.mdSilo.metainfo.xml
      - install -Dm644 com.mdsilo.mdSilo.png /app/share/icons/hicolor/256x256/apps/com.mdsilo.mdSilo.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: mdsilo.deb
        only-arches:
          - x86_64
        url: https://github.com/mdSilo/mdSilo-app/releases/download/mdsilo-v0.8.0/mdsilo_0.8.0_amd64.deb
        sha256: f5ec96d3eaba4360a7afc16747050fc9470b78f4c8f0d54f0374519b431e6e14
        size: 18107010
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: mdsilo-wrapper
      - type: file
        path: com.mdsilo.mdSilo.desktop
      - type: file
        path: com.mdsilo.mdSilo.metainfo.xml
      - type: file
        path: com.mdsilo.mdSilo.png
