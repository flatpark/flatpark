id: org.tunaos.letters
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: letters
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --own-name=org.tunaos.letters
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
modules:
  - name: hunspell-en-us
    buildsystem: simple
    build-commands:
      - install -Dm644 en_US.dic /app/share/hunspell/en_US.dic
      - install -Dm644 en_US.aff /app/share/hunspell/en_US.aff
    sources:
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/32b006a2c22a4ac7e8ed3f03346f7b3d85a970a4/en/en_US.dic
        sha256: f0b1a234bd178bdd01875b2a392a9647f888b8fe879f79c52aae62c2759b3647
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/32b006a2c22a4ac7e8ed3f03346f7b3d85a970a4/en/en_US.aff
        sha256: e746c882dd6f303c2c46e7452804b9201115a6942cfeb15f18f8edf774d2e24e
  - name: letters
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 letters-wrapper /app/bin/letters
      - install -Dm644 org.tunaos.letters.desktop /app/share/applications/org.tunaos.letters.desktop
      - install -Dm644 org.tunaos.letters.gschema.xml /app/share/glib-2.0/schemas/org.tunaos.letters.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas/
      - install -Dm644 org.tunaos.letters.metainfo.xml /app/share/metainfo/org.tunaos.letters.metainfo.xml
      - install -Dm644 org.tunaos.letters.svg /app/share/icons/hicolor/scalable/apps/org.tunaos.letters.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: letters.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/tuna-os/gtk-office-suite/releases/download/v2.1.0/letters-x86_64.tar.gz
        sha256: ff0224118daba8c8d88fd182e844762fd6370dc4e8b88731a6ea1dc4c3f497c6
        size: 7519184
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: letters-wrapper
      - type: file
        path: org.tunaos.letters.desktop
      - type: file
        path: org.tunaos.letters.gschema.xml
      - type: file
        path: org.tunaos.letters.metainfo.xml
      - type: file
        path: org.tunaos.letters.svg
