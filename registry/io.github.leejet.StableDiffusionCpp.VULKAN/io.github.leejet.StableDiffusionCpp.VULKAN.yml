id: io.github.leejet.StableDiffusionCpp.VULKAN
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: sd-server
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Serve the embedded Web UI and HTTP API on loopback.
  - --share=network
  # Vulkan compute accesses the render devices through runtime GPU drivers.
  - --device=dri
modules:
  - name: stable-diffusion
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 sd-server-wrapper /app/bin/sd-server
      - install -Dm755 sd-cli-wrapper /app/bin/sd-cli
      - install -Dm644 io.github.leejet.StableDiffusionCpp.VULKAN.desktop /app/share/applications/io.github.leejet.StableDiffusionCpp.VULKAN.desktop
      - install -Dm644 io.github.leejet.StableDiffusionCpp.VULKAN.metainfo.xml /app/share/metainfo/io.github.leejet.StableDiffusionCpp.VULKAN.metainfo.xml
      - install -Dm644 io.github.leejet.StableDiffusionCpp.VULKAN.png /app/share/icons/hicolor/512x512/apps/io.github.leejet.StableDiffusionCpp.VULKAN.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: sd.zip
        only-arches:
          - x86_64
        url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-1151-d68f288/sd-master-d68f288-bin-Linux-Ubuntu-26.04-x86_64-vulkan.zip
        sha256: 64b000aec40b9dd6eedcbeb5fa8f33690ceb7cd1eb9ad145ed39164fe94bdabd
        size: 44091457
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: sd-server-wrapper
      - type: file
        path: sd-cli-wrapper
      - type: file
        path: io.github.leejet.StableDiffusionCpp.VULKAN.desktop
      - type: file
        path: io.github.leejet.StableDiffusionCpp.VULKAN.metainfo.xml
      - type: file
        path: io.github.leejet.StableDiffusionCpp.VULKAN.png
