id: io.github.rwnicholas.HikLens
# Upstream publishes a self-contained PyInstaller + linuxdeploy x86_64 AppImage
# carrying its own Python 3.12, PySide6 (Qt 6 with both Wayland and XCB QPA
# plugins) and pre-compiled hikvision_stream_helper binary. It needs only the
# display, GL/VA-API, fontconfig, glib and FFmpeg stacks from
# org.freedesktop.Platform 26.08.
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: hiklens
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  # PySide6 (Qt 6) ships both libqwayland-generic.so and libqxcb.so in the
  # AppImage, so native Wayland works with fallback-x11 for X11 / Gamescope.
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware-accelerated video decoding (VA-API) and rendering.
  - --device=dri
  # Connects to Hikvision DVR/NVR cameras over the local network (HTTP ISAPI,
  # RTSP, and optional HCNetSDK port 8000).
  - --share=network
  # Snapshots and MP4 video recordings default to ~/Pictures/HikLens, and users
  # commonly point the optional Hikvision Linux SDK directory at an extracted
  # archive in ~/Downloads.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download:ro
  # Optional Steam Deck gamepad navigation (/dev/input/js*) and direct
  # Non-Steam shortcut registration (xdg-data/Steam, ~/.steam) are left as
  # opt-in overrides documented in the metainfo description; the app also falls
  # back to the portal directory chooser when Steam's directory is not mounted.
modules:
  - name: hiklens
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 hiklens-wrapper /app/bin/hiklens
      - install -Dm644 io.github.rwnicholas.HikLens.desktop /app/share/applications/io.github.rwnicholas.HikLens.desktop
      - install -Dm644 io.github.rwnicholas.HikLens.metainfo.xml /app/share/metainfo/io.github.rwnicholas.HikLens.metainfo.xml
      - install -Dm644 io.github.rwnicholas.HikLens.svg /app/share/icons/hicolor/scalable/apps/io.github.rwnicholas.HikLens.svg
    sources:
      # Kept outside the managed block, which update-pins rebuilds from the
      # resolver's output.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: hiklens.AppImage
        only-arches:
          - x86_64
        url: https://github.com/rwnicholas/HikLens/releases/download/v1.0.10/HikLens-v1.0.10-x86_64.AppImage
        sha256: 213b51b084b4b80ea7f21567f9e29a51a913d945d129454fd1646ac944caa749
        size: 54307320
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: hiklens-wrapper
      - type: file
        path: io.github.rwnicholas.HikLens.desktop
      - type: file
        path: io.github.rwnicholas.HikLens.metainfo.xml
      - type: file
        path: io.github.rwnicholas.HikLens.svg
