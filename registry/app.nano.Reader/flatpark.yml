id: app.nano.Reader
name: NanoYomi
summary: Desktop manga reader with user-added sources
website: https://github.com/SELECT-stupidity-FROM-discord/NanoYomi
source_url: https://github.com/SELECT-stupidity-FROM-discord/NanoYomi
build:
  manifest: app.nano.Reader.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: Office
  tags: [Manga, Reader]
upstream:
  manifest: packaging/flatpak.yml
  accept_missing_permissions:
    # Broad home access and audio are not needed for the core reader.
    - --filesystem=home
    - --socket=pulseaudio
  accept_extra_permissions:
    # Accessibility for the GPUI interface.
    - --talk-name=org.a11y.Bus
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
