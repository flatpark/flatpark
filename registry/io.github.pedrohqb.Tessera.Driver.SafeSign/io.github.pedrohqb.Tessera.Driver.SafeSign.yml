# SafeSign, a Tessera driver extension: mounted at
# /app/lib/tessera/extensions/SafeSign by Tessera's extension point
# (io.github.pedrohqb.Tessera.Driver, flatpak/io.github.pedrohqb.Tessera.yml).
# The vendor's files are downloaded at install time (extra-data) and checked
# against these sha256 pins, then unpacked by apply_extra.sh into extra/.
# FlatPark's registry entry builds from the same files.
id: io.github.pedrohqb.Tessera.Driver.SafeSign
branch: stable
runtime: io.github.pedrohqb.Tessera
runtime-version: stable
sdk: org.gnome.Sdk//51
build-extension: true
separate-locales: false
modules:
  - name: safesign
    buildsystem: simple
    build-commands:
      - install -Dm644 driver.toml -t ${FLATPAK_DEST}
      - install -Dm755 apply_extra.sh ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm644 io.github.pedrohqb.Tessera.Driver.SafeSign.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: safesign.deb
        only-arches:
          - x86_64
        url: https://assets.ctfassets.net/zuadwp3l2xby/6vGICRnQgQ8TkcHTgcouIr/5acf96dcbc0364aa9228606d3969ef97/SafeSignICStandardLinux4.5.0.0-AET.000ub2404x86_64.deb
        sha256: 7742e21e3141e51e307d7613b4046886bc7c4aa203835dcf5c43cd348f2a1b91
        size: 2034336
      # Token Administration from the vendor's RHEL 10 package (no wxWidgets
      # needed), as the AUR package does; the PKCS#11 library comes from the
      # Ubuntu package above.
      - type: extra-data
        filename: safesign.rpm
        only-arches:
          - x86_64
        url: https://assets.ctfassets.net/zuadwp3l2xby/3b4YS8ts1cuD4BnUoQGZXl/93f644f03cc226b2adab290be11c6cd5/SafeSignICStandardLinux4.5.0.0-AET.000redhat10x86_64.rpm
        sha256: 2f5ea4622fda213c9bfc8bf4da51dac09983a349326f9275309565dbdb123378
        size: 4623566
      # GDBM, which libaetpkss.so needs and the runtime lacks (the AUR package
      # depends on gdbm), from Ubuntu 24.04.
      - type: extra-data
        filename: gdbm.deb
        only-arches:
          - x86_64
        url: https://archive.ubuntu.com/ubuntu/pool/main/g/gdbm/libgdbm6t64_1.23-5.1build1_amd64.deb
        sha256: 18d6d74a5c038b458d95ba0c0909e0f086cd50bb9a0fee32697902724fc5645e
        size: 34440
      - type: extra-data
        filename: gdbm-compat.deb
        only-arches:
          - x86_64
        url: https://archive.ubuntu.com/ubuntu/pool/main/g/gdbm/libgdbm-compat4t64_1.23-5.1build1_amd64.deb
        sha256: fb8564afd7b7d74d55207070ba50339478e22d29a39ec740dc482f069ac7ee65
        size: 6710
      # END MANAGED EXTRA-DATA
      - type: file
        path: driver.toml
      - type: file
        path: apply_extra.sh
      - type: file
        path: io.github.pedrohqb.Tessera.Driver.SafeSign.metainfo.xml
