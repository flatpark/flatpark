# SafeSign IC, a Tessera driver extension (io.github.pedrohqb.Tessera.Driver.SafeSign).
# Paths are relative to this folder; apply_extra.sh unpacks into extra/.
name = "SafeSign IC"
vendor = "A.E.T. Europe"
description = "GD Burti and other SafeSign tokens"
module = "extra/libaetpkss.so"
library_path = [
    "extra/usr/lib",
    "extra/gdbm/usr/lib/x86_64-linux-gnu",
]

# SafeSign looks for its registry in $HOME/.safesign before /usr/share/safesign,
# which the sandbox does not have. apply_extra.sh writes one there whose paths
# point into this folder (jcdata.kit, which the older GD Burti needs to sign).
# Only the driver's process gets this HOME; Token Administration does not.
[env]
HOME = "./extra/home"

[[tools]]
name = "Token Administration"
exec = ["extra/tokenadmin"]
