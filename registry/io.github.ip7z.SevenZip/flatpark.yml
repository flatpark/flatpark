id: io.github.ip7z.SevenZip
name: 7-Zip
summary: Compress and extract archives from the command line
website: https://www.7-zip.org/
source_url: https://github.com/ip7z/7zip
build:
  manifest: io.github.ip7z.SevenZip.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  interface: cli
  category: Utility
  tags: [Archives, Compression, Extraction, 7z, Terminal]
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions:
    # A command-line tool takes files as paths in its arguments, with no file
    # chooser; a working directory outside the grant is silently replaced by
    # the sandbox's empty home (docs/packagers/solutions/command-line-tools.md).
    - --filesystem=home
