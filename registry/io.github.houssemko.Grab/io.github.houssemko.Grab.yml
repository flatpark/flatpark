id: io.github.houssemko.Grab
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: grab
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Native GTK4/libadwaita app. Wayland by default with XWayland fallback,
  # dri for GPU-accelerated rendering.
  - --share=ipc
  # Core function: HTTP(S) downloads, magnet/torrent peers (DHT, trackers).
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Completion notices go through the notification portal (GLib picks the
  # portal backend inside a sandbox), and sleep inhibition goes through the
  # Inhibit portal — neither needs a direct bus grant.
  # Single instance + D-Bus activation (DBusActivatable desktop entry,
  # magnet/torrent handlers via %U).
  - --own-name=io.github.houssemko.Grab
  # Default download location: an empty download-dir setting resolves to the
  # system Downloads folder, which Flatpak maps to xdg-download. A custom
  # download directory outside it is the user's own opt-in (see the metainfo
  # description for the override command).
  - --filesystem=xdg-download
  # Browser-cookie authentication (Preferences → Media → Authentication):
  # member-only pages and age gates need the host browsers' cookie stores,
  # read-only. Without these, yt-dlp runs anonymous and login-walled pages
  # fail. Same per-browser paths the vendor manifest grants.
  - --talk-name=org.freedesktop.secrets
  - --filesystem=~/.config/BraveSoftware/Brave-Browser:ro
  - --filesystem=~/.config/google-chrome:ro
  - --filesystem=~/.config/chromium:ro
  - --filesystem=~/.config/microsoft-edge:ro
  - --filesystem=~/.mozilla/firefox:ro
  - --filesystem=~/.config/mozilla/firefox:ro
  - --filesystem=~/snap/firefox/common/.mozilla/firefox:ro
  - --filesystem=~/.config/opera:ro
  - --filesystem=~/.config/vivaldi:ro
  - --filesystem=~/.config/naver-whale:ro
  # Queue database (queue.json), torrent state and resume data live under
  # ~/.local/share (glib user_data_dir), which is per-app sandboxed storage —
  # no grant needed.
modules:
  - name: grab
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 grab-wrapper /app/bin/grab
      - install -Dm644 io.github.houssemko.Grab.desktop /app/share/applications/io.github.houssemko.Grab.desktop
      - install -Dm644 io.github.houssemko.Grab.metainfo.xml /app/share/metainfo/io.github.houssemko.Grab.metainfo.xml
      - install -Dm644 io.github.houssemko.Grab.svg /app/share/icons/hicolor/scalable/apps/io.github.houssemko.Grab.svg
      # D-Bus activation: the tarball's service points at /usr/bin/grab, which
      # does not exist in the sandbox — same Name, Exec adapted to the wrapper.
      - install -Dm644 io.github.houssemko.Grab.service /app/share/dbus-1/services/io.github.houssemko.Grab.service
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: grab.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/houssemko/Grab/releases/download/v2.3.3/Grab-2.3.3-linux-x86_64.tar.gz
        sha256: 320bbb867a178435795a41fdc3003ef3010f8b6546094f27e7f9c28fbf164e4d
        size: 4817411
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: grab-wrapper
      - type: file
        path: io.github.houssemko.Grab.desktop
      - type: file
        path: io.github.houssemko.Grab.metainfo.xml
      - type: file
        path: io.github.houssemko.Grab.svg
      - type: file
        path: io.github.houssemko.Grab.service
