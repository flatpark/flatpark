id: dk.nikse.subtitleedit
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: subtitleedit
separate-locales: false
build-options:
  # no-debuginfo alone only suppresses the .Debug extension; it leaves the DWARF
  # inside mpv-stack's copied libraries. ~10 MB of this ref was debug sections.
  no-debuginfo: true
  strip: true
finish-args:
  # Display
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  # Hardware acceleration
  - --device=dri
  # File access (subtitle files are typically in the home directory)
  - --filesystem=home
  # Mounted drives and network shares (NAS/SMB is a common place for video files).
  # Direct access avoids the document portal, whose single-file grants strand files
  # saved with an auto-appended extension as hidden ".xdp-*" temp files (issue #13308)
  # and add FUSE overhead to video playback.
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=xdg-run/gvfs
  # Network (optional online services: translation, TTS, speech-to-text, etc.)
  - --share=network
  # Audio (video playback via mpv)
  - --socket=pulseaudio
modules:
  # Subtitle Edit loads libmpv.so.2 via dlopen and never spawns the `mpv` CLI,
  # so the 10 MB /app/bin/mpv the stack ships is dead weight for this app.
  - name: mpv-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    cleanup:
      - /bin/mpv
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/mpv-v2/mpv-stack-mpv-v2-gnome-51-x86_64.tar.xz
        sha256: 3d4a1c48d8a466bd86badbf683f21dfd05ea15c2f8f512414316e7842c863c93

  - name: subtitleedit
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 subtitleedit-wrapper /app/bin/subtitleedit
      - install -Dm644 dk.nikse.subtitleedit.desktop /app/share/applications/dk.nikse.subtitleedit.desktop
      - install -Dm644 dk.nikse.subtitleedit.metainfo.xml /app/share/metainfo/dk.nikse.subtitleedit.metainfo.xml
      - install -Dm644 dk.nikse.subtitleedit.png /app/share/icons/hicolor/256x256/apps/dk.nikse.subtitleedit.png
    sources:
      # Everything this app needs beyond the runtime is a prebuilt stack from
      # https://github.com/flatpark/prebuilt, fetched from its GitHub release at
      # install time rather than built here — so none of it is committed into
      # FlatPark's OSTree repository, which is a bucket the project pays for and
      # which every publish has to sync in full. apply_extra unpacks each to its
      # own /app/extra/<name>/ and the wrapper names them on LD_LIBRARY_PATH and
      # PATH: directories the loader does not search by default, so none of this
      # shadows what the runtime provides.
      #
      # ffmpeg-full is here because the runtime's own ffmpeg is built without
      # libass, so the `ass` and `subtitles` filters do not exist and burn-in
      # fails at filter-graph parse time. It carries the codec libraries it
      # links (x264, x265, lame, rubberband, libass) inside its own archive.
      #
      # Deliberately OUTSIDE the managed block below: update-pins.mjs rebuilds
      # that block from the resolver's sources and would drop anything else in it.
      - type: extra-data
        filename: ffmpeg-full.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/ffmpeg-full-v3/ffmpeg-full-ffmpeg-full-v3-gnome-51-x86_64.tar.xz
        sha256: 3ae0b24a8d7e134ca034e9f0eb0a6efbfc7e467fd90bf967a750fd3872055e28
        size: 13655872
      - type: extra-data
        filename: leptonica.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/leptonica-v2/leptonica-leptonica-v2-gnome-51-x86_64.tar.xz
        sha256: c031417db8170f8e2553cab28d674cd78bd86056e53ae423af7fdd1da6822340
        size: 1228816
      - type: extra-data
        filename: tesseract.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/tesseract-v2/tesseract-tesseract-v2-gnome-51-x86_64.tar.xz
        sha256: 43cf6dd9cc48845b577cef72bff9eb471a51cce0c3ec72f14ab4d7ee28366149
        size: 1691656
      - type: extra-data
        filename: uchardet.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/uchardet-v2/uchardet-uchardet-v2-gnome-51-x86_64.tar.xz
        sha256: 7c33add34057328c1cc99b4facc8ac7d1796dc5c32fbcc899250dd401dd79f09
        size: 72632
      - type: extra-data
        filename: sevenzip.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/sevenzip-v2/sevenzip-sevenzip-v2-gnome-51-x86_64.tar.xz
        sha256: 282a276bdf963420efcd5ca2d4014bb6ba66d78c1a423e137711f229deaa7725
        size: 496732
      - type: extra-data
        filename: eng.traineddata
        only-arches:
          - x86_64
        url: https://github.com/tesseract-ocr/tessdata/raw/4.1.0/eng.traineddata
        sha256: daa0c97d651c19fba3b25e81317cd697e9908c8208090c94c3905381c23fc047
        size: 23466654
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: subtitleedit.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/SubtitleEdit/subtitleedit/releases/download/v5.3.0/SubtitleEdit-Linux-x64.tar.gz
        sha256: 93b487e115560da33c4557c780d387e311d93a6ab6abe000093576ccb9d44889
        size: 61521435
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: subtitleedit-wrapper
      - type: file
        path: dk.nikse.subtitleedit.desktop
      - type: file
        path: dk.nikse.subtitleedit.metainfo.xml
      - type: file
        path: dk.nikse.subtitleedit.png
