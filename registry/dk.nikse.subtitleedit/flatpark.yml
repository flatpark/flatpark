id: dk.nikse.subtitleedit
name: Subtitle Edit
summary: Free, open source subtitle editor with waveform and video preview
website: https://www.nikse.dk/subtitleedit
source_url: https://github.com/SubtitleEdit/subtitleedit
build:
  manifest: dk.nikse.subtitleedit.yml
  branch: stable
  mode: extra-data
catalog:
  category: AudioVideo
  tags:
    - Video
    - Subtitles
    - Editor
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  # Matches upstream's own flathub manifest verbatim: subtitle/video files are
  # commonly outside XDG Videos (secondary drives, NAS, sync folders). Portal-
  # mediated single-file access strands auto-renamed saves as hidden .xdp-*
  # temp files and adds FUSE overhead to video playback (upstream issue #13308).
  dangerous_permissions:
    - --filesystem=home
