id: ai.storyteller.vectorcraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: vectorcraft
separate-locales: false
build-options:
  no-debuginfo: true
# The app id and finish-args follow upstream's own Flatpak manifest
# (packaging/linux/flatpak/ in storytold/vectorcraft), so this package and the
# single-file bundle upstream builds are the same application. The runtime is
# 26.08, shared with PhotoCraft; the binaries need only glibc from it.
finish-args:
  # Native Rust/egui app on winit; libwayland, libX11/xcb, xkbcommon and the
  # Vulkan/EGL loaders are dlopen()ed from the runtime.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu GPU compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save go through the file-chooser portal. Pictures is granted so
  # files passed by path from the command line keep working.
  - --filesystem=xdg-pictures
  # Deliberately not granted:
  #   --share=network          -> the optional --control automation server
  #                               listens on 127.0.0.1 inside the sandbox; the
  #                               metainfo documents the override that exposes it
  #   --filesystem=home / host -> everything else goes through the portals
modules:
  - name: vectorcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 vectorcraft-wrapper /app/bin/vectorcraft
      - install -Dm755 vectorcraft-cli-wrapper /app/bin/vectorcraft-cli
      - install -Dm644 ai.storyteller.vectorcraft.desktop /app/share/applications/ai.storyteller.vectorcraft.desktop
      - install -Dm644 ai.storyteller.vectorcraft.metainfo.xml /app/share/metainfo/ai.storyteller.vectorcraft.metainfo.xml
      - install -Dm644 ai.storyteller.vectorcraft.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.vectorcraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: vectorcraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/vectorcraft/releases/download/v0.21.1/vectorcraft-0.21.1-linux-x86_64.tar.gz
        sha256: 383bba06fbde7cb87c7e137937ad516a9a585491c5a927d8631ee54bbf1d4e93
        size: 143222440
      - type: extra-data
        filename: vectorcraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/storytold/vectorcraft/releases/download/v0.21.1/vectorcraft-0.21.1-linux-aarch64.tar.gz
        sha256: 2e6f3026856b0f9609acb1529bb138dcda7bee2e34a285e06549937696ac3604
        size: 137139235
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: vectorcraft-wrapper
      - type: file
        path: vectorcraft-cli-wrapper
      - type: file
        path: ai.storyteller.vectorcraft.desktop
      - type: file
        path: ai.storyteller.vectorcraft.metainfo.xml
      - type: file
        path: ai.storyteller.vectorcraft.png
