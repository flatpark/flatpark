id: org.openmodelica.OpenModelica
# OpenModelica's core feature compiles generated simulation code. The Platform
# runtime deliberately has no compiler, while the matching SDK carries GCC,
# binutils, make and the C/C++ headers. Running on the SDK keeps that required
# toolchain inside the sandbox and avoids host-command access.
runtime: org.kde.Sdk
runtime-version: "6.11"
sdk: org.kde.Sdk
# OMEdit uses Qt WebEngine for its welcome and documentation views. This base
# provides the version matched to KDE 6.11, including its sandbox integration.
base: io.qt.qtwebengine.BaseApp
base-version: "6.11"
command: openmodelica
separate-locales: false
build-options:
  no-debuginfo: true
  strip: true
finish-args:
  - --share=ipc
  # The package manager downloads Modelica libraries, and OMEdit links to
  # online documentation and release information.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware-accelerated Qt and Qt WebEngine rendering.
  - --device=dri
  # OpenModelica stores downloaded libraries in ~/.openmodelica instead of an
  # XDG directory. Persist only that private directory, not the user's home.
  - --persist=.openmodelica
modules:
  - name: openmodelica
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 openmodelica-wrapper /app/bin/openmodelica
      - install -Dm755 openmodelica-compiler-wrapper /app/bin/clang
      - ln -s clang /app/bin/clang++
      - install -Dm644 org.openmodelica.OpenModelica.desktop /app/share/applications/org.openmodelica.OpenModelica.desktop
      - install -Dm644 org.openmodelica.OpenModelica.metainfo.xml /app/share/metainfo/org.openmodelica.OpenModelica.metainfo.xml
      - install -Dm644 org.openmodelica.OpenModelica.png /app/share/icons/hicolor/256x256/apps/org.openmodelica.OpenModelica.png
    sources:
      # The official stable archive retains versioned Debian packages. These
      # are the compiler, OMEdit, simulation libraries and offline Modelica
      # library cache from the upstream Trixie repository.
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: omc.deb
        only-arches:
          - x86_64
        url: https://build.openmodelica.org/omc/builds/linux/releases/1.27.1/pool/contrib-trixie/omc_1.27.1-1_amd64.deb
