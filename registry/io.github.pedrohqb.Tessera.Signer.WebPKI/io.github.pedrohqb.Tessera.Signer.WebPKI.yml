# Lacuna Web PKI, a Tessera web signer extension: mounted at
# /app/lib/tessera/signers/WebPKI by Tessera's extension point
# (io.github.pedrohqb.Tessera.Signer, flatpak/io.github.pedrohqb.Tessera.yml).
# Tessera does not run it: the Flatpak browsers do, by native messaging,
# from where Flatpak deploys the extension on the host (see docs/signers.md).
# The vendor's package is downloaded at install time (extra-data) and
# checked against this sha256 pin, then unpacked by apply_extra.sh into
# extra/. FlatPark's registry entry builds from the same files.
id: io.github.pedrohqb.Tessera.Signer.WebPKI
branch: stable
runtime: io.github.pedrohqb.Tessera
runtime-version: stable
sdk: org.gnome.Sdk//51
build-extension: true
separate-locales: false
modules:
  - name: webpki
    buildsystem: simple
    build-commands:
      - install -Dm644 signer.toml -t ${FLATPAK_DEST}
      - install -Dm755 start -t ${FLATPAK_DEST}
      - install -Dm755 apply_extra.sh ${FLATPAK_DEST}/bin/apply_extra
      # The library name the browser plugin asks for, pointing at p11-kit's
      # client in the browser's own runtime (a dangling link anywhere else),
      # which reaches Tessera's tokens through the system's p11-kit server.
      - mkdir -p ${FLATPAK_DEST}/lib
      - ln -s /usr/lib/x86_64-linux-gnu/pkcs11/p11-kit-client.so ${FLATPAK_DEST}/lib/libaetpkss.so.3
      - install -Dm644 io.github.pedrohqb.Tessera.Signer.WebPKI.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      # The vendor's icon (from its browser extension), shown in Tessera's
      # window next to the signer.
      - install -Dm644 io.github.pedrohqb.Tessera.Signer.WebPKI.png ${FLATPAK_DEST}/icon.png
    sources:
      # Lacuna's server sends its current package whatever version the
      # path names (it redirects to blob.lacuna.net/webpki/webpki-setup-64.deb),
      # and keeps no older ones: a new release changes the sha256 here, and
      # the weekly download check says so.
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: webpki.deb
        only-arches:
          - x86_64
        url: https://get.webpkiplugin.com/Downloads/2.17.0/setup-deb-64
        sha256: cf284641bb3786dea6f3003fbcb5c0bf8b83cc9ab37975aa87ff68cdc42ac2f4
        size: 42986816
      # END MANAGED EXTRA-DATA
      - type: file
        path: signer.toml
      - type: file
        path: start
      - type: file
        path: apply_extra.sh
      - type: file
        path: io.github.pedrohqb.Tessera.Signer.WebPKI.metainfo.xml
      - type: file
        path: io.github.pedrohqb.Tessera.Signer.WebPKI.png
