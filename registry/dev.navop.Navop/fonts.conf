<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Navop draws its text with cosmic-text/fontdb, which builds its font database
  from a fontconfig file it parses itself: FONTCONFIG_FILE, else
  $XDG_CONFIG_HOME/fontconfig/fonts.conf, else /etc/fonts/fonts.conf. Its parser
  reads the <dir> elements of that one file, so the two indirections a Flatpak
  sandbox relies on are both invisible to it:

    * the runtime's /etc/fonts/fonts.conf reaches the host's fonts only through
      conf.d/50-flatpak.conf -> /run/host/font-dirs.xml, which <remap-dir>s
      /run/host/fonts onto /usr/share/fonts;
    * the bundled CJK face is extra-data, so it lives under /app/extra.

  The result on a stock install is that Navop sees only the runtime's own fonts,
  which include no CJK face at all, and every CJK glyph renders as a tofu box —
  even on a host that has Noto Sans CJK installed. Listing every directory
  explicitly here is what makes both sets reachable. The include keeps real
  fontconfig consumers in the sandbox (WebKitGTK) on the runtime's own rules.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- The runtime's own fonts. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>

  <!-- The host's fonts, as Flatpak mounts them into every sandbox. -->
  <dir>/run/host/fonts</dir>
  <dir>/run/host/local-fonts</dir>
  <dir>/run/host/user-fonts</dir>

  <!-- The user's own fonts inside the sandbox. -->
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>

  <!-- The bundled Noto Sans CJK face, staged by apply_extra. Last, so it only
       ever acts as a fallback behind whatever the host already provides. -->
  <dir>/app/extra/fonts</dir>
</fontconfig>
