id: com.example.piliplus
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: piliplus
separate-locales: false
build-options:
  no-debuginfo: true
  strip: true
finish-args:
  # Flutter / GTK3 window with GPU acceleration
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio playback (PulseAudio/PipeWire for mpv / media_kit)
  - --socket=pulseaudio
  # Network access for Bilibili streaming, search, and API
  - --share=network
  # StatusNotifier tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: mpv-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/mpv-v2/mpv-stack-mpv-v2-gnome-51-x86_64.tar.xz
        sha256: 3d4a1c48d8a466bd86badbf683f21dfd05ea15c2f8f512414316e7842c863c93

  - name: piliplus
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 piliplus-wrapper /app/bin/piliplus
      - install -Dm644 com.example.piliplus.desktop /app/share/applications/com.example.piliplus.desktop
      - install -Dm644 com.example.piliplus.metainfo.xml /app/share/metainfo/com.example.piliplus.metainfo.xml
      - install -Dm644 com.example.piliplus.png /app/share/icons/hicolor/512x512/apps/com.example.piliplus.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: piliplus.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/bggRGjQaUbCoE/PiliPlus/releases/download/2.1.6.2/PiliPlus_linux_2.1.6%2B5472_amd64.tar.gz
        sha256: 271e7911f0a4a676cce7f3584f598980e15a583e683cc39595bf13c13940a052
        size: 18589381
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: piliplus-wrapper
      - type: file
        path: com.example.piliplus.desktop
      - type: file
        path: com.example.piliplus.metainfo.xml
      - type: file
        path: com.example.piliplus.png
