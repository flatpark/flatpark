id: ai.storyteller.pdfcraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: pdfcraft
separate-locales: false
build-options:
  no-debuginfo: true
# The app id and finish-args follow upstream's own Flatpak manifest
# (packaging/linux/flatpak/ in storytold/pdfcraft), so this package and the
# single-file bundle upstream builds are the same application. The runtime is
# 26.08, shared with PhotoCraft; the binaries need only glibc from it.
#
# PdfCraft is the renamed PrintCraft (storytold/pdfcraft#174). The rename
# changed the app id, so this is a new package; ai.storyteller.printcraft is
# de-listed once this one is live.
finish-args:
  # Native Rust/egui app on winit; libwayland, libX11/xcb, xkbcommon and the
  # Vulkan/EGL loaders are dlopen()ed from the runtime.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu GPU compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Printing. craft-print lists printers with lpstat, reads the default with
  # lpoptions and sends jobs with lp. The runtime has libcups and lpr, not
  # those tools, and without the CUPS socket the Print dialog stays empty.
  # cups-client below ships them. Avahi is how `lpstat -e` finds driverless
  # printers. ~/.cups is read-only: the default printer, saved options and a
  # ServerName.
  - --socket=cups
  - --system-talk-name=org.freedesktop.Avahi
  - --filesystem=~/.cups:ro
  # Open/Save go through the file-chooser portal. Documents and Downloads,
  # where PDFs usually live, are granted so files passed by path (command
  # line, Open Recent, saving next to the original) keep working there.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Deliberately not granted:
  #   --share=network          -> the optional --control automation server
  #                               listens on 127.0.0.1 inside the sandbox; the
  #                               metainfo documents the override that exposes it
  #   --filesystem=home / host -> everything else goes through the portals
modules:
  # lp, lpstat and lpoptions from FlatPark's prebuilt cups-client stack: the
  # same build as upstream's cups-client module (CUPS 2.4.20, libcups linked
  # statically) plus upstream's socket wrapper; the tag's manifest records the
  # sources. apply_extra unpacks it to /app/extra/cups-client; the links below
  # put the tools on PATH and dangle until then. Extra-data, not built here: a
  # dependency is never compiled in an app's manifest
  # (docs/packagers/prebuilt.md). Kept as its own module so the module names
  # match upstream's manifest.
  - name: cups-client
    buildsystem: simple
    build-commands:
      - for tool in lp lpoptions lpstat; do install -d /app/bin; ln -s "/app/extra/cups-client/bin/$tool" "/app/bin/$tool"; done
    sources:
      - type: extra-data
        filename: cups-client.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/cups-client-v1/cups-client-cups-client-v1-fd-26.08-x86_64.tar.xz
        sha256: a96f57051ab61c98c73d99fed4dbe05a040fb2d1dbd353e1241d79b3aefea851
        size: 266076
      - type: extra-data
        filename: cups-client.tar.xz
        only-arches:
          - aarch64
        url: https://github.com/flatpark/prebuilt/releases/download/cups-client-v1/cups-client-cups-client-v1-fd-26.08-aarch64.tar.xz
        sha256: 7005c45fe7b1ebd24ed1146c47af34f00526407015cd7cbca5f0e1bbae37d909
        size: 238968
  - name: pdfcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 pdfcraft-wrapper /app/bin/pdfcraft
      - install -Dm755 pdfcraft-cli-wrapper /app/bin/pdfcraft-cli
      - install -Dm644 ai.storyteller.pdfcraft.desktop /app/share/applications/ai.storyteller.pdfcraft.desktop
      - install -Dm644 ai.storyteller.pdfcraft.metainfo.xml /app/share/metainfo/ai.storyteller.pdfcraft.metainfo.xml
      - install -Dm644 ai.storyteller.pdfcraft.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.pdfcraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: pdfcraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/pdfcraft/releases/download/v0.22.0/pdfcraft-0.22.0-linux-x86_64.tar.gz
        sha256: a8993f9ee96e87accecf90af4226ff60a84b9e1787ae9fd8fa48ffe1396bc35e
        size: 131269998
      - type: extra-data
        filename: pdfcraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/storytold/pdfcraft/releases/download/v0.22.0/pdfcraft-0.22.0-linux-aarch64.tar.gz
        sha256: ce137726550158e22c887cb8f71001e3b29d1741aea7492e0f0ff49054e2fe03
        size: 126226862
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: pdfcraft-wrapper
      - type: file
        path: pdfcraft-cli-wrapper
      - type: file
        path: ai.storyteller.pdfcraft.desktop
      - type: file
        path: ai.storyteller.pdfcraft.metainfo.xml
      - type: file
        path: ai.storyteller.pdfcraft.png
