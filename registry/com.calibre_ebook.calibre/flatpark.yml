id: com.calibre_ebook.calibre
name: calibre
summary: The one stop solution to all your e-book needs
website: https://calibre-ebook.com/
source_url: https://github.com/kovidgoyal/calibre
build:
  manifest: com.calibre_ebook.calibre.yml
  branch: stable
  mode: extra-data
catalog:
  category: Office
  tags:
    - EBook
    - Library
    - Reader
    - Converter
    - Qt
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions:
    # Sending books to MTP e-readers goes through libmtp over raw USB; there is
    # no narrower --device for it, and device sync is a core calibre feature.
    - --device=all
