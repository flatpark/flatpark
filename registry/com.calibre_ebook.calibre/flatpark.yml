id: com.calibre_ebook.calibre
name: calibre
summary: The one stop solution to all your e-book needs
website: https://calibre-ebook.com/
source_url: https://github.com/kovidgoyal/calibre
build:
  manifest: com.calibre_ebook.calibre.yml
  branch: stable
  mode: extra-data
catalog:
  category: Office
  tags:
    - EBook
    - Library
    - Reader
    - Converter
    - Qt
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions:
    # Sending books to MTP e-readers goes through libmtp over raw USB; there is
    # no narrower --device for it, and device sync is a core calibre feature.
    - --device=all

# What this package does around the vendor's build; shown on the site as the
# packaging level. See docs/packaging-playbook.md (golden rule 1).
packaging:
  - kind: seeded-config
    detail:
      en: "On first launch, sets the library location to a Calibre folder in your Documents."
      zh-Hans: "首次启动时把书库位置设为“文档”下的 Calibre 文件夹。"
