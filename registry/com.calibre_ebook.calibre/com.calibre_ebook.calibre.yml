id: com.calibre_ebook.calibre
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: calibre
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # calibre's Linux build is fully self-contained: it brings its own Python,
  # Qt 6, QtWebEngine, ffmpeg, OpenSSL, poppler, libmtp and espeak-ng. Only the
  # display, GL, fontconfig, NSS, X11/Wayland and audio stacks come from the
  # runtime (org.freedesktop.Platform 26.08 ships them — verified against the
  # bundle's NEEDED set; the handful it does not cover are optional Qt plugins
  # for the eglfs/linuxfb platforms and the flite/speech-dispatcher text-to-
  # speech backends, none of which are used on a normal desktop session, where
  # calibre's own bundled espeak-ng and piper engines drive Read aloud).
  - --share=ipc
  # Metadata downloads, news recipe fetching, the built-in store and the
  # content server. calibre is otherwise local-first: the library is a plain
  # directory of files with a SQLite index.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # Read aloud (text-to-speech) in the E-book viewer, and audio in EPUBs.
  - --socket=pulseaudio
  # QtWebEngine renders the viewer, the editor preview and the conversion
  # pipeline's page layout (GPU), and sending books to e-readers is a core
  # calibre feature: MTP readers (Kindle Scribe and newer, Android-based ones
  # like Boox or iReader) are driven through the bundled libmtp over raw USB,
  # which has no narrower --device than all. Declared in
  # policy.dangerous_permissions.
  - --device=all
  # calibre manages a *library*: a directory of book files plus its metadata
  # database. The library location itself needs persistent access (calibre
  # reopens it on every launch), but nothing else in home does: books are
  # added by copying them into the library and exported via Save to disk, both
  # through the file chooser portal (Qt's xdgdesktopportal theme, or zenity
  # under GNOME). Documents is where the wrapper points a fresh install's
  # library (calibre's own default, ~/Calibre Library, is deliberately not
  # granted: a :create grant would recreate it on every launch even after the
  # library has moved). Downloads is for adding freshly bought books and for
  # the auto-add watch folder (which deletes files once imported, hence rw).
  # A library anywhere else is an opt-in override documented in the metainfo.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # USB mass-storage readers (older Kindles, Kobo, PocketBook, ...) show up as
  # a removable drive: calibre finds them through sysfs, writes books to the
  # mount point under /run/media, and asks UDisks2 to mount or eject them.
  # Also lets a library live on an external drive. Still not
  # --filesystem=host (which is what Flathub's calibre grants).
  - --filesystem=/run/media
  - --system-talk-name=org.freedesktop.UDisks2
  # Follow the Qt/KDE colour scheme and font settings when the host sets them.
  - --filesystem=xdg-config/kdeglobals:ro
  # Job completion / error notifications from the main window.
  - --talk-name=org.freedesktop.Notifications
  # calibre's optional system tray icon (Preferences -> Look & feel).
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: calibre
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 calibre-wrapper /app/bin/calibre
      # Every calibre entry point runs through the same wrapper, which
      # dispatches on the name it was invoked under. These are the launchers
      # the exported desktop entries use plus the command-line tools worth
      # reaching with `flatpak run --command=<name> com.calibre_ebook.calibre`.
      - for c in ebook-viewer ebook-edit ebook-convert ebook-meta ebook-polish
        calibredb calibre-server calibre-smtp calibre-debug calibre-customize
        fetch-ebook-metadata lrfviewer web2disk; do ln -s calibre "/app/bin/$c";
        done
      - install -Dm644 com.calibre_ebook.calibre.desktop /app/share/applications/com.calibre_ebook.calibre.desktop
      - install -Dm644 com.calibre_ebook.calibre.ebook-viewer.desktop /app/share/applications/com.calibre_ebook.calibre.ebook-viewer.desktop
      - install -Dm644 com.calibre_ebook.calibre.ebook-edit.desktop /app/share/applications/com.calibre_ebook.calibre.ebook-edit.desktop
      - install -Dm644 com.calibre_ebook.calibre.metainfo.xml /app/share/metainfo/com.calibre_ebook.calibre.metainfo.xml
      # calibre's own MIME definitions (LRF/LRS, Mobipocket, Topaz, AZW3, ...)
      # so the exported entries can actually match those file types on the host.
      - install -Dm644 com.calibre_ebook.calibre.mime.xml /app/share/mime/packages/com.calibre_ebook.calibre.xml
      - install -Dm644 com.calibre_ebook.calibre.png /app/share/icons/hicolor/256x256/apps/com.calibre_ebook.calibre.png
      - install -Dm644 com.calibre_ebook.calibre.ebook-viewer.png /app/share/icons/hicolor/256x256/apps/com.calibre_ebook.calibre.ebook-viewer.png
      - install -Dm644 com.calibre_ebook.calibre.ebook-edit.png /app/share/icons/hicolor/256x256/apps/com.calibre_ebook.calibre.ebook-edit.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: calibre.txz
        only-arches:
          - x86_64
        url: https://github.com/kovidgoyal/calibre/releases/download/v9.15.0/calibre-9.15.0-x86_64.txz
        sha256: 3f5301c0aa51e5fb2d5f6dcd04024ba4e86501ab328ce5d9d6760efccb887990
        size: 194998300
      - type: extra-data
        filename: calibre-arm64.txz
        only-arches:
          - aarch64
        url: https://github.com/kovidgoyal/calibre/releases/download/v9.15.0/calibre-9.15.0-arm64.txz
        sha256: 15ab887f9d787809bc834ca0ea6408e981b409f0b23046c41c18de948eb50a38
        size: 182488416
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: calibre-wrapper
      - type: file
        path: com.calibre_ebook.calibre.desktop
      - type: file
        path: com.calibre_ebook.calibre.ebook-viewer.desktop
      - type: file
        path: com.calibre_ebook.calibre.ebook-edit.desktop
      - type: file
        path: com.calibre_ebook.calibre.metainfo.xml
      - type: file
        path: com.calibre_ebook.calibre.mime.xml
      - type: file
        path: com.calibre_ebook.calibre.png
      - type: file
        path: com.calibre_ebook.calibre.ebook-viewer.png
      - type: file
        path: com.calibre_ebook.calibre.ebook-edit.png
