id: com.nuvio.media.desktop
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: nuvio
separate-locales: false
build-options:
  no-debuginfo: true
  strip: true
finish-args:
  # Java/Compose Desktop app with its own bundled Java 17 runtime. Java's AWT is
  # X11-only, and the native player bridge embeds its mpv and WebKitGTK surfaces
  # into the AWT window through X11/XComposite (it forces GDK onto x11), so the
  # app runs on XWayland in a Wayland session. Granting x11 (not fallback-x11)
  # is what makes that work.
  - --share=ipc
  - --socket=x11
  # GPU-accelerated Compose rendering and mpv's hardware decoding.
  - --device=dri
  # Playback.
  - --socket=pulseaudio
  # Catalog and metadata services, Trakt and account sync, add-ons and the
  # streams they return.
  - --share=network
  # The subtitle-font import uses Java's AWT file dialog, which doesn't go
  # through the file chooser portal and only sees what the sandbox can; the
  # Downloads folder is where a font fetched from the web lands. Nuvio's own
  # offline downloads stay in its data directory under ~/.var/app.
  - --filesystem=xdg-download
  # The sign-in session is kept by the Supabase client in Java Preferences,
  # which Java writes under $HOME/.java (user.home is not redirected). Keep
  # that directory under ~/.var/app instead of the sandbox's throwaway home,
  # so a signed-in account survives a restart without sharing the host's
  # ~/.java with every other Java app.
  - --persist=.java
  # Not granted by default — the app works without it; opt in per the
  # metainfo:
  #   --filesystem=xdg-run/discord-ipc-0   -> Discord rich presence
modules:
  # The player bridge links libmpv.so.2, which the .deb leaves to the system
  # (Depends: libmpv2) and the GNOME runtime doesn't ship. The prebuilt stack
  # installs it under /app/lib, on the loader's default path in the sandbox.
  # mpv-v3 or later: the bridge embeds mpv into the AWT window over X11
  # (gpu-context=x11egl/x11vk), and mpv-v2 was built without X11 output.
  # Everything else it links (WebKitGTK 4.1, GTK 3, GStreamer) is in the
  # runtime.
  - name: mpv-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/mpv-v3/mpv-stack-mpv-v3-gnome-51-x86_64.tar.xz
        sha256: 5c059a15941eb4fc69c831ccf9ee40a94fe04b2ec4d13a59bf7730094412bf58

  - name: nuvio
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 nuvio-wrapper /app/bin/nuvio
      - install -Dm644 com.nuvio.media.desktop.desktop /app/share/applications/com.nuvio.media.desktop.desktop
      - install -Dm644 com.nuvio.media.desktop.metainfo.xml /app/share/metainfo/com.nuvio.media.desktop.metainfo.xml
      - install -Dm644 com.nuvio.media.desktop.png /app/share/icons/hicolor/256x256/apps/com.nuvio.media.desktop.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: nuvio.deb
        only-arches:
          - x86_64
        url: https://github.com/NuvioMedia/NuvioDesktop/releases/download/0.1.39-alpha/Nuvio-Linux-x86_64-0.1.39-alpha.deb
        sha256: e7c06e3ea0af7044d7511154a2705d0bd5a216c8f6c53cb675fec270f110f969
        size: 144753472
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: nuvio-wrapper
      - type: file
        path: com.nuvio.media.desktop.desktop
      - type: file
        path: com.nuvio.media.desktop.metainfo.xml
      - type: file
        path: com.nuvio.media.desktop.png
