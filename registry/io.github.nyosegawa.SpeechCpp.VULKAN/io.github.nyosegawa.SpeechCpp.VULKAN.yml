id: io.github.nyosegawa.SpeechCpp.VULKAN
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: speech
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Download model weights and serve the local browser interface and audio API.
  - --share=network
  # Vulkan inference uses the GPU through the runtime graphics drivers.
  - --device=dri
modules:
  - name: speech
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 speech-wrapper /app/bin/speech
      - install -Dm644 io.github.nyosegawa.SpeechCpp.VULKAN.desktop /app/share/applications/io.github.nyosegawa.SpeechCpp.VULKAN.desktop
      - install -Dm644 io.github.nyosegawa.SpeechCpp.VULKAN.metainfo.xml /app/share/metainfo/io.github.nyosegawa.SpeechCpp.VULKAN.metainfo.xml
      - install -Dm644 io.github.nyosegawa.SpeechCpp.VULKAN.svg /app/share/icons/hicolor/scalable/apps/io.github.nyosegawa.SpeechCpp.VULKAN.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: speech.zip
        only-arches:
          - x86_64
        url: https://github.com/nyosegawa/speech.cpp/releases/download/v0.11.2/speech-0.11.2-linux-x64-vulkan.zip
        sha256: 28e6841c650c8a4d7c5be06b8e34eb2f14d43f8b26d52fc73f24b504875dc12d
        size: 32725105
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: speech-wrapper
      - type: file
        path: io.github.nyosegawa.SpeechCpp.VULKAN.desktop
      - type: file
        path: io.github.nyosegawa.SpeechCpp.VULKAN.metainfo.xml
      - type: file
        path: io.github.nyosegawa.SpeechCpp.VULKAN.svg
