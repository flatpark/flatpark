# FlatPark catalog descriptor for Fable Flight.
#
# FlatPark (https://flatpark.org/) is a signed Flatpak remote that repackages
# official vendor downloads as extra-data - it does not build from source. This
# file is the catalog entry; io.github.Rolandjg.FableFlight.yml is the Flatpak
# manifest it points at.
#
# read-descriptor.mjs in flatpark/flatpark is a line scanner, not a YAML parser,
# so keep the plain two-space block style below exactly as it is.
id: io.github.Rolandjg.FableFlight
name: Fable Flight
summary: Open-world flight simulator with real weather and live air traffic
website: https://github.com/Rolandjg/fableflight
source_url: https://github.com/Rolandjg/fableflight
build:
  manifest: io.github.Rolandjg.FableFlight.yml
  branch: stable
  mode: extra-data
  arches:
    - x86_64
    - aarch64
catalog:
  category: Game
  upstream_approved: false
  tags:
    - Flight Simulator
    - Simulation
    - Rust
    - Multiplayer
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
