id: com.rootapp.Root
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: root
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Root is a .NET (Avalonia, NativeAOT) app with an embedded DotNetBrowser
  # Chromium for app pages and a LiveKit engine for calls. The AppImage carries
  # its own Chromium, Skia, HarfBuzz and LiveKit libraries; the GTK3, NSS,
  # ALSA, CUPS, gbm, X11 and fontconfig stacks they link come from the runtime.
  - --share=ipc
  # The whole app: Root's servers, calls and app pages.
  - --share=network
  # Avalonia draws through X11 only and exits with "XOpenDisplay failed"
  # without it, so x11 is granted outright, not as a fallback.
  - --socket=x11
  # GPU-accelerated rendering and video.
  - --device=dri
  # Voice calls and message sounds.
  - --socket=pulseaudio
  # Message notifications.
  - --talk-name=org.freedesktop.Notifications
  # Tray icon: Avalonia registers an org.kde.StatusNotifierItem name.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*
  # Not granted by default, opt in per the metainfo:
  #   --device=all  -> camera for video calls
modules:
  - name: root
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 root-wrapper /app/bin/root
      - install -Dm644 com.rootapp.Root.desktop /app/share/applications/com.rootapp.Root.desktop
      - install -Dm644 com.rootapp.Root.metainfo.xml /app/share/metainfo/com.rootapp.Root.metainfo.xml
      - install -Dm644 com.rootapp.Root.png /app/share/icons/hicolor/512x512/apps/com.rootapp.Root.png
    sources:
      # appimage-offset + unsquashfs, so apply_extra can open the AppImage
      # offline with no FUSE. Outside the managed block, which the updater
      # rebuilds from the resolver output.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v3/appimage-tools-appimage-tools-v3-fd-26.08-x86_64.tar.xz
        sha256: 2ad7847e871c2f7f24506ecf202ea971ab684aaa457e2f6a594f6bfac96f1297
        size: 57508
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - aarch64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v3/appimage-tools-appimage-tools-v3-fd-26.08-aarch64.tar.xz
        sha256: 96fbb5d8b79c53954bad1e2760efd34ab9267b9e6783b7c60930214e44cf7e18
        size: 51796
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: root.nupkg
        only-arches:
          - x86_64
        url: https://installer.rootapp.com/installer/Linux/X64/Root-0.9.167-linux-full.nupkg
        sha256: 2948fafdf4f45011f3c7685ea2dc751659832518342eebb10a7f1efd86f706ec
        size: 510828148
      - type: extra-data
        filename: root.nupkg
        only-arches:
          - aarch64
        url: https://installer.rootapp.com/installer/Linux/Arm64/Root-0.9.167-linux-full.nupkg
        sha256: 3d337b713f2876be5bbf493d0cad853b183a46ec990888682a94587e81be9bd5
        size: 487388411
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: root-wrapper
      - type: file
        path: com.rootapp.Root.desktop
      - type: file
        path: com.rootapp.Root.metainfo.xml
      - type: file
        path: com.rootapp.Root.png
