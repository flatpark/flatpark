id: com.edde746.plezy
name: Plezy
summary: Watch and listen to your Plex, Jellyfin and Emby libraries
website: https://plezy.app
source_url: https://github.com/edde746/plezy
build:
  manifest: com.edde746.plezy.yml
  branch: stable
  mode: extra-data
catalog:
  category: AudioVideo
  upstream_approved: false
  tags:
    - Plex
    - Jellyfin
    - Emby
    - Media
    - Player
    - Flutter
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions:
    - --device=all
