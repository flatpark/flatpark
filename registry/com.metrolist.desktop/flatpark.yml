id: com.metrolist.desktop
name: Metrolist
summary: Material Design YouTube Music client
website: https://metrolist.cc
source_url: https://github.com/MetrolistGroup/Metrolist
build:
  manifest: com.metrolist.desktop.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: AudioVideo
  upstream_approved: true
  tags:
    - Music
    - Player
    - Streaming
    - YouTube Music
    - Compose
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
upstream:
  # Upstream's own Flatpak manifest builds from source; this package pins the
  # official AppImage as extra-data, so module names differ on purpose. The
  # diff keeps the permissions in step.
  manifest: flatpak/com.metrolist.desktop.yaml
  accept_missing_modules:
    # Upstream compiles the app with a JDK module; the official AppImage
    # pinned here carries its own Java runtime.
    - openjdk
