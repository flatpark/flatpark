id: eu.jumplink.beifahrer
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: beifahrer
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-config/beifahrer:create
  - --filesystem=xdg-run/beifahrer:create
modules:
  - name: beifahrer
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 beifahrer-wrapper /app/bin/beifahrer
      - install -Dm644 eu.jumplink.beifahrer.desktop /app/share/applications/eu.jumplink.beifahrer.desktop
      - install -Dm644 eu.jumplink.beifahrer.metainfo.xml /app/share/metainfo/eu.jumplink.beifahrer.metainfo.xml
      - install -Dm644 eu.jumplink.beifahrer.png /app/share/icons/hicolor/128x128/apps/eu.jumplink.beifahrer.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: app.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/JumpLink/beifahrer/releases/download/v0.1.36/beifahrer-0.1.36-linux-x86_64-flatpak.tar.gz
        sha256: 093527b02b4682523c6e58f7cd9b44f6c619f91cb3f4901c142f36a2bca94d1b
        size: 598862
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: beifahrer-wrapper
      - type: file
        path: eu.jumplink.beifahrer.desktop
      - type: file
        path: eu.jumplink.beifahrer.metainfo.xml
      - type: file
        path: eu.jumplink.beifahrer.png
