<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Tessera: a tessera hospitalis, the Roman token broken in two halves
       that fit only each other, in patinated bronze; a chip on one half. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9c8a"/><stop offset="1" stop-color="#2f7266"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d775"/><stop offset="1" stop-color="#e0ac2e"/>
    </linearGradient>
    <clipPath id="left"><path d="M0 0H66L58 32L70 52L56 72L68 94L60 128H0Z"/></clipPath>
    <clipPath id="right"><path d="M128 0H66L58 32L70 52L56 72L68 94L60 128H128Z"/></clipPath>
    <g id="tile">
      <rect x="14" y="22" width="100" height="94" rx="16" fill="#1f4e46"/>
      <rect x="14" y="14" width="100" height="94" rx="16" fill="url(#face)"/>
    </g>
  </defs>
  <g transform="translate(-5 0)" clip-path="url(#left)"><use href="#tile"/></g>
  <g transform="translate(5 -4)"><g clip-path="url(#right)"><use href="#tile"/></g></g>
  <rect x="17" y="40" width="38" height="42" rx="7" fill="url(#gold)" stroke="#a9781a" stroke-width="2.4"/>
  <g fill="none" stroke="#a9781a" stroke-width="2.2" stroke-linecap="round">
    <path d="M29.5 40v42M42.5 40v42M17 54h12.5M17 68h12.5M42.5 54h12.5M42.5 68h12.5M29.5 61h13"/>
  </g>
  <g fill="none" stroke="#cdeee4" stroke-opacity="0.85" stroke-width="3.2" stroke-linecap="round">
    <path d="M85 40h20M95 40v34"/>
  </g>
</svg>
