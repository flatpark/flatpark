id: com.xerahs.XerahS
name: XerahS
summary: Screen capture, annotation and sharing from the ShareX team
website: https://xerahs.com
source_url: https://github.com/ShareX/XerahS
build:
  manifest: com.xerahs.XerahS.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: Graphics
  upstream_approved: true
  tags:
    - Screenshot
    - Screen Capture
    - Annotation
    - Upload
    - ShareX
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions:
    # Screen recording: XerahS hands the portal's node id to a gst-launch
    # child, which connects to the default PipeWire socket instead of the
    # portal's fd. The socket also exposes every camera and other apps' video
    # streams; see docs/packagers/permissions.md#the-pipewire-socket.
    - --filesystem=xdg-run/pipewire-0
