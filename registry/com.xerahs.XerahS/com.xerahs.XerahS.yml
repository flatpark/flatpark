id: com.xerahs.XerahS
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: xerahs
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Self-contained .NET 10 / Avalonia app (single-file XerahS plus the
  # watch-folder daemon, upload plugins and a small web UI). The runtime supplies
  # GTK3, fontconfig, ICU and the X11 client libraries it loads, and the
  # WebKitGTK 4.1 it can use, which is why this is the GNOME runtime rather than
  # the bare freedesktop one.
  - --share=ipc
  # Avalonia's Linux backend in this payload is X11 (upstream's own Flatpak
  # permission notes say the same), so X11 is required, not a fallback. On a
  # Wayland session it runs through XWayland. Capture itself goes through the
  # xdg-desktop-portal Screenshot and ScreenCast interfaces, which need no grant.
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # Screen recording on Wayland: after the ScreenCast portal hands back a
  # PipeWire node, XerahS records it by spawning `gst-launch-1.0 pipewiresrc
  # path=<node>`, which connects to the default PipeWire socket. Without this
  # grant there is no socket in the sandbox and recording fails with
  # "pipewiresrc: Failed to connect". (Its ffmpeg path needs `-f pipewire`,
  # which no mainline FFmpeg build has, so the runtime's GStreamer is what runs.)
  - --filesystem=xdg-run/pipewire-0
  # The recorder's "system audio" and "microphone" options use pulsesrc.
  - --socket=pulseaudio
  # The 30+ upload destinations (Imgur, S3, FTP, Nextcloud...), URL shorteners
  # and the update check.
  - --share=network
  # Tray, as upstream asked for it (ShareX/XerahS#285, and the same pair of
  # grants as their own manifest): Avalonia's tray owns
  # org.kde.StatusNotifierItem-<pid>-<id> and registers it with the watcher.
  # Every sandboxed app is PID 2, so if another Flatpak tray app already holds
  # the same name, XerahS starts without a tray icon. The usual fake-getpid
  # shim is not an option here: CoreCLR reads /proc/<getpid()> during start-up
  # and fails to initialise with a fake PID.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*
  # Settings, history and captures live under the XDG dirs Flatpak redirects into
  # ~/.var/app/com.xerahs.XerahS; saving elsewhere goes through the file chooser.
  # No home or host filesystem grant.
modules:
  - name: xerahs
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 xerahs-wrapper /app/bin/xerahs
      - install -Dm644 com.xerahs.XerahS.desktop /app/share/applications/com.xerahs.XerahS.desktop
      - install -Dm644 com.xerahs.XerahS.metainfo.xml /app/share/metainfo/com.xerahs.XerahS.metainfo.xml
      - install -Dm644 com.xerahs.XerahS.png /app/share/icons/hicolor/512x512/apps/com.xerahs.XerahS.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: xerahs.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/ShareX/XerahS/releases/download/v0.25.5/XerahS-0.25.5-linux-x64.tar.gz
        sha256: 77efd25db2356d3510a0d532c3c5e8a3fbb3d4999e02f1828292c8a582134f1a
        size: 218315939
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: xerahs-wrapper
      - type: file
        path: com.xerahs.XerahS.desktop
      - type: file
        path: com.xerahs.XerahS.metainfo.xml
      - type: file
        path: com.xerahs.XerahS.png
