id: io.github.antonio.RecGo
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: recgo
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-videos
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: recgo
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 recgo-wrapper /app/bin/recgo
      - install -Dm644 io.github.antonio.RecGo.desktop /app/share/applications/io.github.antonio.RecGo.desktop
      - install -Dm644 io.github.antonio.RecGo.metainfo.xml /app/share/metainfo/io.github.antonio.RecGo.metainfo.xml
      - install -Dm644 io.github.antonio.RecGo.gschema.xml /app/share/glib-2.0/schemas/io.github.antonio.RecGo.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
      - install -Dm644 io.github.antonio.RecGo.png /app/share/icons/hicolor/512x512/apps/io.github.antonio.RecGo.png
      - install -Dm644 io.github.antonio.RecGo.svg /app/share/icons/hicolor/scalable/apps/io.github.antonio.RecGo.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: recgo.deb
        only-arches:
          - x86_64
        url: https://github.com/Antux912012/RecGo/releases/download/v0.1.3/recgo_0.1.3_amd64.deb
        sha256: ae2b4827927b5b4cc2584818859a930d45765492324cdd3c9da9a175ebeffe92
        size: 1633180
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: recgo-wrapper
      - type: file
        path: io.github.antonio.RecGo.desktop
      - type: file
        path: io.github.antonio.RecGo.metainfo.xml
      - type: file
        path: io.github.antonio.RecGo.gschema.xml
      - type: file
        path: io.github.antonio.RecGo.png
      - type: file
        path: io.github.antonio.RecGo.svg
