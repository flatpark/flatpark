id: ai.storyteller.craft-anything
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: craft-anything
separate-locales: false
build-options:
  no-debuginfo: true
# The app id, runtime and finish-args follow upstream's own Flatpak manifest
# (packaging/linux/flatpak/ in storytold/craft-anything), so this package and the
# single-file bundle upstream attaches to each release are the same
# application. The binaries need only glibc from the runtime.
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu GPU compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Open dialogs go through the file-chooser portal and drag-and-drop through
  # the document portal. Home is readable (never writable) so files passed by
  # path (command line, recent targets) can be inspected.
  - --filesystem=home:ro
  # AI backends (Anthropic, OpenAI, OpenRouter, local servers) and engine downloads.
  - --share=network
modules:
  - name: craft-anything
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 craft-anything-wrapper /app/bin/craft-anything
      - install -Dm755 craft-anything-cli-wrapper /app/bin/craft-anything-cli
      - install -Dm644 ai.storyteller.craft-anything.desktop /app/share/applications/ai.storyteller.craft-anything.desktop
      - install -Dm644 ai.storyteller.craft-anything.metainfo.xml /app/share/metainfo/ai.storyteller.craft-anything.metainfo.xml
      - install -Dm644 ai.storyteller.craft-anything.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.craft-anything.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: craft-anything.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/craft-anything/releases/download/v0.6.1/craft-anything-0.6.1-linux-x86_64.tar.gz
        sha256: 83ec0730c9117f399122b315c63ed4c3a8d31ac55bddd74cb8b33cd2f76ef704
        size: 70371364
      - type: extra-data
        filename: craft-anything.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/storytold/craft-anything/releases/download/v0.6.1/craft-anything-0.6.1-linux-aarch64.tar.gz
        sha256: b4255ac806e2a598b9fc6dba4e8ed2190e49baafd2f68dd7e037f3294e472941
        size: 67089499
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: craft-anything-wrapper
      - type: file
        path: craft-anything-cli-wrapper
      - type: file
        path: ai.storyteller.craft-anything.desktop
      - type: file
        path: ai.storyteller.craft-anything.metainfo.xml
      - type: file
        path: ai.storyteller.craft-anything.png
