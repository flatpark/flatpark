id: ai.storyteller.materialcraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: materialcraft
separate-locales: false
build-options:
  no-debuginfo: true
# The app id, runtime and finish-args follow upstream's own Flatpak manifest
# (packaging/linux/flatpak/ in storytold/materialcraft), so this package and the
# single-file bundle upstream attaches to each release are the same
# application. The binaries need only glibc and libgcc from the runtime.
finish-args:
  # Native Rust/egui app on winit; libwayland, libX11/xcb, xkbcommon and the
  # Vulkan/EGL loaders are dlopen()ed from the runtime.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu GPU compositor for the 2D and 3D previews (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save go through the file-chooser portal. Pictures and Documents are
  # granted so files passed by path (command line, Open Recent, saving next to
  # the original) keep working there.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  # Deliberately not granted, as upstream:
  #   --share=network          -> the optional --control automation server;
  #                               the metainfo documents the override
  #   --filesystem=home / host -> everything else goes through the portals
modules:
  - name: materialcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 materialcraft-wrapper /app/bin/materialcraft
      - install -Dm755 materialcraft-cli-wrapper /app/bin/materialcraft-cli
      - install -Dm644 ai.storyteller.materialcraft.desktop /app/share/applications/ai.storyteller.materialcraft.desktop
      - install -Dm644 ai.storyteller.materialcraft.metainfo.xml /app/share/metainfo/ai.storyteller.materialcraft.metainfo.xml
      - install -Dm644 ai.storyteller.materialcraft.mime.xml /app/share/mime/packages/ai.storyteller.materialcraft.xml
      - install -Dm644 ai.storyteller.materialcraft.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.materialcraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: materialcraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/materialcraft/releases/download/v0.2.0/materialcraft-0.2.0-linux-x86_64.tar.gz
        sha256: 3c7b6c1a4755e204ce6e0ea6813f1622eb1c36c15a45d53ba3722735780b26f6
        size: 17680614
      - type: extra-data
        filename: materialcraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/storytold/materialcraft/releases/download/v0.2.0/materialcraft-0.2.0-linux-aarch64.tar.gz
        sha256: f8b9fd8b18d83dc6912edf4e7d7b6b2371988c1bca43793ea6da591448ba5da5
        size: 16453824
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: materialcraft-wrapper
      - type: file
        path: materialcraft-cli-wrapper
      - type: file
        path: ai.storyteller.materialcraft.desktop
      - type: file
        path: ai.storyteller.materialcraft.metainfo.xml
      - type: file
        path: ai.storyteller.materialcraft.mime.xml
      - type: file
        path: ai.storyteller.materialcraft.png
