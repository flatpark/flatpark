id: io.github.EricLBuehler.MistralRs.CPU
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: mistralrs
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Download model weights and serve the HTTP API and browser UI.
  - --share=network
  # Preserve the upstream model cache in this edition's private app storage.
  - --persist=.cache/huggingface
modules:
  - name: mistralrs
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 mistralrs-wrapper /app/bin/mistralrs
      - install -Dm644 io.github.EricLBuehler.MistralRs.CPU.desktop /app/share/applications/io.github.EricLBuehler.MistralRs.CPU.desktop
      - install -Dm644 io.github.EricLBuehler.MistralRs.CPU.metainfo.xml /app/share/metainfo/io.github.EricLBuehler.MistralRs.CPU.metainfo.xml
      - install -Dm644 io.github.EricLBuehler.MistralRs.CPU.svg /app/share/icons/hicolor/scalable/apps/io.github.EricLBuehler.MistralRs.CPU.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: mistralrs.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/EricLBuehler/mistral.rs/releases/download/v0.9.5/mistralrs-cpu-x86_64-unknown-linux-gnu.tar.gz
        sha256: 9b542da90b6541abd599ff275e3246fa6e144885bdcd67d1f0aefdba1729f7b5
        size: 36346799
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: mistralrs-wrapper
      - type: file
        path: io.github.EricLBuehler.MistralRs.CPU.desktop
      - type: file
        path: io.github.EricLBuehler.MistralRs.CPU.metainfo.xml
      - type: file
        path: io.github.EricLBuehler.MistralRs.CPU.svg
