id: com.tradingview.tradingview
name: TradingView
summary: Where the world charts, chats and trades markets
website: https://www.tradingview.com
source_url: https://github.com/flathub/com.tradingview.tradingview
build:
  manifest: com.tradingview.tradingview.yml
  branch: stable
  mode: extra-data
catalog:
  # closed app; source_url is a packaging repo, whose stars are not the app's
  stars_repo: none
  category: Finance
  tags:
    - Trading
    - Markets
    - Charts
    - Investing
update:
  command: ./resolve-update.sh
policy:
  proprietary: true
  dangerous_permissions: []
