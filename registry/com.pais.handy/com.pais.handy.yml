id: com.pais.handy
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: handy
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Tauri and WebKitGTK desktop window.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Vulkan transcription uses the host GPU; CPU inference remains available
  # when Vulkan is unavailable. No CUDA libraries or CUDA permissions are used.
  - --device=dri
  # Download speech models and access optional online model/post-processing APIs.
  - --share=network
  # Handy's tray icon is provided by Tauri's tray plugin.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
modules:
  # Tauri's tray plugin loads libayatana-appindicator, which GNOME 51 does not
  # ship. Use FlatPark's shared GNOME 51 stack.
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v2/ayatana-stack-ayatana-v2-gnome-51-x86_64.tar.xz
        sha256: 1051a537f22d335eb79557b8c5a610a12c326712dac74032de8e76e78b876fdc
  # enigo links libxdo.so.3 on Linux; the runtime does not provide it. This is
  # needed to start the unmodified upstream binary even though this package is
  # presented primarily for file transcription.
  - name: libxdo
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/libxdo-v2/libxdo-libxdo-v2-gnome-51-x86_64.tar.xz
        sha256: 6934f6aa6c8264575444e8b00330855b45242a455f0b4a9bff52a89bf9e3aa6a
  - name: handy
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 handy-wrapper /app/bin/handy
      - install -Dm644 com.pais.handy.desktop /app/share/applications/com.pais.handy.desktop
      - install -Dm644 com.pais.handy.metainfo.xml /app/share/metainfo/com.pais.handy.metainfo.xml
      - install -Dm644 com.pais.handy.png /app/share/icons/hicolor/256x256/apps/com.pais.handy.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: handy.deb
        only-arches: [x86_64]
        url: https://github.com/cjpais/Handy/releases/download/v0.10.1/Handy_0.10.1_amd64.deb
        sha256: a59c741e52ddf7148f2ec01590c2675813badc126129bbbd4064269ae214e924
        size: 34341014
      # END MANAGED EXTRA-DATA
      # GNOME 51 lacks GTK layer shell; OpenBLAS is part of Handy's CPU
      # transcription backend. Both are Debian trixie runtime libraries.
      # BEGIN MANAGED DEBIAN trixie main
      - type: extra-data
        filename: libgtk-layer-shell0.deb
        only-arches: [x86_64]
        url: https://deb.debian.org/debian/pool/main/g/gtk-layer-shell/libgtk-layer-shell0_0.9.0-2_amd64.deb
        sha256: de8f0e98a4f48cea3bee516f76b5c314e5e6e7e684fff91fc26a87e970f5edbf
        size: 56592
      - type: extra-data
        filename: libopenblas0-pthread.deb
        only-arches: [x86_64]
        url: https://deb.debian.org/debian/pool/main/o/openblas/libopenblas0-pthread_0.3.29+ds-3_amd64.deb
        sha256: e3541ee2c956c64383054ba116fb6ef86bbaf40035d64e1795185029fdcf0807
        size: 6740184
      # END MANAGED DEBIAN
      - type: file
        path: apply_extra.sh
      - type: file
        path: handy-wrapper
      - type: file
        path: com.pais.handy.desktop
      - type: file
        path: com.pais.handy.metainfo.xml
      - type: file
        path: com.pais.handy.png
