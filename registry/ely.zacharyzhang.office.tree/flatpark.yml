# FlatPark catalog descriptor for ElyTree, part of Ely Office.
#
# read-descriptor.mjs is a line scanner, not a YAML parser; keep the plain
# two-space block style below.
id: ely.zacharyzhang.office.tree
name: ElyTree
summary: Git client for staging, history, branches and remotes
website: https://office.elygpui.com
source_url: https://git.zacharyzhang.com/ZacharyZhang-NY/ElyOffice
build:
  manifest: ely.zacharyzhang.office.tree.yml
  branch: stable
  mode: extra-data
catalog:
  category: Development
  tags:
    - Git
    - Version Control
    - VCS
    - Offline
update:
  command: ./resolve-update.sh
policy:
  # AGPL-3.0-or-later (upstream LICENSE and the .deb's own licence field).
  proprietary: false
  dangerous_permissions:
    # A Git client opens repositories wherever the user keeps them and needs
    # the user's ~/.gitconfig, ~/.ssh and signing keys; see the manifest.
    - --filesystem=home
