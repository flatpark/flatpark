id: app.motrix.native
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
# Electron app: use the Electron base app, which ships zypak. zypak redirects
# Chromium's SUID sandbox onto the Flatpak sandbox so the app keeps an internal
# sandbox (the wrapper runs it via zypak-wrapper) instead of --no-sandbox.
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: motrix
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Electron (Chromium) download manager. The prebuilt app bundles Chromium, its
  # own ffmpeg/ANGLE and the aria2 engine it drives; the GTK3, NSS, CUPS, ATK and
  # X11 stacks it links come from org.freedesktop.Platform 26.08.
  - --share=ipc
  # The downloads themselves, plus aria2's BitTorrent/DHT traffic and the local
  # JSON-RPC listener the browser extension talks to.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Default destination. Flatpak maps xdg-download into the sandbox, so the app's
  # default "~/Downloads" resolves to the real Downloads folder. Any other save
  # directory is granted per-folder through the file chooser portal, or by the
  # user with `flatpak override --filesystem=...` (documented in the metainfo).
  - --filesystem=xdg-download
  # Download-complete notifications and the tray icon the app puts up on start.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Chromium registers its tray item under org.freedesktop.StatusNotifierItem-
  # <pid>-<n>, and every app in a Flatpak sandbox sees itself as PID 2, so the
  # name it asks for is fixed. Without this grant the session bus proxy refuses
  # the RequestName and the tray icon never appears (the app logs
  # "Failed to get the ownership of org.freedesktop.StatusNotifierItem-2-1").
  # The KDE-namespaced name is the older spelling of the same item; grant both
  # so the icon works whichever one Chromium picks.
  - --own-name=org.freedesktop.StatusNotifierItem-2-1
  - --own-name=org.kde.StatusNotifierItem-2-1
  # "Open containing folder" on a finished task goes through Electron's
  # shell.showItemInFolder, which calls org.freedesktop.FileManager1.ShowItems —
  # the host's file manager, not a portal, so the session bus proxy hides it
  # without this grant and the menu entry does nothing at all.
  - --talk-name=org.freedesktop.FileManager1
  # Without a cursor theme path the Wayland cursor renders at the wrong size in
  # the sandbox. Same value upstream sets in their own Flatpak manifest.
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  # The app picks between a light-panel (dark glyph) and a dark-panel (light
  # glyph) tray icon from Electron's dark-mode detection, which on Linux reads
  # GTK's gtk-application-prefer-dark-theme. With no GTK config visible the
  # sandbox has no signal at all and the choice comes out arbitrary — the same
  # build produced a white icon on one launch and a black one on the next.
  # This read-only grant lets the detection follow the host's declared
  # preference, the way a native install does.
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/gtk-4.0:ro
  # Strip a leaked ELECTRON_RUN_AS_NODE from the sandbox env so the binary — and
  # zypak's spawned child/zygote processes, which the wrapper's own `unset`
  # can't reach — always start as the GUI app rather than as plain Node.
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: motrix
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 motrix-wrapper /app/bin/motrix
      - install -Dm644 app.motrix.native.desktop /app/share/applications/app.motrix.native.desktop
      - install -Dm644 app.motrix.native.metainfo.xml /app/share/metainfo/app.motrix.native.metainfo.xml
      - install -Dm644 app.motrix.native.png /app/share/icons/hicolor/512x512/apps/app.motrix.native.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: motrix.deb
        only-arches:
          - x86_64
        url: https://github.com/agalwood/Motrix/releases/download/v2.0.0-beta.39/Motrix_2.0.0-beta.39_amd64.deb
        sha256: a452637849f78bd417836a5897df7a477890b73883fba7616da55c679db04aeb
        size: 110313172
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: motrix-wrapper
      - type: file
        path: app.motrix.native.desktop
      - type: file
        path: app.motrix.native.metainfo.xml
      - type: file
        path: app.motrix.native.png
