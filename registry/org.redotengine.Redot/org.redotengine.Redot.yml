id: org.redotengine.Redot
# The official editor build is one self-contained binary that links only libc,
# libm and the loader; the engine brings its own toolkit, fonts and renderer.
# The freedesktop runtime provides what it leaves to the host (display,
# GL/Vulkan, fontconfig and audio).
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: redot
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # The editor renders through Vulkan or OpenGL and starts on X11, or on
  # Wayland when X11 isn't available (or "prefer_wayland" is set).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Projects are directories the editor reads and writes directly, with its own
  # file dialog, and its default project location is the home directory. A
  # narrower grant would leave a new project in the sandbox's throwaway $HOME.
  # Declared in flatpark.yml.
  - --filesystem=home
  # The Asset Library, export template downloads and the editor's update
  # notice; the debugger and language server also listen on localhost.
  - --share=network
  # The running game and the editor's audio previews play through PulseAudio.
  - --socket=pulseaudio
modules:
  - name: redot
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 redot-wrapper /app/bin/redot
      - install -Dm644 org.redotengine.Redot.desktop /app/share/applications/org.redotengine.Redot.desktop
      - install -Dm644 org.redotengine.Redot.metainfo.xml /app/share/metainfo/org.redotengine.Redot.metainfo.xml
      - install -Dm644 org.redotengine.Redot.svg /app/share/icons/hicolor/scalable/apps/org.redotengine.Redot.svg
      # Upstream's MIME definitions for project, scene, resource, shader and
      # GDScript files (misc/dist/linux/org.redotengine.Redot.xml).
      - install -Dm644 org.redotengine.Redot.mime.xml /app/share/mime/packages/org.redotengine.Redot.xml
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: redot.zip
        only-arches:
          - x86_64
        url: https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.3-stable/Redot_v26.3-stable_linux_x64.zip
        sha256: 7d5155b80f4262f0a394c5040e539bb330cb63dd147bedd9172d83ec2efdbd91
        size: 76990433
      - type: extra-data
        filename: redot.zip
        only-arches:
          - aarch64
        url: https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.3-stable/Redot_v26.3-stable_linux_arm64.zip
        sha256: 94d184e0f5c464d5070a5688ab336155aeb408e91be3aa628ac410aa792730c5
        size: 75010304
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: redot-wrapper
      - type: file
        path: org.redotengine.Redot.desktop
      - type: file
        path: org.redotengine.Redot.metainfo.xml
      - type: file
        path: org.redotengine.Redot.svg
      - type: file
        path: org.redotengine.Redot.mime.xml
