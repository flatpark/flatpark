# FlatPark catalog descriptor for OpenPencil.
#
# FlatPark (https://flatpark.org/) is a signed Flatpak remote that repackages
# official vendor downloads as extra-data - it does not build from source. This
# file is the catalog entry; dev.openpencil.OpenPencil.yml is the Flatpak
# manifest it points at.
#
# read-descriptor.mjs in flatpark/flatpark is a line scanner, not a YAML parser,
# so keep the plain two-space block style below exactly as it is.
id: dev.openpencil.OpenPencil
name: OpenPencil
summary: Open-source design editor that reads and writes native Figma .fig files
website: https://openpencil.dev
source_url: https://github.com/open-pencil/open-pencil
build:
  manifest: dev.openpencil.OpenPencil.yml
  branch: stable
  mode: extra-data
catalog:
  category: Graphics
  tags:
    - Design
    - Vector
    - UI
    - Figma
    - Prototyping
    - Tauri
    - AI
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []
