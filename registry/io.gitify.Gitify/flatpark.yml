id: io.gitify.Gitify
name: Gitify
summary: Git notifications on your menu bar. Supports GitHub, GitLab, Gitea and Bitbucket.
website: https://gitify.io
source_url: https://github.com/gitify-app/gitify
build:
  manifest: io.gitify.Gitify.yml
  branch: stable
  mode: extra-data
catalog:
  category: Development
  upstream_approved: false
  tags:
    - GitHub
    - GitLab
    - Gitea
    - Forgejo
    - Codeberg
    - Bitbucket
    - Notifications
    - Tray
    - Electron
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
