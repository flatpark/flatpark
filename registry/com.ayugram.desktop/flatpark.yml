id: com.ayugram.desktop
name: AyuGram
summary: Telegram Desktop fork with ghost mode, message history and anti-recall
website: https://ayugram.one
source_url: https://github.com/jing2uo/ayugram-release
build:
  manifest: com.ayugram.desktop.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: Network
  upstream_approved: false
  tags:
    - Telegram
    - Chat
    - Messaging
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
