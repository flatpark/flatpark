id: com.elasticvue.app
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: elasticvue
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Windowing and accelerated WebKit rendering for the Tauri desktop client.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Core capability for connecting to local and remote Elasticsearch/OpenSearch clusters.
  - --share=network
  # Used for exporting query results and documents to the user's Downloads directory.
  - --filesystem=xdg-download
  # No tray integration is included; broader filesystem access remains opt-in via
  # the flatpak override documented in the AppStream description.
modules:
  - name: elasticvue
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 elasticvue-wrapper /app/bin/elasticvue
      - install -Dm644 com.elasticvue.app.desktop /app/share/applications/com.elasticvue.app.desktop
      - install -Dm644 com.elasticvue.app.metainfo.xml /app/share/metainfo/com.elasticvue.app.metainfo.xml
      - install -Dm644 com.elasticvue.app.png /app/share/icons/hicolor/256x256/apps/com.elasticvue.app.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: elasticvue.deb
        only-arches:
          - x86_64
        url: https://github.com/cars10/elasticvue/releases/download/v1.16.0/elasticvue_1.16.0_amd64.deb
        sha256: 10e227478be66d40c2d87617d10ae3206ce814688231710c9f49d97e8a0d3e14
        size: 7786706
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: elasticvue-wrapper
      - type: file
        path: com.elasticvue.app.desktop
      - type: file
        path: com.elasticvue.app.metainfo.xml
      - type: file
        path: com.elasticvue.app.png
