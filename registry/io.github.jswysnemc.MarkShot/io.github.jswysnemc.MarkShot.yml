id: io.github.jswysnemc.MarkShot
# Since 0.2.0 Mark Shot is a Rust rewrite with no Qt and no C++ toolchain
# behind it. Upstream's portable tarball is one executable that links only
# fontconfig, OpenSSL, xkbcommon, xcb, PipeWire and libc, plus a recorder
# library (its own FFmpeg build) that needs libva, libgbm and libdrm and
# dlopens libpulse - all of which org.freedesktop.Platform 26.08 provides.
# Nothing is built here; the only module installs our launcher, desktop entry,
# icon and AppStream data.
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: mark-shot
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  # Native Wayland client (layer-shell overlay, ext-image-copy-capture /
  # wlr-screencopy, wlr-data-control clipboard) with its own X11 backend for
  # X11 sessions - the same pair upstream's own Flatpak manifest declares.
  # A compositor that hides privileged protocols from sandboxed clients sends
  # capture down Mark Shot's xdg-desktop-portal Screenshot / ScreenCast
  # fallback, which every sandboxed app may use without a grant.
  - --socket=wayland
  - --socket=fallback-x11
  # The selection overlay is software-rendered, but recording uses the
  # VA-API / NVENC encoders.
  - --device=dri
  # Recording can mix in system audio and the microphone (libpulse, through
  # PipeWire's pulse server on most desktops).
  - --socket=pulseaudio
  # Capture, annotation, pinning, copying and saving are all offline. Network
  # is what the optional online features need: the translation providers
  # (OpenAI-compatible, Anthropic, Gemini, Bilibili, Tencent, Baidu, Youdao),
  # and the one-time download of the OCR runtime (ONNX Runtime and the
  # PP-OCRv5 models from GitHub releases) into ~/.var/app.
  - --share=network
  # Screenshots, recordings and the capture history default to ~/Pictures,
  # and the save dialog offers Downloads as the other common target. NOT a
  # home grant: settings and the OCR runtime stay under
  # ~/.var/app/io.github.jswysnemc.MarkShot, and anywhere else is an opt-in
  # `flatpak override` documented in the metainfo.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  # "Screenshot saved" / "Recording saved" notifications.
  - --talk-name=org.freedesktop.Notifications
  # The tray icon (StatusNotifierItem) with its capture / record / quit menu.
  - --talk-name=org.kde.StatusNotifierWatcher
  # KDE Wayland only: KWin's ScreenShot2 is a restricted interface, and it is
  # the exact-area capture path Mark Shot prefers on Plasma. The exported
  # desktop entry carries the matching
  # X-KDE-DBUS-Restricted-Interfaces=org.kde.KWin.ScreenShot2 declaration.
  # Deliberately NOT granted: org.kde.KWin itself, which Mark Shot uses to load
  # a KWin script for window geometry (hover-to-select on Plasma); that would
  # let the sandbox run code inside the compositor. Upstream's manifest also
  # lists com.canonical.AppMenu.Registrar (no global menu here) and
  # org.freedesktop.portal.Desktop (always reachable), neither of which is
  # needed.
  - --talk-name=org.kde.KWin.ScreenShot2
modules:
  - name: mark-shot
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 mark-shot-wrapper /app/bin/mark-shot
      - install -Dm644 io.github.jswysnemc.MarkShot.desktop /app/share/applications/io.github.jswysnemc.MarkShot.desktop
      - install -Dm644 io.github.jswysnemc.MarkShot.metainfo.xml /app/share/metainfo/io.github.jswysnemc.MarkShot.metainfo.xml
      - install -Dm644 io.github.jswysnemc.MarkShot.svg /app/share/icons/hicolor/scalable/apps/io.github.jswysnemc.MarkShot.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: mark-shot.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/jswysnemc/mark-shot/releases/download/v0.2.6/mark-shot-native-0.2.6-linux-x86_64.tar.gz
        sha256: 63ef0627da834216683b391bcbb3506002bb390a4d39a85c9d8e657ba1199c0a
        size: 30500391
      - type: extra-data
        filename: mark-shot.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/jswysnemc/mark-shot/releases/download/v0.2.6/mark-shot-native-0.2.6-linux-aarch64.tar.gz
        sha256: ff6add169e756ad597878d6f8159fc44066e11d2849078659b0e5eb5855652b5
        size: 29519391
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: mark-shot-wrapper
      - type: file
        path: io.github.jswysnemc.MarkShot.desktop
      - type: file
        path: io.github.jswysnemc.MarkShot.metainfo.xml
      - type: file
        path: io.github.jswysnemc.MarkShot.svg
