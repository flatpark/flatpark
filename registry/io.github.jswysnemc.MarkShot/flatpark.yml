# FlatPark catalog descriptor for Mark Shot.
#
# FlatPark (https://flatpark.org/) is a signed Flatpak remote that repackages
# official vendor downloads as extra-data - it does not build from source. This
# file is the catalog entry; io.github.jswysnemc.MarkShot.yml is the Flatpak
# manifest it points at.
#
# The app id is upstream's own: mark-shot ships its Flatpak manifest in
# packaging/flatpak/io.github.jswysnemc.MarkShot.yml, so this package is the
# same application rather than a rival ref.
#
# read-descriptor.mjs in flatpark/flatpark is a line scanner, not a YAML parser,
# so keep the plain two-space block style below exactly as it is.
id: io.github.jswysnemc.MarkShot
name: Mark Shot
summary: Qt 6 screenshot selection and annotation tool for Wayland and X11
website: https://github.com/jswysnemc/mark-shot
source_url: https://github.com/jswysnemc/mark-shot
build:
  manifest: io.github.jswysnemc.MarkShot.yml
  branch: stable
  mode: extra-data
catalog:
  category: Graphics
  tags:
    - Screenshot
    - Annotation
    - Wayland
    - OCR
    - Qt
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []
