<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ElyPDF's GPUI text system builds its font database from a fontconfig file it
  parses itself and reads only the <dir> elements of that one file. The
  runtime's /etc/fonts/fonts.conf reaches the host's fonts only through
  conf.d/50-flatpak.conf, which <remap-dir>s /run/host/fonts, so on its own it
  leaves the app with the runtime's few fonts. Listing every directory here
  makes the host's fonts reachable; the include keeps real fontconfig users in
  the sandbox on the runtime's own rules.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- The runtime's own fonts. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>

  <!-- The host's fonts, as Flatpak mounts them into every sandbox. -->
  <dir>/run/host/fonts</dir>
  <dir>/run/host/local-fonts</dir>
  <dir>/run/host/user-fonts</dir>

  <!-- The user's own fonts inside the sandbox. -->
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
</fontconfig>
