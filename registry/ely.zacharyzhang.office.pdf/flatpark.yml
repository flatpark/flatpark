# FlatPark catalog descriptor for ElyPDF, part of Ely Office.
#
# read-descriptor.mjs is a line scanner, not a YAML parser; keep the plain
# two-space block style below.
id: ely.zacharyzhang.office.pdf
name: ElyPDF
summary: PDF reader and editor with OCR and signatures
website: https://office.elygpui.com
source_url: https://git.zacharyzhang.com/ZacharyZhang-NY/ElyOffice
build:
  manifest: ely.zacharyzhang.office.pdf.yml
  branch: stable
  mode: extra-data
catalog:
  category: Office
  tags:
    - PDF
    - Viewer
    - OCR
    - Signature
    - MuPDF
    - Offline
update:
  command: ./resolve-update.sh
policy:
  # AGPL-3.0-or-later (upstream LICENSE and the .deb's own licence field).
  proprietary: false
  dangerous_permissions: []
