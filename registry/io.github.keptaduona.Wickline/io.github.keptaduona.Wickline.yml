id: io.github.keptaduona.Wickline
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: wickline
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Electron window and graphics.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Market data and community scripts are fetched over the network.
  - --share=network
  # Desktop price alerts.
  - --talk-name=org.freedesktop.Notifications
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: wickline
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 wickline-wrapper /app/bin/wickline
      - install -Dm644 io.github.keptaduona.Wickline.desktop /app/share/applications/io.github.keptaduona.Wickline.desktop
      - install -Dm644 io.github.keptaduona.Wickline.metainfo.xml /app/share/metainfo/io.github.keptaduona.Wickline.metainfo.xml
      - install -Dm644 io.github.keptaduona.Wickline.png /app/share/icons/hicolor/512x512/apps/io.github.keptaduona.Wickline.png
    sources:
      # The extractor is available offline during extra-data installation.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches: [x86_64]
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: app.AppImage
        only-arches:
          - x86_64
        url: https://github.com/keptaduona/wickline/releases/download/v0.1.16/Wickline-Linux-0.1.16.AppImage
        sha256: 07ab7ddf8df9270dd0405fee02be258b58f2d8a95fb36a1d769dd458aa759abb
        size: 127433097
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: wickline-wrapper
      - type: file
        path: io.github.keptaduona.Wickline.desktop
      - type: file
        path: io.github.keptaduona.Wickline.metainfo.xml
      - type: file
        path: io.github.keptaduona.Wickline.png
