id: io.github.yituorou.meatshell
name: MeatShell
summary: Lightweight SSH, SFTP, and terminal client
website: https://ixbaicn.github.io/meatshell-docs/
source_url: https://github.com/yituorou/meatshell
build:
  manifest: io.github.yituorou.meatshell.yml
  branch: stable
  mode: extra-data
catalog:
  category: Development
  # yituorou, MeatShell's author and repo owner, approved the FlatPark listing
  # in yituorou/meatshell#394 - "可以的，非常感谢你的贡献". Row in
  # docs/upstream-approvals.md cites the same comment.
  upstream_approved: true
  tags:
    - Terminal
    - SSH
    - SFTP
    - Serial
    - Rust
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []

# What this package does around the vendor's build; shown on the site as the
# packaging level. See docs/packaging-playbook.md (golden rule 1).
packaging:
  - kind: seeded-config
    detail:
      en: "On first launch, turns off meatshell's update check; Flatpak delivers updates instead."
      zh-Hans: "首次启动时关闭 meatshell 的更新检查，改由 Flatpak 负责更新。"
