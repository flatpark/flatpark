<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  MeatShell picks its UI and terminal faces with fontique/fontdb, which builds
  its font database from a single fontconfig file it parses itself:
  FONTCONFIG_FILE, else $XDG_CONFIG_HOME/fontconfig/fonts.conf, else
  /etc/fonts/local.conf, else /etc/fonts/fonts.conf. It reads the <dir> elements
  of that one file and does not follow <include>, so inside a Flatpak sandbox
  the directories that actually hold fonts are unreachable through the
  configuration the runtime ships:

    * the runtime's /etc/fonts/fonts.conf reaches the host's fonts only through
      conf.d/50-flatpak.conf -> /run/host/font-dirs.xml, an include;
    * the bundled CJK face is extra-data, so it lives under /app/extra.

  Worse, Flatpak mounts the host's ~/.config/fontconfig into the sandbox, so on
  a host that has one that file is what gets picked — and any construct its
  pure-Rust parser cannot handle leaves the database empty. MeatShell then logs
  "system fonts unusable" and falls back to its embedded Latin-only face, which
  draws every CJK glyph as a tofu box.

  Listing every directory explicitly here is what makes all of them reachable.
  The include keeps real libfontconfig — which MeatShell also links, and which
  does follow includes — on the runtime's own rules, and through
  conf.d/50-user.conf on the user's rules as well.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- The runtime's own fonts. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>

  <!-- The host's fonts, as Flatpak mounts them into every sandbox. -->
  <dir>/run/host/fonts</dir>
  <dir>/run/host/local-fonts</dir>
  <dir>/run/host/user-fonts</dir>

  <!-- The user's own fonts inside the sandbox. -->
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>

  <!-- The bundled Noto Sans CJK face, staged by apply_extra. Last, so it only
       ever acts as a fallback behind whatever the host already provides. -->
  <dir>/app/extra/fonts</dir>
</fontconfig>
