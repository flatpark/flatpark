id: io.github.basharovV.musicat
name: Musicat
summary: Offline music player and tag editor for a local library
website: https://github.com/basharovV/musicat
source_url: https://github.com/basharovV/musicat
build:
  manifest: io.github.basharovV.musicat.yml
  branch: stable
  mode: extra-data
catalog:
  category: AudioVideo
  tags:
    - Music
    - Player
    - Tagger
    - Offline
    - Tauri
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []
