id: ai.storyteller.photocraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: photocraft
separate-locales: false
build-options:
  no-debuginfo: true
# The app id and runtime follow upstream's own Flatpak manifests
# (packaging/linux/flatpak/ in storytold/photocraft). finish-args follow them
# too, except where noted under "Deliberately not granted" below.
finish-args:
  # Native Rust/egui app on winit; libwayland, libX11/xcb, xkbcommon and the
  # Vulkan/EGL loaders are dlopen()ed from the runtime.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu GPU compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save go through the file-chooser portal and drag-and-drop through the
  # document portal. Pictures and Documents are granted so files passed by path
  # (command line, File > Open Recent, saving next to the original) keep working.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  # Printing: the app's in-process IPP client (crates/ipp upstream) sends jobs
  # to the host's CUPS socket; without it they fall back to the print portal.
  - --socket=cups
  # Deliberately not granted (upstream grants all but the last):
  #   --system-talk-name=org.freedesktop.Avahi, --filesystem=~/.cups:ro
  #                            -> only used by the CUPS lp/lpstat/lpoptions
  #                               upstream builds into its bundle (driverless
  #                               printers via `lpstat -e`, client.conf); this
  #                               package doesn't ship them
  #   --share=network          -> upstream uses it for the in-app update check
  #                               and the --control server; FlatPark ships
  #                               updates itself, and the metainfo documents
  #                               the override that exposes --control
  #   xdg-data/ArtCraft/versions:ro -> version pins of upstream's ArtCraft
  #                               launcher, which doesn't manage this package
  #   --filesystem=home / host -> everything else goes through the portals;
  #   /media, /run/media          the metainfo documents the overrides
modules:
  - name: photocraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 photocraft-wrapper /app/bin/photocraft
      - install -Dm755 photocraft-cli-wrapper /app/bin/photocraft-cli
      - install -Dm644 ai.storyteller.photocraft.desktop /app/share/applications/ai.storyteller.photocraft.desktop
      - install -Dm644 ai.storyteller.photocraft.metainfo.xml /app/share/metainfo/ai.storyteller.photocraft.metainfo.xml
      # .pcraft, .psb and .qoi; the runtime's shared-mime-info covers PSD and the rest.
      - install -Dm644 ai.storyteller.photocraft.mime.xml /app/share/mime/packages/ai.storyteller.photocraft.xml
      - install -Dm644 ai.storyteller.photocraft.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.photocraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: photocraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/photocraft/releases/download/v0.20.1/photocraft-0.20.1-linux-x86_64.tar.gz
        sha256: 398787d58fe46919e99c9f56e35545549ef0aaab007f869a92beff7d9fe52234
        size: 125899904
      - type: extra-data
        filename: photocraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/storytold/photocraft/releases/download/v0.20.1/photocraft-0.20.1-linux-aarch64.tar.gz
        sha256: ec07b36b48063ca30db0c9043adf86f752255b9800dfe93bf2c6c3fcc9688588
        size: 120707126
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: photocraft-wrapper
      - type: file
        path: photocraft-cli-wrapper
      - type: file
        path: ai.storyteller.photocraft.desktop
      - type: file
        path: ai.storyteller.photocraft.metainfo.xml
      - type: file
        path: ai.storyteller.photocraft.mime.xml
      - type: file
        path: ai.storyteller.photocraft.png
