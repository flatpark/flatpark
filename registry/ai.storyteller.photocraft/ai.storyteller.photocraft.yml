id: ai.storyteller.photocraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: photocraft
separate-locales: false
build-options:
  no-debuginfo: true
# The app id and runtime follow upstream's own Flatpak manifests
# (packaging/linux/flatpak/ in storytold/photocraft). finish-args follow them
# too, except where noted under "Deliberately not granted" below.
finish-args:
  # Native Rust/egui app on winit; libwayland, libX11/xcb, xkbcommon and the
  # Vulkan/EGL loaders are dlopen()ed from the runtime.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu GPU compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save go through the file-chooser portal and drag-and-drop through the
  # document portal. Pictures and Documents are granted so files passed by path
  # (command line, File > Open Recent, saving next to the original) keep working.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  # Printing. craft-print lists printers with lpstat, reads the default with
  # lpoptions and sends jobs with lp. The runtime has libcups and lpr, not
  # those tools, and without the CUPS socket the Print dialog stays empty.
  # cups-client below ships them. Avahi is how `lpstat -e` finds driverless
  # printers. ~/.cups is read-only: the default printer, saved options and a
  # ServerName.
  - --socket=cups
  - --system-talk-name=org.freedesktop.Avahi
  - --filesystem=~/.cups:ro
  # Deliberately not granted (upstream grants all but the last):
  #   --share=network          -> upstream uses it for the in-app update check,
  #                               the --control server and a CUPS server named
  #                               by address; FlatPark ships updates itself,
  #                               and the metainfo documents the override
  #   xdg-data/ArtCraft/versions:ro -> version pins of upstream's ArtCraft
  #                               launcher, which doesn't manage this package
  #   --filesystem=home / host -> everything else goes through the portals;
  #   /media, /run/media          the metainfo documents the overrides
modules:
  # lp, lpstat and lpoptions from FlatPark's prebuilt cups-client stack: the
  # same build as upstream's cups-client module (CUPS 2.4.20, libcups linked
  # statically) plus upstream's socket wrapper; the tag's manifest records the
  # sources. apply_extra unpacks it to /app/extra/cups-client; the links below
  # put the tools on PATH and dangle until then. Extra-data, not built here: a
  # dependency is never compiled in an app's manifest
  # (docs/packagers/prebuilt.md). Kept as its own module so the module names
  # match upstream's manifest.
  - name: cups-client
    buildsystem: simple
    build-commands:
      - for tool in lp lpoptions lpstat; do install -d /app/bin; ln -s "/app/extra/cups-client/bin/$tool" "/app/bin/$tool"; done
    sources:
      - type: extra-data
        filename: cups-client.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/cups-client-v1/cups-client-cups-client-v1-fd-26.08-x86_64.tar.xz
        sha256: a96f57051ab61c98c73d99fed4dbe05a040fb2d1dbd353e1241d79b3aefea851
        size: 266076
      - type: extra-data
        filename: cups-client.tar.xz
        only-arches:
          - aarch64
        url: https://github.com/flatpark/prebuilt/releases/download/cups-client-v1/cups-client-cups-client-v1-fd-26.08-aarch64.tar.xz
        sha256: 7005c45fe7b1ebd24ed1146c47af34f00526407015cd7cbca5f0e1bbae37d909
        size: 238968
  - name: photocraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 photocraft-wrapper /app/bin/photocraft
      - install -Dm755 photocraft-cli-wrapper /app/bin/photocraft-cli
      - install -Dm644 ai.storyteller.photocraft.desktop /app/share/applications/ai.storyteller.photocraft.desktop
      - install -Dm644 ai.storyteller.photocraft.metainfo.xml /app/share/metainfo/ai.storyteller.photocraft.metainfo.xml
      # .pcraft, .psb and .qoi; the runtime's shared-mime-info covers PSD and the rest.
      - install -Dm644 ai.storyteller.photocraft.mime.xml /app/share/mime/packages/ai.storyteller.photocraft.xml
      - install -Dm644 ai.storyteller.photocraft.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.photocraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: photocraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/photocraft/releases/download/v0.20.2/photocraft-0.20.2-linux-x86_64.tar.gz
        sha256: 09e013d68d8313eb0b1cd6f24612f5b5fd0d993fffe3a7c12cecdfe5cd131a46
        size: 126621245
      - type: extra-data
        filename: photocraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/storytold/photocraft/releases/download/v0.20.2/photocraft-0.20.2-linux-aarch64.tar.gz
        sha256: a1c3761d132d9ec162691d50f06ed98473bcdc0aed7c171a097df9adcfc38072
        size: 121784421
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: photocraft-wrapper
      - type: file
        path: photocraft-cli-wrapper
      - type: file
        path: ai.storyteller.photocraft.desktop
      - type: file
        path: ai.storyteller.photocraft.metainfo.xml
      - type: file
        path: ai.storyteller.photocraft.mime.xml
      - type: file
        path: ai.storyteller.photocraft.png
