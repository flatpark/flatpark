id: io.github.ada_h00k.Corvus
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: corvus
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Signal servers (corvus-cli talks to them directly).
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Voice messages and video playback.
  - --socket=pulseaudio
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: corvus
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 corvus-wrapper /app/bin/corvus
      - install -Dm644 io.github.ada_h00k.Corvus.desktop /app/share/applications/io.github.ada_h00k.Corvus.desktop
      - install -Dm644 io.github.ada_h00k.Corvus.metainfo.xml /app/share/metainfo/io.github.ada_h00k.Corvus.metainfo.xml
      - install -Dm644 io.github.ada_h00k.Corvus.svg /app/share/icons/hicolor/scalable/apps/io.github.ada_h00k.Corvus.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: corvus.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/ada-h00k/Corvus/releases/download/v1.8.5/corvus-linux-x86_64-flatpark.tar.gz
        sha256: c12b7a447576ee012f4ccb68b09de3c58832f94911947ccbc7f7e55943d1bf5e
        size: 15689625
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: corvus-wrapper
      - type: file
        path: io.github.ada_h00k.Corvus.desktop
      - type: file
        path: io.github.ada_h00k.Corvus.metainfo.xml
      - type: file
        path: io.github.ada_h00k.Corvus.svg
