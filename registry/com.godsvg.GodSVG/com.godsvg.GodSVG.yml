id: com.godsvg.GodSVG
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: godsvg
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Godot 4 export. Upstream ships its Linux x86_64 build as a single
  # self-contained executable (in a zip, and as an AppImage); this stages the
  # executable from the zip unmodified. It links only libc/libm and loads the
  # X11/Wayland, EGL/GL, xkbcommon, libdecor, fontconfig and D-Bus libraries it
  # needs from the runtime at start-up.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GL rendering (Godot's Compatibility renderer).
  - --device=dri
  # Deliberately not granted:
  #   --filesystem=home / =host -> opening and saving go through the file
  #                                chooser portal (GodSVG's default "native file
  #                                dialog"). Dropping files onto the window and
  #                                the app's own file dialog need a folder
  #                                grant, an opt-in override (see the metainfo).
  #   --share=network           -> only the optional "Check for updates" menu
  #                                uses it, to list releases; updates arrive
  #                                through Flatpak.
  #   --socket=pulseaudio       -> the project uses Godot's dummy audio driver
modules:
  - name: godsvg
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 godsvg-wrapper /app/bin/godsvg
      - install -Dm644 com.godsvg.GodSVG.desktop /app/share/applications/com.godsvg.GodSVG.desktop
      - install -Dm644 com.godsvg.GodSVG.metainfo.xml /app/share/metainfo/com.godsvg.GodSVG.metainfo.xml
      - install -Dm644 com.godsvg.GodSVG.svg /app/share/icons/hicolor/scalable/apps/com.godsvg.GodSVG.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: godsvg.zip
        only-arches:
          - x86_64
        url: https://github.com/MewPurPur/GodSVG/releases/download/v1.0-alpha17/GodSVG_v1.0-alpha17.Linux.x86_64.zip
        sha256: bad3ef16e666c4d14c95db4452092f27ee93b450e525cf03db4c9a1db7201258
        size: 16737597
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: godsvg-wrapper
      - type: file
        path: com.godsvg.GodSVG.desktop
      - type: file
        path: com.godsvg.GodSVG.metainfo.xml
      - type: file
        path: com.godsvg.GodSVG.svg
