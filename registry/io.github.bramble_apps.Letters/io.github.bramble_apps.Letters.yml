id: io.github.bramble_apps.Letters
# The freedesktop base, as upstream's own Flatpak bundle uses: Letters is a
# Rust app drawn with egui and wgpu on winit, and needs neither GTK nor Qt.
# The binary links only glibc and libgcc_s; libwayland, X11, xkbcommon and the
# Vulkan/GL loaders are opened from the runtime at run time.
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: letters
separate-locales: false
build-options:
  no-debuginfo: true
# The permissions upstream's own Flatpak bundle is built with
# (keynote-linux/tools/suite/flatpak.sh and .github/workflows/build.yml in
# bramble-apps/bramble-office), plus
# Avahi and a read-only ~/.cups for printing.
finish-args:
  # Display: Wayland, with X11 when there is no Wayland session.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu renders on the GPU.
  - --device=dri
  # Sound: audio and video in a document play, and Record Audio records
  # through PipeWire's pw-record over the PulseAudio socket.
  - --socket=pulseaudio
  # The title and poster of a web video placed in a document.
  - --share=network
  # Printing. File > Print lists printers with lpstat and sends the job with
  # lp. The runtime has libcups but not those tools, and without the CUPS
  # socket the printer list stays empty; the cups-client module below ships
  # them. Avahi is how lpstat finds driverless printers. ~/.cups is read-only:
  # the default printer, saved options and a ServerName.
  - --socket=cups
  - --system-talk-name=org.freedesktop.Avahi
  - --filesystem=~/.cups:ro
  # Files: no filesystem grant, as upstream ships it. Open, Save and Insert go
  # through the file-chooser portal, and a file opened from the file manager
  # is handed over through the document portal.
modules:
  # CUPS client tools for File > Print: lp, lpstat and lpoptions, from
  # FlatPark's prebuilt cups-client stack (CUPS 2.4.20, libcups linked
  # statically, with a wrapper that finds the CUPS socket Flatpak mounted).
  # apply_extra unpacks it to /app/extra/cups-client; the links below put the
  # tools on PATH and dangle until then. Extra-data, not built here: a
  # dependency is never compiled in an app's manifest (docs/packagers/prebuilt.md).
  - name: cups-client
    buildsystem: simple
    build-commands:
      - for tool in lp lpoptions lpstat; do install -d /app/bin; ln -s "/app/extra/cups-client/bin/$tool" "/app/bin/$tool"; done
    sources:
      - type: extra-data
        filename: cups-client.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/cups-client-v1/cups-client-cups-client-v1-fd-26.08-x86_64.tar.xz
        sha256: a96f57051ab61c98c73d99fed4dbe05a040fb2d1dbd353e1241d79b3aefea851
        size: 266076
  - name: letters
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 letters-wrapper /app/bin/letters
      - install -Dm644 io.github.bramble_apps.Letters.desktop /app/share/applications/io.github.bramble_apps.Letters.desktop
      - install -Dm644 io.github.bramble_apps.Letters.metainfo.xml /app/share/metainfo/io.github.bramble_apps.Letters.metainfo.xml
      - install -Dm644 io.github.bramble_apps.Letters.png /app/share/icons/hicolor/512x512/apps/io.github.bramble_apps.Letters.png
    sources:
      # Kept outside the managed block, which update-pins rebuilds from the
      # resolver's output.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v3/appimage-tools-appimage-tools-v3-fd-26.08-x86_64.tar.xz
        sha256: 2ad7847e871c2f7f24506ecf202ea971ab684aaa457e2f6a594f6bfac96f1297
        size: 57508
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: letters.AppImage
        only-arches:
          - x86_64
        url: https://github.com/bramble-apps/bramble-office/releases/download/v0.5.2/Letters-x86_64.AppImage
        sha256: 9048381d0de73d1253b62fa3b9bd5b3167457c8e1aebfb529590e31357ccbe36
        size: 45435384
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: letters-wrapper
      - type: file
        path: io.github.bramble_apps.Letters.desktop
      - type: file
        path: io.github.bramble_apps.Letters.metainfo.xml
      - type: file
        path: io.github.bramble_apps.Letters.png
