id: io.github.mitcad.Mitcad
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: mitcad
separate-locales: false
build-options:
  no-debuginfo: true
# Qt 6 and Open CASCADE ship inside the AppImage (RUNPATH $ORIGIN/../lib).
# The runtime provides glibc, GLib, X11, OpenGL, FreeType and fontconfig.
# GLib stays the runtime's: the AppImage deliberately does not bundle it.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The 3D view is OpenGL.
  - --device=dri
  # File › Print talks to CUPS. Without the socket the list stays empty
  # and Qt offers PDF only.
  - --socket=cups
  # Open and Save go through the file chooser. Documents is granted so a
  # design passed by path keeps working.
  # No network. MITCAD_NO_UPDATE_CHECK (set by the wrapper) is upstream's
  # administrator switch: no update request is made. Insert › Component
  # from Web needs a network override, documented in the metainfo.
  - --filesystem=xdg-documents
modules:
  - name: mitcad
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 mitcad-wrapper /app/bin/mitcad
      - install -Dm755 mitcad-cli-wrapper /app/bin/mitcad-cli
      - install -Dm644 io.github.mitcad.Mitcad.desktop /app/share/applications/io.github.mitcad.Mitcad.desktop
      - install -Dm644 io.github.mitcad.Mitcad.metainfo.xml /app/share/metainfo/io.github.mitcad.Mitcad.metainfo.xml
      - install -Dm644 io.github.mitcad.Mitcad.mime.xml /app/share/mime/packages/io.github.mitcad.Mitcad.xml
      - install -Dm644 io.github.mitcad.Mitcad.svg /app/share/icons/hicolor/scalable/apps/io.github.mitcad.Mitcad.svg
      - install -Dm644 io.github.mitcad.Mitcad.png /app/share/icons/hicolor/256x256/apps/io.github.mitcad.Mitcad.png
    sources:
      # appimage-offset + unsquashfs, so apply_extra can open the AppImage
      # offline with no FUSE. Outside the managed block, which the updater
      # rebuilds from the resolver output.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: mitcad.AppImage
        only-arches:
          - x86_64
        url: https://github.com/mitcad/Mitcad/releases/download/v0.75.0/Mitcad-0.75.0-x86_64.AppImage
        sha256: 775d7a87b086fb5b75b77085cef2bd9ada6f19b1be873d80b0c9e1309fcedb2d
        size: 307984888
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: mitcad-wrapper
      - type: file
        path: mitcad-cli-wrapper
      - type: file
        path: io.github.mitcad.Mitcad.desktop
      - type: file
        path: io.github.mitcad.Mitcad.metainfo.xml
      - type: file
        path: io.github.mitcad.Mitcad.mime.xml
      - type: file
        path: io.github.mitcad.Mitcad.svg
      - type: file
        path: io.github.mitcad.Mitcad.png
