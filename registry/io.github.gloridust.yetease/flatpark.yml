# FlatPark catalog descriptor for YetEase Music.
#
# FlatPark (https://flatpark.org/) is a signed Flatpak remote that repackages
# official vendor downloads as extra-data - it does not build from source. This
# file is the catalog entry; io.github.gloridust.yetease.yml is the Flatpak
# manifest it points at.
#
# read-descriptor.mjs in flatpark/flatpark is a line scanner, not a YAML parser,
# so keep the plain two-space block style below exactly as it is.
id: io.github.gloridust.yetease
name: YetEase Music
summary: Third-party NetEase Cloud Music client with a Rust core
website: https://github.com/Gloridust/YetEaseMusic
source_url: https://github.com/Gloridust/YetEaseMusic
build:
  manifest: io.github.gloridust.yetease.yml
  branch: stable
  mode: extra-data
catalog:
  category: AudioVideo
  tags:
    - Music
    - Player
    - NetEase
    - Lyrics
    - Flutter
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
