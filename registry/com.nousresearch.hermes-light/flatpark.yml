id: com.nousresearch.hermes-light
name: Hermes Light
summary: Desktop client for a Hermes Agent running on another machine
website: https://hermes-agent.nousresearch.com
source_url: https://github.com/tunix/homebrew-tap
build:
  manifest: com.nousresearch.hermes-light.yml
  branch: stable
  mode: extra-data
  arches: [x86_64]
catalog:
  category: AI
  tags:
    - AI
    - Agent
    - Electron
    - Remote Control
  stars_repo: NousResearch/hermes-agent
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
