id: com.pocoguy.Muse
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: mixtapes
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # GTK window, GPU rendering and shared-memory X11 fallback.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # YouTube Music streaming, artwork, lyrics and scrobbling; audio output.
  - --share=network
  - --socket=pulseaudio
  # Downloads and local playback use the user's Music directory.
  - --filesystem=xdg-music
  # Media keys and desktop now-playing integration, without a full session bus.
  - --own-name=org.mpris.MediaPlayer2.Mixtapes
modules:
  - name: mixtapes
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 mixtapes-wrapper /app/bin/mixtapes
      - install -Dm644 com.pocoguy.Muse.desktop /app/share/applications/com.pocoguy.Muse.desktop
      - install -Dm644 com.pocoguy.Muse.metainfo.xml /app/share/metainfo/com.pocoguy.Muse.metainfo.xml
      - install -Dm644 com.pocoguy.Muse.svg /app/share/icons/hicolor/scalable/apps/com.pocoguy.Muse.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: mixtapes.tar.zst
        only-arches: [x86_64]
        url: https://github.com/m-obeid/Mixtapes/releases/download/2026-10-31.1/mixtapes-2026-10-31.1-x86_64.tar.zst
        sha256: 33b8fbd1d9233f380bda10ead99b0849437a6e21aef89c5eb0100be36c8e9696
        size: 27139575
      # END MANAGED EXTRA-DATA
      # Upstream's fallback resolver/downloader; the standalone build includes EJS.
      - type: extra-data
        filename: yt-dlp_linux
        only-arches: [x86_64]
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux
        sha256: 767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795
        size: 41166968
      # JavaScript runtime for yt-dlp's YouTube signature extraction.
      - type: extra-data
        filename: node.tar.xz
        only-arches: [x86_64]
        url: https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.xz
        sha256: 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75
        size: 32039312
      - type: file
        path: apply_extra.sh
      - type: file
        path: mixtapes-wrapper
      - type: file
        path: com.pocoguy.Muse.desktop
      - type: file
        path: com.pocoguy.Muse.metainfo.xml
      - type: file
        path: com.pocoguy.Muse.svg
