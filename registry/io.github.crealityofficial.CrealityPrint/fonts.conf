<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font configuration for CrealityPrint, set by the wrapper through
  FONTCONFIG_FILE.

  The CrealityPrint binary carries its own statically linked FreeType and
  exports its FT_* entry points, so inside this process a FreeType face can be
  created by the binary's copy and then handed to a function of the runtime's
  libfreetype. For ordinary fonts the two agree; for a variable font,
  fontconfig's query calls FT_Set_Var_Design_Coordinates and the mixed objects
  crash the app at start (seen on the host's Cantarell-VF.otf, which the
  sandbox has no cache for and so scans).

  Everything else is the runtime's normal configuration, host fonts included.
  The only change is that variable font files are rejected by name. A glob
  rejection is applied before a file is opened, so they are never scanned,
  matched or rendered; text falls back to the static fonts. The globs cover the
  usual naming schemes: Cantarell-VF.otf, Foo_VF.ttf, NotoSans[wght].ttf and
  FooVariable.ttf.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>*-VF.*</glob>
      <glob>*_VF.*</glob>
      <glob>*[*]*</glob>
      <glob>*Variable*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
