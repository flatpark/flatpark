# FlatPark catalog descriptor for ElyShow, part of Ely Office.
#
# read-descriptor.mjs is a line scanner, not a YAML parser; keep the plain
# two-space block style below.
id: ely.zacharyzhang.office.show
name: ElyShow
summary: Presentation editor for PPTX and ODP files
website: https://office.elygpui.com
source_url: https://github.com/ELY-Open-Source/ElyOffice
build:
  manifest: ely.zacharyzhang.office.show.yml
  branch: stable
  mode: extra-data
catalog:
  category: Office
  tags:
    - Presentation
    - Slides
    - PPTX
    - ODP
    - LibreOffice
    - Offline
update:
  command: ./resolve-update.sh
policy:
  # MIT AND MPL-2.0. Ely's own code is MIT since 2026-10-19 (upstream
  # LICENSE); the bundled LibreOffice keeps its licence, as upstream's
  # packaging/linux/package.sh declares.
  proprietary: false
  dangerous_permissions: []
