id: com.filee.app
name: Filee
summary: Convert images, documents, media and archives offline
website: https://filee.sh
source_url: https://github.com/KnifeLemon/Filee
build:
  manifest: com.filee.app.yml
  branch: stable
  mode: extra-data
catalog:
  category: Utility
  tags: [Converter, Images, PDF, Documents, Archives]
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
packaging:
  - kind: seeded-config
    detail:
      en: "On first run, converted files are saved to Downloads so files selected through the portal have a persistent output destination. Existing settings are kept."
      zh-Hans: "首次运行时将转换结果保存到下载目录，确保通过文件选择器选取的文件有持久保存位置；保留现有设置。"
