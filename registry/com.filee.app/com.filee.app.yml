id: com.filee.app
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: filee
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Use upstream's native Wayland backend; it selects X11 when Wayland is absent.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --env=FILEE_USE_WAYLAND=1
  - --device=dri
  # Filee downloads optional engines and OCR language models.
  - --share=network
  # Read inputs and persist converted outputs in Downloads.
  - --filesystem=xdg-download:create
  # Avalonia's StatusNotifier tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-0
modules:
  - name: filee
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 filee-wrapper /app/bin/filee
      - install -Dm755 filee-cli-wrapper /app/bin/filee-cli
      - install -Dm755 tesseract-wrapper /app/bin/tesseract
      - install -Dm644 com.filee.app.desktop /app/share/applications/com.filee.app.desktop
      - install -Dm644 com.filee.app.metainfo.xml /app/share/metainfo/com.filee.app.metainfo.xml
      - install -Dm644 com.filee.app.svg /app/share/icons/hicolor/scalable/apps/com.filee.app.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: filee.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/KnifeLemon/Filee/releases/download/v2.4.1/Filee-2.4.1-linux-x64.tar.gz
        sha256: 2d4fd69e9227a640befed7fb5b39a00d3bbef2d73d96806d2a37ec47cd4574ea
        size: 132047012
      # END MANAGED EXTRA-DATA
      # Shared OCR tools built on GNOME 51, which shares the 26.08 runtime base.
      # Keep these outside the app updater's managed block. Filee downloads its
      # own checksum-pinned language models on first use, into its user data.
      - type: extra-data
        filename: tesseract.tar.xz
        only-arches: [x86_64]
        url: https://github.com/flatpark/prebuilt/releases/download/tesseract-v2/tesseract-tesseract-v2-gnome-51-x86_64.tar.xz
        sha256: 43cf6dd9cc48845b577cef72bff9eb471a51cce0c3ec72f14ab4d7ee28366149
        size: 1691656
      - type: extra-data
        filename: leptonica.tar.xz
        only-arches: [x86_64]
        url: https://github.com/flatpark/prebuilt/releases/download/leptonica-v2/leptonica-leptonica-v2-gnome-51-x86_64.tar.xz
        sha256: c031417db8170f8e2553cab28d674cd78bd86056e53ae423af7fdd1da6822340
        size: 1228816
      - type: file
        path: apply_extra.sh
      - type: file
        path: filee-wrapper
      - type: file
        path: filee-cli-wrapper
      - type: file
        path: tesseract-wrapper
      - type: file
        path: com.filee.app.desktop
      - type: file
        path: com.filee.app.metainfo.xml
      - type: file
        path: com.filee.app.svg
