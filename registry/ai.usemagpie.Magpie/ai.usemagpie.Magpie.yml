id: ai.usemagpie.Magpie
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: magpie
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  # Providers, model catalogs and Magpie's loopback model gateway.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # The Wails WebKitGTK UI uses the system webview and benefits from GPU rendering.
  - --device=dri
  # The menu-bar/status notifier integration uses the session bus.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Wails single-instance name has a user/path-derived hash under this prefix.
  - --own-name=ai.usemagpie.app.*
  - --filesystem=xdg-run/tray-icon:create
  # Magpie reads and updates the settings of every AI agent it supports; they
  # live in ~/.<agent>, ~/.config/<agent> and ~/.local/share/<agent>, and the
  # list grows with nearly every release. These may hold provider keys and
  # OAuth tokens.
  - --filesystem=home
  # Magpie writes these entries with its in-sandbox executable path, which the
  # host cannot run; keep them out of the host's menu, scheme handlers and login.
  - --nofilesystem=xdg-data/applications
  - --nofilesystem=xdg-config/autostart
modules:
  - name: magpie
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 magpie-wrapper /app/bin/magpie
      - install -Dm644 ai.usemagpie.Magpie.desktop /app/share/applications/ai.usemagpie.Magpie.desktop
      - install -Dm644 ai.usemagpie.Magpie.metainfo.xml /app/share/metainfo/ai.usemagpie.Magpie.metainfo.xml
      - install -Dm644 ai.usemagpie.Magpie.svg /app/share/icons/hicolor/scalable/apps/ai.usemagpie.Magpie.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: magpie-linux-amd64
        only-arches:
          - x86_64
        url: https://github.com/yetone/magpie-releases/releases/download/v0.1.3001/magpie-linux-amd64
        sha256: 6823a366949a423031a35d52e361a0c2216a05763ac9d885c11de565f26dee14
        size: 77116728
      - type: extra-data
        filename: magpie-linux-arm64
        only-arches:
          - aarch64
        url: https://github.com/yetone/magpie-releases/releases/download/v0.1.3001/magpie-linux-arm64
        sha256: c3706d718f8906faebb7405db4d883c7a09613c531e1f7d7a28faf95d8c917e1
        size: 70998208
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: magpie-wrapper
      - type: file
        path: ai.usemagpie.Magpie.desktop
      - type: file
        path: ai.usemagpie.Magpie.metainfo.xml
      - type: file
        path: ai.usemagpie.Magpie.svg
