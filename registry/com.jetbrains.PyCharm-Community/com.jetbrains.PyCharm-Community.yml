id: com.jetbrains.PyCharm-Community
# The SDK supplies Python, venv, Git and compilers for development in the sandbox.
# Flathub's archived com.jetbrains.PyCharm-Community did the same; 26.08 is the catalog's current SDK.
runtime: org.freedesktop.Sdk
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: pycharm
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Display, shared memory and GPU rendering for the bundled JetBrains Runtime.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The bundled JBR requests this measured desktop integration bus name.
  - --own-name=dbus.JBR.server
  # Package downloads, Git remotes and programs developed in the IDE.
  - --share=network
  # Projects and their virtual environments are kept in the Documents directory.
  - --filesystem=xdg-documents
modules:
  - name: pycharm
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 pycharm-wrapper /app/bin/pycharm
      - install -Dm644 pycharm.properties /app/etc/pycharm.properties
      - install -Dm644 com.jetbrains.PyCharm-Community.desktop /app/share/applications/com.jetbrains.PyCharm-Community.desktop
      - install -Dm644 com.jetbrains.PyCharm-Community.metainfo.xml /app/share/metainfo/com.jetbrains.PyCharm-Community.metainfo.xml
      - install -Dm644 com.jetbrains.PyCharm-Community.svg /app/share/icons/hicolor/scalable/apps/com.jetbrains.PyCharm-Community.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: pycharm.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/JetBrains/intellij-community/releases/download/pycharm/2026.2.5/pycharm-2026.2.5.tar.gz
        sha256: cc8bbb4fa6c331cfbec372c9289e5599c93d45e8ba59588fe902de54d3e59fd7
        size: 650319599
      - type: extra-data
        filename: pycharm.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/JetBrains/intellij-community/releases/download/pycharm/2026.2.5/pycharm-2026.2.5-aarch64.tar.gz
        sha256: 7b68e101209b5a86952c1c3bf1d7f6ad7c8420c6a16919bf4ae853aaf24e3f25
        size: 676016491
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: pycharm-wrapper
      - type: file
        path: pycharm.properties
      - type: file
        path: com.jetbrains.PyCharm-Community.desktop
      - type: file
        path: com.jetbrains.PyCharm-Community.metainfo.xml
      - type: file
        path: com.jetbrains.PyCharm-Community.svg
