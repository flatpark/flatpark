# External launcher properties leave the vendor's installation unchanged.
idea.config.path=${user.home}/.var/app/com.jetbrains.PyCharm-Community/config/JetBrains/PyCharmCE
idea.system.path=${user.home}/.var/app/com.jetbrains.PyCharm-Community/cache/JetBrains/PyCharmCE
idea.plugins.path=${user.home}/.var/app/com.jetbrains.PyCharm-Community/data/JetBrains/PyCharmCE/plugins
idea.log.path=${idea.system.path}/log
# Java preferences (including agreement choices) also belong to this app profile.
java.util.prefs.userRoot=${user.home}/.var/app/com.jetbrains.PyCharm-Community/config/java
