id: com.kang.nyaterm.preview
name: NyaTerm Preview
summary: Remote terminal workspace for SSH, SFTP, serial, RDP and VNC
website: https://nyaterm.app
source_url: https://github.com/nyakang/nyaterm
build:
  manifest: com.kang.nyaterm.preview.yml
  branch: stable
  mode: extra-data
catalog:
  category: Network
  upstream_approved: true
  tags:
    - SSH
    - SFTP
    - Serial
    - Terminal
    - Remote
    - GPUI
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  # Local terminal tabs open the host login shell through flatpak-spawn --host
  # (nyaterm-host-shell); serial sessions need the tty devices.
  dangerous_permissions:
    - --talk-name=org.freedesktop.Flatpak
    - --filesystem=home
    - --device=all

# What this package does around the vendor's build; shown on the site as the
# packaging level. See docs/packaging-playbook.md (golden rule 1).
packaging:
  - kind: host-command
    detail:
      en: "A local terminal tab opens your login shell on the host through flatpak-spawn, with the same access as a terminal outside the sandbox."
      zh-Hans: "本地终端标签页通过 flatpak-spawn 打开你在宿主系统上的登录 shell，权限与沙箱外的终端相同。"
