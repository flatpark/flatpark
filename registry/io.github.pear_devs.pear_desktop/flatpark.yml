id: io.github.pear_devs.pear_desktop
name: Pear Desktop
summary: Desktop music streaming client with a plugin system
website: https://github.com/pear-devs/pear-desktop
source_url: https://github.com/pear-devs/pear-desktop
build:
  manifest: io.github.pear_devs.pear_desktop.yml
  branch: stable
  mode: extra-data
catalog:
  category: AudioVideo
  tags:
    - Music
    - Player
    - Plugins
    - Electron
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []

# What this package does around the vendor's build; shown on the site as the
# packaging level. See docs/packaging-playbook.md (golden rule 1).
packaging:
  - kind: seeded-config
    detail:
      en: "On first launch, writes a settings file that turns off the in-app updater and the tray icon."
      zh-Hans: "首次启动时写入一份设置，关闭应用内更新器和托盘图标。"
