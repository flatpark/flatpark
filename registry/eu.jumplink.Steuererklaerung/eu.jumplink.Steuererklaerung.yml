id: eu.jumplink.Steuererklaerung
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: steuererklaerung
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.secrets
modules:
  - name: steuererklaerung
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 steuererklaerung-wrapper /app/bin/steuererklaerung
      - install -Dm644 eu.jumplink.Steuererklaerung.desktop /app/share/applications/eu.jumplink.Steuererklaerung.desktop
      - install -Dm644 eu.jumplink.Steuererklaerung.metainfo.xml /app/share/metainfo/eu.jumplink.Steuererklaerung.metainfo.xml
      - install -Dm644 eu.jumplink.Steuererklaerung.png /app/share/icons/hicolor/128x128/apps/eu.jumplink.Steuererklaerung.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: app.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/JumpLink/steuererklaerung/releases/download/v0.1.9/steuererklaerung-0.1.9-linux-x86_64-flatpak.tar.gz
        sha256: 7881744228ccfa3ca96acb6bd51af4eea2224f3d0cbae5ea64bcb5f1733ebbec
        size: 51694311
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: steuererklaerung-wrapper
      - type: file
        path: eu.jumplink.Steuererklaerung.desktop
      - type: file
        path: eu.jumplink.Steuererklaerung.metainfo.xml
      - type: file
        path: eu.jumplink.Steuererklaerung.png
