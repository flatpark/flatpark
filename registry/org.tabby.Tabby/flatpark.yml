id: org.tabby.Tabby
name: Tabby
summary: A terminal for a modern age
website: https://tabby.sh
source_url: https://github.com/Eugeny/tabby
build:
  manifest: org.tabby.Tabby.yml
  branch: stable
  mode: extra-data
catalog:
  category: Development
  tags:
    - Terminal
    - SSH
    - Serial
    - Electron
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []

# What this package does around the vendor's build; shown on the site as the
# packaging level. See docs/packaging-playbook.md (golden rule 1).
packaging:
  - kind: seeded-config
    detail:
      en: "On first launch, turns off Tabby's automatic updates; Flatpak delivers updates instead."
      zh-Hans: "首次启动时关闭 Tabby 的自动更新，改由 Flatpak 负责更新。"
