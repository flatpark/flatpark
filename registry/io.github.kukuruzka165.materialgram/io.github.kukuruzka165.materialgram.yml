id: io.github.kukuruzka165.materialgram
# GNOME rather than the bare freedesktop runtime: Telegram's in-app browser
# (bot mini apps, payments, Instant View pages) loads WebKitGTK at run time, and
# only the GNOME runtime carries it. The binary itself links nothing beyond glibc,
# libstdc++ and the X11/GL/fontconfig base every runtime has.
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: materialgram
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Telegram client: needs the network and display; audio for calls and
  # notification sounds; dri for hardware-accelerated video. Kept to the
  # tightest set that still works — no --filesystem=home.
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Desktop integration: notifications, tray icon, idle/lock detection.
  # Media keys need no grant: inside Flatpak the MPRIS name is
  # org.mpris.MediaPlayer2.$FLATPAK_ID (lib_base), which Flatpak lets every
  # app own by default.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.login1
  # Default save location for downloaded files (the app uses portals otherwise).
  - --filesystem=xdg-download
modules:
  - name: materialgram
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 materialgram-wrapper /app/bin/materialgram
      - install -Dm644 io.github.kukuruzka165.materialgram.desktop /app/share/applications/io.github.kukuruzka165.materialgram.desktop
      - install -Dm644 io.github.kukuruzka165.materialgram.metainfo.xml /app/share/metainfo/io.github.kukuruzka165.materialgram.metainfo.xml
      - install -Dm644 io.github.kukuruzka165.materialgram.png /app/share/icons/hicolor/512x512/apps/io.github.kukuruzka165.materialgram.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: materialgram.tar.zst
        only-arches:
          - x86_64
        url: https://github.com/kukuruzka165/materialgram/releases/download/v7.0.5.1/materialgram-v7.0.5.1.tar.zst
        sha256: b3437f76bf95529e39f9ea5b077f8828e66e9c21b0bf66f9a7b3860e636b6f24
        size: 91683896
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: materialgram-wrapper
      - type: file
        path: io.github.kukuruzka165.materialgram.desktop
      - type: file
        path: io.github.kukuruzka165.materialgram.metainfo.xml
      - type: file
        path: io.github.kukuruzka165.materialgram.png
