id: com.ccswitch.desktop
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: cc-switch
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Tauri/WebKitGTK config manager for Claude Code / Codex / Gemini CLI.
  # dri for hardware-accelerated WebKit rendering; network for provider checks,
  # the built-in proxy and update pings.
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # System tray (Tauri tray-icon).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
  # Core function: read/write the live configs of every AI tool cc-switch
  # manages (Claude Code, Codex, Gemini CLI, OpenCode, OpenClaw, ...). They
  # live in ~/.<tool>, ~/.config/<tool> and bare files such as ~/.claude.json,
  # and upstream adds tools quickly, so a per-tool grant list always falls
  # behind. These configs may hold provider keys and OAuth tokens. A bare file
  # must never be granted on its own: it becomes a bind mount, and cc-switch's
  # write-temp-then-rename cannot replace a mount point (rename(2) EBUSY).
  - --filesystem=home
  # "Launch at login" writes ~/.config/autostart/CC Switch.desktop with the
  # in-sandbox executable path, which the host cannot run.
  - --nofilesystem=xdg-config/autostart
modules:
  # The Tauri tray-icon dlopen-s libayatana-appindicator at startup and PANICS if
  # it is missing — and the GNOME runtime does not ship it, so the app cannot
  # even start without it.
  # Prebuilt ayatana tray stack (libdbusmenu, ayatana-ido, libayatana-indicator,
  # libayatana-appindicator) from https://github.com/flatpark/prebuilt, built
  # against org.gnome.Sdk//51; the tag's manifest records the exact sources,
  # pins and patches. One pinned archive instead of five source builds per app,
  # and no launchpad.net downloads at build time.
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v2/ayatana-stack-ayatana-v2-gnome-51-x86_64.tar.xz
        sha256: 1051a537f22d335eb79557b8c5a610a12c326712dac74032de8e76e78b876fdc
  - name: cc-switch
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 cc-switch-wrapper /app/bin/cc-switch
      - install -Dm644 com.ccswitch.desktop.desktop /app/share/applications/com.ccswitch.desktop.desktop
      - install -Dm644 com.ccswitch.desktop.metainfo.xml /app/share/metainfo/com.ccswitch.desktop.metainfo.xml
      - install -Dm644 com.ccswitch.desktop.png /app/share/icons/hicolor/256x256/apps/com.ccswitch.desktop.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: cc-switch.deb
        only-arches:
          - x86_64
        url: https://github.com/farion1231/cc-switch/releases/download/v4.0.10/CC-Switch-v4.0.10-Linux-x86_64.deb
        sha256: 1f7cdae1e13d7db2f29eae5e0f977dc8baa320ae06f54959b7013c99519f5b01
        size: 17095986
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: cc-switch-wrapper
      - type: file
        path: com.ccswitch.desktop.desktop
      - type: file
        path: com.ccswitch.desktop.metainfo.xml
      - type: file
        path: com.ccswitch.desktop.png
