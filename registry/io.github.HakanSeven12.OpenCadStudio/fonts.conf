<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Open CAD Studio draws its text with cosmic-text/fontdb, which builds its font
  database from a fontconfig file it parses itself (FONTCONFIG_FILE, else
  $XDG_CONFIG_HOME/fontconfig/fonts.conf, else /etc/fonts/fonts.conf) and reads
  only the <dir> elements in it. Left alone inside the sandbox it never reaches
  the host's fonts, and every CJK glyph in the translated UI renders as a tofu
  box. Listing every font directory explicitly makes the host's fonts reachable.
  The include keeps real fontconfig consumers on the runtime's own rules.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- The runtime's own fonts. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>

  <!-- The host's fonts, as Flatpak mounts them into every sandbox. -->
  <dir>/run/host/fonts</dir>
  <dir>/run/host/local-fonts</dir>
  <dir>/run/host/user-fonts</dir>

  <!-- The user's own fonts inside the sandbox. -->
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
</fontconfig>
