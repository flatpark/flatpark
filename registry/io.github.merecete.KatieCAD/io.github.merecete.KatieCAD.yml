id: io.github.merecete.KatieCAD
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: katiecad
separate-locales: false
build-options:
  no-debuginfo: true
# Python 3.13 and Tcl/Tk ship inside the AppImage. Tk needs X11, Xft,
# fontconfig and libXss from the runtime. The program itself needs glibc
# and libz.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Open and Save use Tk's own dialogs. Documents is granted so a project
  # passed by path keeps working. No network: drawing and the generated
  # lists stay on this computer.
  - --filesystem=xdg-documents
modules:
  - name: katiecad
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 katiecad-wrapper /app/bin/katiecad
      - install -Dm644 io.github.merecete.KatieCAD.desktop /app/share/applications/io.github.merecete.KatieCAD.desktop
      - install -Dm644 io.github.merecete.KatieCAD.metainfo.xml /app/share/metainfo/io.github.merecete.KatieCAD.metainfo.xml
      - install -Dm644 io.github.merecete.KatieCAD.mime.xml /app/share/mime/packages/io.github.merecete.KatieCAD.xml
      - install -Dm644 io.github.merecete.KatieCAD.png /app/share/icons/hicolor/512x512/apps/io.github.merecete.KatieCAD.png
    sources:
      # appimage-offset + unsquashfs. The official tar.xz contains one
      # AppImage. Outside the managed block, which the updater rebuilds
      # from the resolver output.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: katiecad.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/Merecete/KatieCAD/releases/download/v1.1.8/KatieCAD-Linux-x86_64_v1.1.8.tar.xz
        sha256: 3601fd9c52d2b3890d4ccd2d2a8115e7f8560784f96054d59022958c24c55bfa
        size: 48382728
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: katiecad-wrapper
      - type: file
        path: io.github.merecete.KatieCAD.desktop
      - type: file
        path: io.github.merecete.KatieCAD.metainfo.xml
      - type: file
        path: io.github.merecete.KatieCAD.mime.xml
      - type: file
        path: io.github.merecete.KatieCAD.png
