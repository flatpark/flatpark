id: com.ollama.Ollama
name: Ollama (CUDA)
summary: Run local language models with NVIDIA CUDA acceleration
website: https://ollama.com
source_url: https://github.com/ollama/ollama
build:
  manifest: com.ollama.Ollama.yml
  branch: stable
  mode: extra-data
  arches: [x86_64]
catalog:
  interface: cli
  category: AI
  tags: [AI, LLM, CUDA, NVIDIA, CLI]
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions:
    - --device=all
