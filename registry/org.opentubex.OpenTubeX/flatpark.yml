id: org.opentubex.OpenTubeX
name: OpenTubeX
summary: Privacy-focused desktop YouTube client
website: https://opentubex.org/
source_url: https://github.com/OpenTubeX/OpenTubeX
build:
  manifest: org.opentubex.OpenTubeX.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: AudioVideo
  upstream_approved: true
  tags:
    - YouTube
    - Video
    - Player
    - Privacy
    - Electron
update:
  command: ./resolve-update.sh
  # OpenTubeX's release workflow opens the update PR itself (release notes,
  # screenshots, finish-args from upstream's manifest); a pin-only refresh
  # would race it and ship without them (#817, #899). Run the resolver by hand
  # with FORCE=1 if that PR doesn't come. See #901.
  auto: false
policy:
  proprietary: false
  dangerous_permissions: []
