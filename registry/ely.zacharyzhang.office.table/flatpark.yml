# FlatPark catalog descriptor for ElyTable, part of Ely Office.
#
# read-descriptor.mjs is a line scanner, not a YAML parser; keep the plain
# two-space block style below.
id: ely.zacharyzhang.office.table
name: ElyTable
summary: Spreadsheet editor for XLSX, ODS and CSV files
website: https://office.elygpui.com
source_url: https://git.zacharyzhang.com/ZacharyZhang-NY/ElyOffice
build:
  manifest: ely.zacharyzhang.office.table.yml
  branch: stable
  mode: extra-data
catalog:
  category: Office
  tags:
    - Spreadsheet
    - XLSX
    - ODS
    - CSV
    - LibreOffice
    - Offline
update:
  command: ./resolve-update.sh
policy:
  # AGPL-3.0-or-later (upstream LICENSE and the .deb's own licence field).
  proprietary: false
  dangerous_permissions: []
