# FlatPark catalog descriptor for ElyTable, part of Ely Office.
#
# read-descriptor.mjs is a line scanner, not a YAML parser; keep the plain
# two-space block style below.
id: ely.zacharyzhang.office.table
name: ElyTable
summary: Spreadsheet editor for XLSX, ODS and CSV files
website: https://office.elygpui.com
source_url: https://github.com/ELY-Open-Source/ElyOffice
build:
  manifest: ely.zacharyzhang.office.table.yml
  branch: stable
  mode: extra-data
catalog:
  category: Office
  upstream_approved: true
  tags:
    - Spreadsheet
    - XLSX
    - ODS
    - CSV
    - LibreOffice
    - Offline
update:
  command: ./resolve-update.sh
policy:
  # MIT AND MPL-2.0. Ely's own code is MIT since 2026-10-19 (upstream
  # LICENSE); the bundled LibreOffice keeps its licence, as upstream's
  # packaging/linux/package.sh declares.
  proprietary: false
  dangerous_permissions: []
