id: ely.zacharyzhang.office.table
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: ely-table
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # ElyTable is a GPUI application. The .deb is a self-contained tree built with
  # linuxdeploy: it bundles every library the runtime might lack (libxkbcommon,
  # xcb-xkb, dbus, systemd) and links only glibc, libstdc++, Vulkan, Wayland and
  # xcb from the system, all in org.freedesktop.Platform 26.08. GPUI renders
  # through Vulkan on the runtime's Mesa, hence dri, and opens a Wayland or
  # X11 window, whichever the session has.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Accessibility through AccessKit's AT-SPI adapter, which asks org.a11y.Bus
  # where the accessibility bus lives.
  - --talk-name=org.a11y.Bus
  # Ely Office keeps nothing in the home directory: each app's settings,
  # recovery points, logs and instance lock live in $XDG_DATA_HOME/ElyOffice/
  # ely-table, which Flatpak points at ~/.var/app/ely.zacharyzhang.office.table/data.
  # Files are opened and saved through the file-chooser portal, and the .desktop
  # Exec ends in %F, so files opened from a file manager arrive through the
  # document portal. Documents is where an office app saves by default and
  # Downloads is where documents arrive; the rest of $HOME stays invisible.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # network is for 127.0.0.1. Ely Office keeps one copy of each app running: a
  # second launch (another file opened from the file manager) hands its files
  # to the running copy over a TCP connection on 127.0.0.1, whose port the
  # first copy writes to instance.door in its data directory. Without
  # --share=network every `flatpak run` gets a network namespace of its own,
  # the connection is refused and the second launch fails with an error.
  # The app itself goes online for nothing: upstream's help (docs/help.md,
  # "Offline boundary") says none of the apps needs a network, account or
  # online service, and the self-updater only runs from a macOS .app bundle.
  - --share=network
  # Deliberately not granted; the metainfo documents the override:
  #   --filesystem=home   -> open documents anywhere under $HOME by path
modules:
  - name: ely-table
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 ely-table-wrapper /app/bin/ely-table
      - install -Dm644 fonts.conf /app/etc/fonts/fonts.conf
      - install -Dm644 ely.zacharyzhang.office.table.desktop /app/share/applications/ely.zacharyzhang.office.table.desktop
      - install -Dm644 ely.zacharyzhang.office.table.metainfo.xml /app/share/metainfo/ely.zacharyzhang.office.table.metainfo.xml
      - install -Dm644 ely.zacharyzhang.office.table.png /app/share/icons/hicolor/512x512/apps/ely.zacharyzhang.office.table.png
    sources:
      # The LibreOffice kernel the .deb bundles carries its own libcurl, which
      # has a hard DT_NEEDED on libgssapi_krb5.so.2 (readelf -d). The .deb
      # Depends on libgssapi-krb5-2 for it; org.freedesktop.Platform 26.08
      # ships no krb5, so without it the document engine never loads. The
      # load-time closure of libgssapi_krb5.so.2 from flatpark/prebuilt, the
      # same archive IBKR Desktop pins; the wrapper puts its lib/ LAST on
      # LD_LIBRARY_PATH.
      #
      # Deliberately OUTSIDE the managed block below: update-pins.mjs rebuilds
      # that block from the resolver's sources and would drop anything else in it.
      - type: extra-data
        filename: krb5-gss.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/krb5-gss-v2/krb5-gss-krb5-gss-v2-fd-26.08-x86_64.tar.xz
        sha256: 499040be2b155b7a2869cfbe472031bbe336dff887d26809fa54fc5ae318dcf8
        size: 473004
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: ely-table.deb
        only-arches:
          - x86_64
        url: https://github.com/ELY-Open-Source/ElyOffice/releases/download/v0.1.9/ely-table_0.1.9-1_amd64.deb
        sha256: cb7328b4473ab3e34e56871cebd4c59f521b0be9b18ad5be8b698da4cdf9a447
        size: 249315368
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: ely-table-wrapper
      - type: file
        path: fonts.conf
      - type: file
        path: ely.zacharyzhang.office.table.desktop
      - type: file
        path: ely.zacharyzhang.office.table.metainfo.xml
      - type: file
        path: ely.zacharyzhang.office.table.png
