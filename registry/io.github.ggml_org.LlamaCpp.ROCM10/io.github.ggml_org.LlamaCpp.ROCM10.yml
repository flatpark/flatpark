id: io.github.ggml_org.LlamaCpp.ROCM10
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: llama-server
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Download models and serve the loopback HTTP API and browser interface.
  - --share=network
  # ROCm compute needs /dev/kfd as well as /dev/dri; DRI alone omits KFD.
  # Flatpak exposes KFD only through the broad device grant, declared in flatpark.yml.
  - --device=all
modules:
  - name: llama
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 llama-wrapper /app/bin/llama-server
      - ln -s llama-server /app/bin/llama
      - ln -s llama-server /app/bin/llama-cli
      - ln -s llama-server /app/bin/llama-bench
      - ln -s llama-server /app/bin/llama-quantize
      - install -Dm644 io.github.ggml_org.LlamaCpp.ROCM10.desktop /app/share/applications/io.github.ggml_org.LlamaCpp.ROCM10.desktop
      - install -Dm644 io.github.ggml_org.LlamaCpp.ROCM10.metainfo.xml /app/share/metainfo/io.github.ggml_org.LlamaCpp.ROCM10.metainfo.xml
      - install -Dm644 io.github.ggml_org.LlamaCpp.ROCM10.svg /app/share/icons/hicolor/scalable/apps/io.github.ggml_org.LlamaCpp.ROCM10.svg
      - install -Dm644 branding.txt /app/share/doc/io.github.ggml_org.LlamaCpp.ROCM10/branding.txt
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: llama.tar.gz
        only-arches: [x86_64]
        url: https://github.com/ggml-org/llama.cpp/releases/download/b12359/llama-b12359-bin-ubuntu-rocm-10.0-x64.tar.gz
        sha256: 2d934c367e613ec67a5f78dffa450ee30bc3a6024f559b70c207896ee4bc9108
        size: 270816049
      # END MANAGED EXTRA-DATA
