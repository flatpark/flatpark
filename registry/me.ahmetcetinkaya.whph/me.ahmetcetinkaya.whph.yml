id: me.ahmetcetinkaya.whph
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: whph
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Flutter/GTK3 bundle. It links GTK3, GStreamer (audioplayers, for timer and
  # alarm sounds), fontconfig and X11, all in org.gnome.Platform, plus
  # libayatana-appindicator3 for the tray, which the runtime lacks and the
  # ayatana-stack module below supplies.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Timer, alarm and reminder sounds.
  - --socket=pulseaudio
  # Device sync and the optional AI assistant.
  - --share=network
  # Tray icon (libayatana-appindicator over StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
  # Tasks, habits and notes live in a SQLite database under the XDG data dir,
  # which Flatpak redirects into ~/.var/app/me.ahmetcetinkaya.whph. Exports and
  # imports go through the file chooser. No filesystem grant.
modules:
  # Prebuilt ayatana tray stack (libdbusmenu, ayatana-ido, libayatana-indicator,
  # libayatana-appindicator) from https://github.com/flatpark/prebuilt, built
  # against org.gnome.Sdk//51. The bundle's main binary links it directly, so
  # without it the app cannot start.
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v2/ayatana-stack-ayatana-v2-gnome-51-x86_64.tar.xz
        sha256: 1051a537f22d335eb79557b8c5a610a12c326712dac74032de8e76e78b876fdc
  - name: whph
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 whph-wrapper /app/bin/whph
      - install -Dm644 me.ahmetcetinkaya.whph.desktop /app/share/applications/me.ahmetcetinkaya.whph.desktop
      - install -Dm644 me.ahmetcetinkaya.whph.metainfo.xml /app/share/metainfo/me.ahmetcetinkaya.whph.metainfo.xml
      - install -Dm644 me.ahmetcetinkaya.whph.png /app/share/icons/hicolor/512x512/apps/me.ahmetcetinkaya.whph.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: whph.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/ahmet-cetinkaya/whph/releases/download/v0.24.2/whph-v0.24.2-linux.tar.gz
        sha256: dfa0ae7a394d27dcce3f388e9460ce922946222847ac8b3315256dd7b9d0ef0b
        size: 27239153
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: whph-wrapper
      - type: file
        path: me.ahmetcetinkaya.whph.desktop
      - type: file
        path: me.ahmetcetinkaya.whph.metainfo.xml
      - type: file
        path: me.ahmetcetinkaya.whph.png
