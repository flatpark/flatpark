id: ai.genoffice.GenOffice
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
# Electron app: use the Electron base app, which ships zypak. zypak redirects
# Chromium's SUID sandbox onto the Flatpak sandbox so the app keeps an internal
# sandbox (the wrapper runs it via zypak-wrapper) instead of --no-sandbox. The
# base is a prebuilt ref merged into the app at build time; the official
# upstream application tree is fetched as extra-data and left unmodified.
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: genoffice
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Electron (Chromium) office suite. The prebuilt build bundles Chromium and
  # its own ffmpeg/ANGLE/SwiftShader, the Rust xlsx-engine sidecar and the
  # pdfium/harfbuzz wasm blobs; the GTK3, NSS, CUPS, ATK, dbus, ALSA and X11
  # stacks it links come from org.freedesktop.Platform 25.08 (verified against
  # the binary's NEEDED set, 0 missing).
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU-accelerated document rendering (Chromium compositing).
  - --device=dri
  # Document editing itself is local, but the AI features (agents, search,
  # image tools) sign in to a Genspark account and call its API over the
  # network.
  - --share=network
  # File -> Print (Ctrl+P) prints the current document through Chromium, which
  # talks to CUPS for the printer list and the job.
  - --socket=cups
  # Background notifications for long-running AI/document jobs.
  - --talk-name=org.freedesktop.Notifications
  # An office suite has to reach the user's documents, and the app's own default
  # save location is <Documents>/GenOffice. Downloads is the other directory
  # office files routinely arrive in — an attachment or a file pulled from a
  # browser lands there — so opening and saving in place works in both without
  # a broader grant. The rest of $HOME stays invisible. Files kept anywhere else
  # are reached through the desktop portal's file chooser, and only the ones the
  # user picks become visible to the app. Files passed on the command line
  # (double-click in a file manager, via the .docx/.xlsx/.pptx/.pdf/.md
  # associations) also arrive through the document portal rather than as raw
  # host paths: the .desktop Exec ends in %U, so flatpak exports it with
  # --file-forwarding and rewrites the argument to `@@u %U @@`.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # The Genspark sign-in token is written to ~/.genoffice/auth.json (mode 0600)
  # via os.homedir(), not through XDG_CONFIG_HOME. Under the default sandbox
  # $HOME is a tmpfs with only granted paths bind-mounted into it, so without
  # this grant the token is lost on exit and the AI features ask for a fresh
  # login on every launch. `:create` because the directory does not exist before
  # the first sign-in. This is the same path the upstream .deb/.rpm use, so an
  # existing host install's session carries over. Everything else the app stores
  # — settings, projects, autosave/recovery copies, recent lists — goes to
  # Electron's userData under XDG_CONFIG_HOME and stays inside the sandbox.
  - --filesystem=~/.genoffice:create
  # Strip a leaked ELECTRON_RUN_AS_NODE from the sandbox env so the binary — and
  # zypak's spawned child/zygote processes, which the wrapper's own `unset`
  # can't reach — always start as the GUI app rather than as plain Node.
  - --unset-env=ELECTRON_RUN_AS_NODE
  # Deliberately NOT granted by default (users opt in per the metainfo notes
  # via `flatpak override`):
  #   --filesystem=home        -> keep documents outside ~/Documents and
  #                               ~/Downloads
  #   --socket=pulseaudio      -> audio in media embedded in a presentation
  #   --filesystem=~/.fonts:ro -> use fonts installed in the user's home when
  #                               laying out and embedding a document
modules:
  - name: genoffice
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 genoffice-wrapper /app/bin/genoffice
      - install -Dm644 ai.genoffice.GenOffice.desktop /app/share/applications/ai.genoffice.GenOffice.desktop
      - install -Dm644 ai.genoffice.GenOffice.metainfo.xml /app/share/metainfo/ai.genoffice.GenOffice.metainfo.xml
      - install -Dm644 ai.genoffice.GenOffice.png /app/share/icons/hicolor/512x512/apps/ai.genoffice.GenOffice.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: genoffice.deb
        only-arches:
          - x86_64
        url: https://github.com/genspark-ai/genoffice/releases/download/v0.8.155/genoffice_0.8.155_amd64.deb
        sha256: e361926ad09cd5607fbe3419a0f1d42062013d6f8ba7d29ef59a97ad2f8ce402
        size: 134426748
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: genoffice-wrapper
      - type: file
        path: ai.genoffice.GenOffice.desktop
      - type: file
        path: ai.genoffice.GenOffice.metainfo.xml
      - type: file
        path: ai.genoffice.GenOffice.png
