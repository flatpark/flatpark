id: io.github.bherbruck.SolidCraft
# App id is the author's GitHub namespace. Upstream's own Flatpak (bundle and repo)
# uses ai.storyteller.solidcraft (ai.storyteller.solvecraft before 0.8),
# and that string is compiled into the binary as its Wayland app id
# (StartupWMClass). Finish-args follow packaging/linux/flatpak/ in
# tangency-labs/solidcraft. The runtime is 26.08. The binaries need glibc and
# dlopen libwayland, libX11, xkbcommon and Vulkan from it.
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: solidcraft
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Native Rust/egui app on winit. Wayland first; X11 only when no compositor
  # is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu viewport (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save go through the file-chooser portal. Documents is granted so a
  # design passed by path keeps working.
  - --filesystem=xdg-documents
  # 3D mouse: since 0.15 SolidCraft reads spacenavd's socket when the daemon
  # runs (upstream #1146). The sandbox has no hidraw, so this is the only route.
  - --filesystem=/run/spnav.sock
  # Deliberately not granted:
  #   --share=network          -> the optional --control server listens on
  #                               127.0.0.1 inside the sandbox; the metainfo
  #                               documents the override that exposes it
  #   --filesystem=home / host -> everything else goes through the portal
modules:
  - name: solidcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 solidcraft-wrapper /app/bin/solidcraft
      - install -Dm755 solidcraft-cli-wrapper /app/bin/solidcraft-cli
      # Pre-0.5 command name, kept so existing MCP/CLI setups keep working.
      - ln -s solidcraft-cli /app/bin/solvecraft-cli
      - install -Dm644 io.github.bherbruck.SolidCraft.desktop /app/share/applications/io.github.bherbruck.SolidCraft.desktop
      - install -Dm644 io.github.bherbruck.SolidCraft.metainfo.xml /app/share/metainfo/io.github.bherbruck.SolidCraft.metainfo.xml
      - install -Dm644 io.github.bherbruck.SolidCraft.mime.xml /app/share/mime/packages/io.github.bherbruck.SolidCraft.xml
      - install -Dm644 io.github.bherbruck.SolidCraft.png /app/share/icons/hicolor/512x512/apps/io.github.bherbruck.SolidCraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: solidcraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/tangency-labs/solidcraft/releases/download/v0.16.0/solidcraft-0.16.0-linux-x86_64.tar.gz
        sha256: 361e51c88a22fd26adf456807fdf5627d37d11fb50b76941a8c057f0ba10cc22
        size: 63246848
      - type: extra-data
        filename: solidcraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/tangency-labs/solidcraft/releases/download/v0.16.0/solidcraft-0.16.0-linux-aarch64.tar.gz
        sha256: 56ab312964e17d3b4ba0bc367fbcf0bda2931353145b92180fb5ed60bc608b95
        size: 56918090
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: solidcraft-wrapper
      - type: file
        path: solidcraft-cli-wrapper
      - type: file
        path: io.github.bherbruck.SolidCraft.desktop
      - type: file
        path: io.github.bherbruck.SolidCraft.metainfo.xml
      - type: file
        path: io.github.bherbruck.SolidCraft.mime.xml
      - type: file
        path: io.github.bherbruck.SolidCraft.png
