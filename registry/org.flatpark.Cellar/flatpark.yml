id: org.flatpark.Cellar
name: Cellar
summary: Declarative Wine prefix manager, with a GUI and a CLI
website: https://github.com/jing2uo/cellar
source_url: https://github.com/jing2uo/cellar
build:
  manifest: org.flatpark.Cellar.yml
  branch: stable
  mode: extra-data
catalog:
  category: Utility
  # Packaged by Cellar's developer in flatpark#642. Row in
  # docs/reference/upstream-approvals.md.
  upstream_approved: true
  tags:
    - Wine
    - Windows
    - Compatibility
    - CLI
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions:
    # Flatpak's seccomp filter otherwise kills new-WoW64 Wine's 32-bit
    # processes.
    - --allow=multiarch
