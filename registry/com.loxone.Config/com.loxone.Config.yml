id: com.loxone.Config
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
# Wine is org.winehq.Wine as the user installed it from Flathub, not bundled
# (flatpark.yml requires it; the launcher says how to install it when it is
# missing). The launcher is cellar's static CLI: it builds the user's Wine
# prefix from /app/share/cellar/cellar.toml, runs the vendor's installer there
# on first launch (and again when the package brings a newer one), then starts
# Loxone Config.
command: cellar
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  # Miniserver discovery and connections.
  - --share=network
  # Wine draws through its X11 driver (XWayland on Wayland desktops).
  - --socket=x11
  - --device=dri
  # Automation projects and exports. cellar.toml shows the
  # accessible home folders as H:. Desktop-opened files use the document portal.
  - --filesystem=xdg-documents
  # New-WoW64 Wine runs 32-bit Windows code with no 32-bit Linux libraries, but
  # Flatpak's default seccomp filter still kills it without this.
  - --allow=multiarch
  # org.winehq.Wine where flatpak installs it, per user and system-wide: the
  # Wine cellar runs. An app, so it can't be mounted as an extension.
  - --filesystem=~/.local/share/flatpak/app/org.winehq.Wine:ro
  - --filesystem=/var/lib/flatpak/app/org.winehq.Wine:ro
modules:
  - name: loxone-config
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - ln -s /app/extra/cellar /app/bin/cellar
      - install -Dm644 cellar.toml /app/share/cellar/cellar.toml
      - install -Dm644 com.loxone.Config.desktop /app/share/applications/com.loxone.Config.desktop
      - install -Dm644 com.loxone.Config.metainfo.xml /app/share/metainfo/com.loxone.Config.metainfo.xml
      - install -Dm644 com.loxone.Config.png /app/share/icons/hicolor/256x256/apps/com.loxone.Config.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: loxone-config.zip
        only-arches:
          - x86_64
        url: https://updatefiles.loxone.com/LoxConfig/LoxoneConfigSetup_17031123.zip
        sha256: 19d04156046b466191bb6fba54b90bafe34678bc3cf02076875d162d88dd3fec
        size: 672276400
      # END MANAGED EXTRA-DATA
      # cellar's static CLI (github.com/jing2uo/cellar), the launcher shared by
      # FlatPark's Wine packages. Pinned by hand, outside the managed block.
      - type: extra-data
        filename: cellar-cli-x86_64
        only-arches:
          - x86_64
        url: https://github.com/jing2uo/cellar/releases/download/v0.6.0/cellar-cli-x86_64
        sha256: 03a6b0032a25828c8fbd3da2e1919ef252279e4cb333ddea915ba6c0ee1e45ec
        size: 9760928
      - type: file
        path: apply_extra.sh
      - type: file
        path: cellar.toml
      - type: file
        path: com.loxone.Config.desktop
      - type: file
        path: com.loxone.Config.metainfo.xml
      - type: file
        path: com.loxone.Config.png
