id: site.harbor.Harbor.Beta
name: Harbor Beta
summary: Beta channel of a Stremio client built for adventure
website: https://harbor.site/
source_url: https://github.com/harborstremio-linux/harbor-linux-builds
build:
  manifest: site.harbor.Harbor.Beta.yml
  branch: beta
  mode: extra-data
catalog:
  category: AudioVideo
  # Harbor's own README names harborstremio-linux/harbor-linux-builds the
  # official Linux channel (harborstremio/harbor#1097), and that repo's README
  # gives FlatPark as the install method for the beta channel. This package was
  # submitted and is maintained by that channel's maintainer (flatpark#159).
  # Row in docs/upstream-approvals.md.
  upstream_approved: true
  tags:
    - Media
    - Video
    - Stremio
    - Beta
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []
