id: site.harbor.Harbor.Beta
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: harbor-beta
separate-locales: false
build-options:
  # no-debuginfo alone leaves the DWARF inside mpv-stack's copied libraries;
  # ~10 MB of this ref was debug sections.
  no-debuginfo: true
  strip: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Harbor registers org.mpris.MediaPlayer2.harbor, and a second instance
  # falls back to org.mpris.MediaPlayer2.harbor.instance<N>; the wildcard
  # covers both.
  - --own-name=org.mpris.MediaPlayer2.harbor.*
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/tray-icon:create
modules:
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v2/ayatana-stack-ayatana-v2-gnome-51-x86_64.tar.xz
        sha256: 1051a537f22d335eb79557b8c5a610a12c326712dac74032de8e76e78b876fdc

  - name: mpv-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/mpv-v2/mpv-stack-mpv-v2-gnome-51-x86_64.tar.xz
        sha256: 3d4a1c48d8a466bd86badbf683f21dfd05ea15c2f8f512414316e7842c863c93

  - name: media-tools
    buildsystem: simple
    build-commands:
      - install -Dm755 /usr/bin/ffmpeg /app/bin/ffmpeg
      - install -Dm755 /usr/bin/ffprobe /app/bin/ffprobe
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.06.09/yt-dlp
        sha256: e5d57466682cfa9d61e9cf7c8a4f09b00f4a62af37d3bbdc4bcffdf63615feac

  - name: harbor-beta
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 harbor-beta-wrapper /app/bin/harbor-beta
      - install -Dm644 site.harbor.Harbor.Beta.desktop /app/share/applications/site.harbor.Harbor.Beta.desktop
      - install -Dm644 site.harbor.Harbor.Beta.metainfo.xml /app/share/metainfo/site.harbor.Harbor.Beta.metainfo.xml
      - install -Dm644 site.harbor.Harbor.Beta.png /app/share/icons/hicolor/512x512/apps/site.harbor.Harbor.Beta.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: harbor-beta.deb
        only-arches:
          - x86_64
        url: https://github.com/harborstremio-linux/harbor-linux-builds/releases/download/beta-v0.9.127/Harbor_0.9.127-1_amd64.deb
        sha256: 831a03213607dd38bbfc86c2bbead782ce7283024b10a54b5e155ad610b89689
        size: 117097044
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: harbor-beta-wrapper
      - type: file
        path: site.harbor.Harbor.Beta.desktop
      - type: file
        path: site.harbor.Harbor.Beta.metainfo.xml
      - type: file
        path: site.harbor.Harbor.Beta.png
