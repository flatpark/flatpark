id: now.alma.Alma
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
# Since 0.4.491 Alma is a native Go app that dlopens GTK 3 and WebKitGTK 4.1
# (no longer Electron), so it needs the GNOME runtime for libwebkit2gtk-4.1.
# The official upstream application tree is fetched as extra-data and left
# unmodified.
command: alma
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Native AI assistant on WebKitGTK 4.1; GTK 3, WebKitGTK, libsoup and
  # libsecret come from the GNOME runtime. The server side is the bundled
  # alma-server Node runtime under /app/extra/alma.
  - --share=ipc
  # Talks to the configured AI providers (OpenAI, Anthropic, Gemini, custom
  # endpoints) and its web-search integration.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Voice conversations: microphone in / speech out (bundled sherpa-onnx).
  - --socket=pulseaudio
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # Encrypt stored provider API keys (Electron safeStorage / libsecret) with
  # the session keyring when one is present.
  - --talk-name=org.freedesktop.secrets
  # Strip a leaked ELECTRON_RUN_AS_NODE (set by VS Code and other Electron
  # terminals). The native launcher still honours it: it drops the variable and
  # execs the bundled alma-server runtime as plain Node, which exits at once
  # with no window.
  - --unset-env=ELECTRON_RUN_AS_NODE
  # Tray icon (StatusNotifierItem via libayatana-appindicator3, which the
  # ayatana-stack module supplies).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Deliberately NOT granted by default (the chat/memory/tool core works
  # without them; users opt in per the metainfo notes via `flatpak override`):
  #   --filesystem=home -> let the agent's file and terminal skills act on real
  #                        files instead of the sandboxed private home
  #   --device=all      -> webcam for the camera-based skills
modules:
  # The launcher dlopens libayatana-appindicator3.so.1 for its tray and skips
  # the tray without it; the GNOME runtime lacks it. Prebuilt stack from
  # https://github.com/flatpark/prebuilt, built against org.gnome.Sdk//51.
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v3/ayatana-stack-ayatana-v3-gnome-51-x86_64.tar.xz
        sha256: 21b02738793af6cd8d3355a1c5008697096b3000c9d2a4d7dfdbc43375a70056
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v3/ayatana-stack-ayatana-v3-gnome-51-aarch64.tar.xz
        sha256: b9f9cb632dc4456dd3711059df72e4fc92b30f59b688e411ab7c6df9a2bb7c27
  - name: alma
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 alma-wrapper /app/bin/alma
      - install -Dm644 now.alma.Alma.desktop /app/share/applications/now.alma.Alma.desktop
      - install -Dm644 now.alma.Alma.metainfo.xml /app/share/metainfo/now.alma.Alma.metainfo.xml
      - install -Dm644 now.alma.Alma.png /app/share/icons/hicolor/512x512/apps/now.alma.Alma.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: alma.deb
        only-arches:
          - x86_64
        url: https://github.com/yetone/alma-releases/releases/download/v0.4.516/alma-0.4.516-linux-amd64.deb
        sha256: 86a2fca555508c7cf28286971d6aec974277955adaca5d32bc53e4e753daa7de
        size: 256154026
      - type: extra-data
        filename: alma.deb
        only-arches:
          - aarch64
        url: https://github.com/yetone/alma-releases/releases/download/v0.4.516/alma-0.4.516-linux-arm64.deb
        sha256: 2985ff6d723deedae1e7651615376e30dc6a33704ec3dcb9c0af265b0a4abe54
        size: 248846706
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: alma-wrapper
      - type: file
        path: now.alma.Alma.desktop
      - type: file
        path: now.alma.Alma.metainfo.xml
      - type: file
        path: now.alma.Alma.png
