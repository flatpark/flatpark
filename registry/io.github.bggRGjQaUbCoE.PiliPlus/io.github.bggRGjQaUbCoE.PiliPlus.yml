id: io.github.bggRGjQaUbCoE.PiliPlus
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: piliplus
separate-locales: false
build-options:
  no-debuginfo: true
  strip: true
finish-args:
  # Flutter / GTK3 window with GPU acceleration
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio playback (PulseAudio/PipeWire for mpv / media_kit)
  - --socket=pulseaudio
  # Network access for Bilibili streaming, search, and API
  - --share=network
  # The upstream GApplication id is still the Flutter template default; without
  # owning it, g_application_register fails and the app exits at start-up.
  - --own-name=com.example.piliplus
  # StatusNotifier tray icon. nativeapi registers only after owning
  # org.kde.StatusNotifierItem-<pid>-<n>, and the app is always PID 2 in the sandbox.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications
  # MPRIS: audio_service_mpris registers under the hard-coded dBusName
  # com.example.piliplus.audio, not the app id, as
  # org.mpris.MediaPlayer2.com.example.piliplus.audio.instance<pid>. Without it
  # AudioService.init throws in main() and runApp is never reached (since 2.2.0).
  - --own-name=org.mpris.MediaPlayer2.com.example.piliplus.*
  # ConnectivityUtils.isWiFi asks NetworkManager whether the link is metered
  # before loading each video, to pick the mobile-data quality and autoplay
  # settings. With no system bus socket at all the dbus package's connect error
  # escapes the app's try/catch and the await never completes, so videos stay
  # on the cover (since 2.2.0). This grant also mounts the system bus.
  - --system-talk-name=org.freedesktop.NetworkManager
modules:
  - name: mpv-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/mpv-v2/mpv-stack-mpv-v2-gnome-51-x86_64.tar.xz
        sha256: 3d4a1c48d8a466bd86badbf683f21dfd05ea15c2f8f512414316e7842c863c93

  - name: piliplus
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 piliplus-wrapper /app/bin/piliplus
      - install -Dm644 io.github.bggRGjQaUbCoE.PiliPlus.desktop /app/share/applications/io.github.bggRGjQaUbCoE.PiliPlus.desktop
      - install -Dm644 io.github.bggRGjQaUbCoE.PiliPlus.metainfo.xml /app/share/metainfo/io.github.bggRGjQaUbCoE.PiliPlus.metainfo.xml
      - install -Dm644 io.github.bggRGjQaUbCoE.PiliPlus.png /app/share/icons/hicolor/512x512/apps/io.github.bggRGjQaUbCoE.PiliPlus.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: piliplus.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/bggRGjQaUbCoE/PiliPlus/releases/download/2.2.0.1/PiliPlus_linux_2.2.0%2B5590_amd64.tar.gz
        sha256: 2d9be172aaf3a308a0d133c7d47de8e54a102eb07016d0f38e8919c70333a173
        size: 19271557
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: piliplus-wrapper
      - type: file
        path: io.github.bggRGjQaUbCoE.PiliPlus.desktop
      - type: file
        path: io.github.bggRGjQaUbCoE.PiliPlus.metainfo.xml
      - type: file
        path: io.github.bggRGjQaUbCoE.PiliPlus.png
