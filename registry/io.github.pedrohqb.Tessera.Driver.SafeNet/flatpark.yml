id: io.github.pedrohqb.Tessera.Driver.SafeNet
name: SafeNet Authentication Client
summary: SafeNet eToken and IDPrime driver for Tessera
website: https://cpl.thalesgroup.com/access-management/authenticators/pki-usb-authentication/etoken-5110-usb-token
source_url: https://github.com/pedrohqb/tessera/tree/main/flatpak/extensions/SafeNet
build:
  manifest: io.github.pedrohqb.Tessera.Driver.SafeNet.yml
  branch: stable
  mode: extra-data
  extends: io.github.pedrohqb.Tessera
catalog:
  category: Security
  tags:
    - Brazil
    - ICP-Brasil
    - DigitalSignature
    - SmartCard
update:
  command: ./resolve-update.sh
policy:
  # The vendor's driver is closed source.
  proprietary: true

# What this package does around the vendor's build; shown on the site as the
# packaging level.
packaging:
  - kind: file-change
    detail:
      en: "Only the Ubuntu core package (without the graphical tools) is taken from the vendor's zip. Its /etc folder and install scripts are not used."
      zh-Hans: "只从厂商的 zip 中取 Ubuntu 核心软件包（不含图形工具）。其 /etc 目录和安装脚本不使用。"
