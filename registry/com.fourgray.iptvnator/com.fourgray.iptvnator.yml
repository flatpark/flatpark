id: com.fourgray.iptvnator
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
# Electron app: use the Electron base app, which ships zypak. zypak redirects
# Chromium's SUID sandbox onto the Flatpak sandbox, so the app keeps an internal
# sandbox (the wrapper runs it via zypak-wrapper) instead of --no-sandbox.
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: iptvnator
separate-locales: false
build-options:
  no-debuginfo: true
# The permissions follow the finishArgs upstream sets for its own Flatpak build
# of this same app id (electron-builder.json), so someone moving over from
# upstream's bundle gets the same sandbox, with one exception noted below.
finish-args:
  # Electron IPTV player. The .deb bundles Chromium plus its own ffmpeg (with
  # the H.264/AAC decoders the built-in player uses for HLS streams),
  # ANGLE/SwiftShader and the better-sqlite3 native module; the GTK3, NSS,
  # ALSA, dbus, gbm and X11 stacks it links come from the runtime.
  - --share=ipc
  # Playlists, EPG data and the streams themselves.
  - --share=network
  # Upstream starts IPTVnator with --ozone-platform=x11 (its .desktop Exec line
  # and electron-builder executableArgs), and the wrapper does the same, so it
  # needs the X socket even on a Wayland session — plain x11, not fallback-x11.
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  # Upstream's choice: the home directory, for opening playlist files from
  # anywhere. IPTVnator's own data (playlists, favourites, the SQLite database)
  # stays under $XDG_CONFIG_HOME, which Flatpak still points at
  # ~/.var/app/com.fourgray.iptvnator/config.
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  # MPRIS: media keys and the desktop's "now playing" applet. The embedded
  # Chromium publishes the player under a chromium.instance<pid> name.
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  # Strip a leaked ELECTRON_RUN_AS_NODE from the sandbox env so the binary — and
  # zypak's spawned child/zygote processes, which the wrapper's own `unset`
  # cannot reach — always start as the GUI app rather than as plain Node.
  - --unset-env=ELECTRON_RUN_AS_NODE
  # Deliberately not granted, although upstream's own Flatpak has it:
  #   --talk-name=org.freedesktop.Flatpak -> IPTVnator launches an *external*
  #     player (MPV or VLC on the host) through `flatpak-spawn --host`. That
  #     name lets the app run any command on the host outside the sandbox, so
  #     it is an opt-in override documented in the metainfo. The built-in
  #     player needs nothing from the host.
modules:
  - name: iptvnator
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 iptvnator-wrapper /app/bin/iptvnator
      - install -Dm644 com.fourgray.iptvnator.desktop /app/share/applications/com.fourgray.iptvnator.desktop
      - install -Dm644 com.fourgray.iptvnator.metainfo.xml /app/share/metainfo/com.fourgray.iptvnator.metainfo.xml
      - install -Dm644 com.fourgray.iptvnator.png /app/share/icons/hicolor/512x512/apps/com.fourgray.iptvnator.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: app.deb
        only-arches:
          - x86_64
        url: https://github.com/4gray/iptvnator/releases/download/v0.24.0/iptvnator-0.24.0-linux-amd64.deb
        sha256: faaa85552ef23ee64ec835f51c598f788e998a329010ed73ec024b963fedf0a2
        size: 133824460
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: iptvnator-wrapper
      - type: file
        path: com.fourgray.iptvnator.desktop
      - type: file
        path: com.fourgray.iptvnator.metainfo.xml
      - type: file
        path: com.fourgray.iptvnator.png
