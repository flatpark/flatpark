id: monster.rollenspiel.Griffel
name: Griffel
summary: Markdown notes with a file sidebar
website: https://git.rollenspiel.monster/Tealk/griffel
source_url: https://git.rollenspiel.monster/Tealk/griffel
build:
  manifest: monster.rollenspiel.Griffel.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: Office
  # Submitted and maintained by the app's own developer: the submission PR is
  # the approval, and docs/reference/upstream-approvals.md carries the row.
  upstream_approved: true
  tags:
    - Markdown
    - Notes
    - Editor
    - GTK4
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions:
    # The vault is any folder the user picks: its path is stored in GSettings,
    # the tree is watched live and written, and wiki links resolve inside it.
    # The document portal cannot stand in, because changes made outside the
    # sandbox do not reach the app's file monitor through the portal's FUSE
    # mount. Without a real grant the sidebar would silently go stale.
    - --filesystem=home
