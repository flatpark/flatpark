id: com.google.Antigravity
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: antigravity
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --unset-env=ELECTRON_RUN_AS_NODE
  # coreutils 9.12 in the 26.08 runtime quotes `env` output even into a pipe;
  # the bundled shell-env parses it as key=value and hands the quotes on to the
  # language server (broken D-Bus address, sign-in can't open a browser).
  - --env=QUOTING_STYLE=literal
  - --filesystem=home
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 antigravity-wrapper /app/bin/antigravity
      - install -Dm644 com.google.Antigravity.desktop /app/share/applications/com.google.Antigravity.desktop
      - install -Dm644 com.google.Antigravity.metainfo.xml /app/share/metainfo/com.google.Antigravity.metainfo.xml
      - install -Dm644 com.google.Antigravity.png /app/share/icons/hicolor/512x512/apps/com.google.Antigravity.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: Antigravity.tar.gz
        only-arches:
          - x86_64
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.28.0-6410674700681216/linux-x64/Antigravity.tar.gz
        sha256: 225b98a32b6c84f6f71a25562220866ca411f66bf2e8ea96fd5fd12943d18823
        size: 182647785
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: antigravity-wrapper
      - type: file
        path: com.google.Antigravity.desktop
      - type: file
        path: com.google.Antigravity.metainfo.xml
      - type: file
        path: com.google.Antigravity.png
