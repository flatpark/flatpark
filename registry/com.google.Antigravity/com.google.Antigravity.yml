id: com.google.Antigravity
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: antigravity
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --unset-env=ELECTRON_RUN_AS_NODE
  - --filesystem=home
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 antigravity-wrapper /app/bin/antigravity
      - install -Dm644 com.google.Antigravity.desktop /app/share/applications/com.google.Antigravity.desktop
      - install -Dm644 com.google.Antigravity.metainfo.xml /app/share/metainfo/com.google.Antigravity.metainfo.xml
      - install -Dm644 com.google.Antigravity.png /app/share/icons/hicolor/512x512/apps/com.google.Antigravity.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: Antigravity.tar.gz
        only-arches:
          - x86_64
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.18.1-4945794252537856/linux-x64/Antigravity.tar.gz
        sha256: 46b82fa34a32a39c498bd745aa6c8273881492eaea45b660ce489e776f743daf
        size: 179722582
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: antigravity-wrapper
      - type: file
        path: com.google.Antigravity.desktop
      - type: file
        path: com.google.Antigravity.metainfo.xml
      - type: file
        path: com.google.Antigravity.png
