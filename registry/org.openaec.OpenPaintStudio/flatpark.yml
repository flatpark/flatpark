id: org.openaec.OpenPaintStudio
name: Open Paint Studio
summary: Sketch, mark up and edit images, with shapes and text kept editable
website: https://open-aec.com/open-paint-studio/
source_url: https://github.com/OpenAEC-Foundation/open-paint-studio
build:
  manifest: org.openaec.OpenPaintStudio.yml
  branch: stable
  mode: extra-data
  arches: [x86_64]
catalog:
  category: Graphics
  upstream_approved: false
  tags:
    - Paint
    - ImageEditor
    - Drawing
    - Annotation
    - Vector
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
