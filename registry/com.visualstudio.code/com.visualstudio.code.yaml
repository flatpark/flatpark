app-id: com.visualstudio.code
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: code
tags: [proprietary]
separate-locales: false
finish-args:
  - --require-version=0.10.3
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=ssh-auth
  - --device=all
  - --allow=devel
  - --filesystem=host
  - --filesystem=xdg-run/gnupg:ro
  - --filesystem=xdg-config/kdeglobals:ro
  - --env=NPM_CONFIG_GLOBALCONFIG=/app/etc/npmrc
  - --env=LD_LIBRARY_PATH=/app/lib
  # required to fix cursor scaling on wayland
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.AppMenu.Registrar.*
add-extensions:
  com.visualstudio.code.tool:
    directory: tools
    subdirectories: true
    versions: stable;26.08
    add-ld-path: lib
    no-autodownload: true
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'
modules:
  - name: vscode
    buildsystem: simple
    build-commands:
      - install -D code.sh /app/bin/code
      - install -Dm644 vscode_64.png /app/share/icons/hicolor/64x64/apps/com.visualstudio.code.png
      - install -Dm644 vscode_128.png /app/share/icons/hicolor/128x128/apps/com.visualstudio.code.png
      - install -Dm644 vscode_256.png /app/share/icons/hicolor/256x256/apps/com.visualstudio.code.png
      - install -Dm644 vscode_512.png /app/share/icons/hicolor/512x512/apps/com.visualstudio.code.png
      - install -Dm644 com.visualstudio.code.metainfo.xml -t /app/share/metainfo
      - install -Dm644 com.visualstudio.code.desktop -t /app/share/applications
      - install -Dm644 com.visualstudio.code-url-handler.desktop -t /app/share/applications
      - install -Dm644 com.visualstudio.code-workspace.xml -t /app/share/mime/packages
      - install -Dm644 npmrc -t /app/etc
      - install -Dm644 flatpak-warning.txt -t /app/share/vscode
      - install -D apply_extra -t /app/bin
      - cp /usr/bin/ar /app/bin
      - ARCH_TRIPLE=$(gcc --print-multiarch) && cp /usr/lib/${ARCH_TRIPLE}/libbfd-*.so
        /app/lib
      - ARCH_TRIPLE=$(gcc --print-multiarch) && cp /usr/lib/${ARCH_TRIPLE}/libsframe*
        /app/lib
      - ARCH_TRIPLE=$(gcc --print-multiarch) && ln -s /usr/lib/${ARCH_TRIPLE}/libtinfo.so
        /app/lib/libtinfo.so.5
      - mkdir /app/tools
    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          - ar x code.deb
          - tar xf data.tar.xz
          - mv usr/share/code vscode
          - rm -r code.deb control.tar.* data.tar.xz debian-binary usr
      - type: file
        path: code.sh
      - type: file
        path: flatpak-warning.txt
      - type: file
        path: npmrc
      - type: file
        path: com.visualstudio.code.metainfo.xml
      - type: file
        path: com.visualstudio.code.desktop
      - type: file
        path: com.visualstudio.code-url-handler.desktop
      - type: file
        path: com.visualstudio.code-workspace.xml
      - type: file
        path: icons/vscode_64.png
      - type: file
        path: icons/vscode_128.png
      - type: file
        path: icons/vscode_256.png
      - type: file
        path: icons/vscode_512.png
      - type: extra-data
        filename: code.deb
        only-arches: [x86_64]
        url: https://update.code.visualstudio.com/1.143.1/linux-deb-x64/stable
        sha256: e459729dee13758960924be07157da44f0ba69503ab5edf4586fcde936bac9b9
        size: 243172986
        x-checker-data:
          type: json
          url: https://api.github.com/repos/microsoft/vscode/releases/latest
          version-query: .tag_name
          timestamp-query: .published_at
          url-query: '"https://update.code.visualstudio.com/" + $version + "/linux-deb-x64/stable"'
          is-main-source: true

      - type: extra-data
        filename: code.deb
        only-arches: [aarch64]
        url: https://update.code.visualstudio.com/1.143.1/linux-deb-arm64/stable
        sha256: b5163fe68935a3d11c954de08c2ca953532f1ba70204df1bc95e736c1eea31ff
        size: 227660978
        x-checker-data:
          type: json
          url: https://api.github.com/repos/microsoft/vscode/releases/latest
          version-query: .tag_name
          timestamp-query: .published_at
          url-query: '"https://update.code.visualstudio.com/" + $version + "/linux-deb-arm64/stable"'

  - name: kerberos
    subdir: src
    post-install:
      - install -Dm644 ../krb5.conf /app/etc/krb5.conf
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
        sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13
        x-checker-data:
          type: html
          url: https://kerberos.org/dist/
          version-pattern: Kerberos V5 Release ([\d.-]+) - current release
          url-template: https://kerberos.org/dist/krb5/$major.$minor/krb5-$version.tar.gz

      # glibc 2.43+ makes strchr() const-preserving (C23); drop once upstream releases it.
      # https://github.com/krb5/krb5/commit/ad4dcf1856dadc4b352b5c8ff08e51c7290fb41f
      - type: patch
        path: krb5-strchr-c23.patch

      - type: file
        path: krb5.conf

  - name: host-spawn
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        GOBIN: /app/bin
        GOFLAGS: -modcacherw
        GOPATH: /run/build/host-spawn
    sources:
      - type: git
        url: https://github.com/1player/host-spawn
        commit: d76c3a5196a8e0943f6a1c7c9f1acde4bd83c40c
        tag: v1.6.2
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      # The below dependencies need to be updated manually, avoid adding them to the external checker
      - dest: vendor
        path: modules.txt
        type: file
      - type: git
        dest: vendor/github.com/godbus/dbus/v5
        url: https://github.com/godbus/dbus.git
        commit: e523abc905595cf17fb0001a7d77eaaddfaa216d
        tag: v5.1.0
      - type: git
        dest: vendor/github.com/pkg/term
        url: https://github.com/pkg/term.git
        commit: d02e49dd31404f3c3cf4b5469b28942194e0ca23
        tag: v1.1.0
      - type: git
        dest: vendor/golang.org/x/sys
        url: https://go.googlesource.com/sys.git
        commit: 13b15b780d9013988b1fb0e79e30b2528a877638
        tag: v0.15.0
    build-commands:
      - go install -mod=vendor -ldflags "-X main.Version=$(git describe --tags)"
