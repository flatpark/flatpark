id: com.visualstudio.code
name: Visual Studio Code
summary: Code editing. Redefined.
website: https://code.visualstudio.com
source_url: https://github.com/microsoft/vscode
build:
  manifest: com.visualstudio.code.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: Development
  tags:
    - Editor
    - IDE
    - Microsoft
    - Electron
update:
  command: ./resolve-update.sh
policy:
  proprietary: true
  dangerous_permissions:
    # Projects open at their real host paths, so terminals, build output and
    # tool configs agree with the host.
    - --filesystem=host
    # Serial ports, USB debuggers and other devices extensions talk to.
    - --device=all
    # flatpark-spawn: commands VS Code, its terminal and its extensions run go
    # to the host when the host has them, outside the sandbox.
    - --talk-name=org.freedesktop.Flatpak

packaging:
  - kind: host-command
    detail:
      en: "Uses flatpark-spawn: commands VS Code, its integrated terminal and its extensions run (git, node, your mise or asdf toolchains, ~/.local/bin) run on your system when it has them, outside the sandbox with your user's access, as if VS Code were installed there. Turn it off with flatpak override --user --no-talk-name=org.freedesktop.Flatpak com.visualstudio.code."
      zh-Hans: "使用 flatpark-spawn：VS Code、集成终端和扩展运行的命令（git、node、mise 或 asdf 工具链、~/.local/bin），只要你的系统上有，就在系统上运行，在沙箱之外、拥有你这个用户的权限，就像 VS Code 直接装在系统上一样。可以用 flatpak override --user --no-talk-name=org.freedesktop.Flatpak com.visualstudio.code 关闭。"
  - kind: seeded-config
    detail:
      en: "The launcher opens a note about the sandbox on first start, reads extra Electron flags from code-flags.conf, keeps extensions in the app's data directory, points TMPDIR at the per-app runtime directory, and links the host's /etc/shells into the sandbox so the terminal finds host shells."
      zh-Hans: "启动器在首次运行时打开一份沙箱说明，从 code-flags.conf 读取额外的 Electron 参数，把扩展放在应用的数据目录中，将 TMPDIR 指向应用专属的运行时目录，并把宿主机的 /etc/shells 链接进沙箱，使终端能找到宿主机的 shell。"
