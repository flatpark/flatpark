id: app.mymusik.MyMusik
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: mymusik
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # The bundled Qt has the X11 platform plugin.
  - --share=ipc
  - --socket=x11
  - --device=dri
  # Music playback and local library access.
  - --socket=pulseaudio
  - --filesystem=xdg-music
  # Cloud services and optional device synchronization.
  - --share=network
  # Tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Credentials and desktop playback controls.
  - --talk-name=org.freedesktop.secrets
  - --own-name=org.mpris.MediaPlayer2.mymusik
  - --own-name=org.mpris.MediaPlayer2.mymusik.*
modules:
  - name: mymusik
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 mymusik-wrapper /app/bin/mymusik
      - install -Dm644 app.mymusik.MyMusik.desktop /app/share/applications/app.mymusik.MyMusik.desktop
      - install -Dm644 app.mymusik.MyMusik.metainfo.xml /app/share/metainfo/app.mymusik.MyMusik.metainfo.xml
      - install -Dm644 app.mymusik.MyMusik.png /app/share/icons/hicolor/512x512/apps/app.mymusik.MyMusik.png
    sources:
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches: [x86_64]
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: MyMusik.AppImage
        only-arches:
          - x86_64
        url: https://shaggai.net/linux/client/MyMusik.AppImage
        sha256: d07fbd3880e8c3ff3944d1efd65953b35c4495d92f28ffa7785c7e72ae85d2e5
        size: 211896824
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: mymusik-wrapper
      - type: file
        path: app.mymusik.MyMusik.desktop
      - type: file
        path: app.mymusik.MyMusik.metainfo.xml
      - type: file
        path: app.mymusik.MyMusik.png
