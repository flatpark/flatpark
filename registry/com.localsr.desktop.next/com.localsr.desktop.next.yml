id: com.localsr.desktop.next
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: localsr
separate-locales: false
build-options:
  no-debuginfo: true
# Tauri app with a Python/PyTorch worker. The AppImage bundles WebKitGTK 4.1
# and GTK 3, and its AppRun puts the bundle's libraries first; the worker in
# usr/lib/LocalSR/engine carries its own Python. This is the CPU build.
# The id is the app's Tauri identifier, which upstream kept when the
# "Next Preview" name was dropped.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU rendering for the WebKit view.
  - --device=dri
  # Model downloads from GitHub and Hugging Face, and the update check.
  - --share=network
  # Results are saved to the Desktop folder until another output folder is
  # picked in the app (through the file chooser, which needs no grant).
  # Without this grant they land in the sandbox's own home and are lost.
  # Photos and videos are opened through the file chooser or "Open With".
  - --filesystem=xdg-desktop
modules:
  - name: localsr
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 localsr-wrapper /app/bin/localsr
      - install -Dm644 com.localsr.desktop.next.desktop /app/share/applications/com.localsr.desktop.next.desktop
      - install -Dm644 com.localsr.desktop.next.metainfo.xml /app/share/metainfo/com.localsr.desktop.next.metainfo.xml
      - install -Dm644 com.localsr.desktop.next.png /app/share/icons/hicolor/512x512/apps/com.localsr.desktop.next.png
    sources:
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v3/appimage-tools-appimage-tools-v3-fd-26.08-x86_64.tar.xz
        sha256: 2ad7847e871c2f7f24506ecf202ea971ab684aaa457e2f6a594f6bfac96f1297
        size: 57508
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: localsr.AppImage
        only-arches:
          - x86_64
        url: https://github.com/HerRei/local-upscale/releases/download/v0.6.3-beta/LocalSR-v0.6.3-beta-Linux-CPU-x86_64.AppImage
        sha256: aa061481721cda434ccab7861a19ad545da168be15c5acb0e5094ee9c92ca7ab
        size: 571804152
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: localsr-wrapper
      - type: file
        path: com.localsr.desktop.next.desktop
      - type: file
        path: com.localsr.desktop.next.metainfo.xml
      - type: file
        path: com.localsr.desktop.next.png
