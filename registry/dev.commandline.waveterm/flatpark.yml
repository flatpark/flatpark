id: dev.commandline.waveterm
name: Wave Terminal
summary: Terminal with inline graphics, file previews and remote connections
website: https://waveterm.dev
source_url: https://github.com/wavetermdev/waveterm
build:
  manifest: dev.commandline.waveterm.yml
  branch: stable
  mode: extra-data
catalog:
  category: System
  upstream_approved: false
  tags:
    - Terminal
    - SSH
    - Remote
    - Developer
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []

# What this package does around the vendor's build; shown on the site as the
# packaging level. See docs/packaging-playbook.md (golden rule 1).
packaging:
  - kind: seeded-config
    detail:
      en: "On first launch, turns off Wave's auto-update; Flatpak delivers updates instead."
      zh-Hans: "首次启动时关闭 Wave 的自动更新，改由 Flatpak 负责更新。"
