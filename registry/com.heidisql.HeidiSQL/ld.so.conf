# Extra-data library directories, added to the loader's search path so they
# appear in /etc/ld.so.cache. The runtime's /etc/ld.so.conf includes this file,
# and Flatpak regenerates the cache at launch, after extra-data is unpacked.
#
# HeidiSQL's driver picker lists the client libraries by parsing the output of
# `/sbin/ldconfig -p`, so a library that is only on LD_LIBRARY_PATH stays
# invisible to it. The wrapper sets LD_LIBRARY_PATH as well, which is what the
# payload's own DT_NEEDED lookup of libQt6Pas.so.6 resolves through.
/app/extra/sql-clients/lib
/app/extra/qt6pas/lib
