id: ai.l0ng.openidea
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: openidea
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # GTK/WebKit display and GPU rendering.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Git remotes, SDK/language-server downloads, databases and HTTP clients.
  - --share=network
  # Project trees require directory access, including sibling source files.
  - --filesystem=xdg-documents
  # Native debuggers need ptrace to launch and inspect sandboxed targets.
  - --allow=devel
  # Tauri focuses the existing instance on a second launch.
  - --own-name=ai.l0ng.openidea.SingleInstance
modules:
  - name: openidea
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 openidea-wrapper /app/bin/openidea
      - install -Dm755 git-wrapper /app/bin/git
      - ln -s /app/extra/support/uv /app/bin/uv
      - install -Dm644 ai.l0ng.openidea.desktop /app/share/applications/ai.l0ng.openidea.desktop
      - install -Dm644 ai.l0ng.openidea.metainfo.xml /app/share/metainfo/ai.l0ng.openidea.metainfo.xml
      - install -Dm644 ai.l0ng.openidea.png /app/share/icons/hicolor/256x256/apps/ai.l0ng.openidea.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: openidea.deb
        only-arches:
          - x86_64
        url: https://github.com/l0ng-ai/openidea/releases/download/v0.1.43/OpenIDEA_0.1.43_amd64.deb
        sha256: d15a579b4e01b71a98e8d3fa29a90e90b4a9ed37158429854140f0368eaedfc4
        size: 75257340
      - type: extra-data
