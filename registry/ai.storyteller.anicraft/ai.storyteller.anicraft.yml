id: ai.storyteller.anicraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: anicraft
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Window display, X11 shared memory and GPU rendering.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Sound playback.
  - --socket=pulseaudio
  # Paths for documents, imported images and exported video.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
modules:
  - name: anicraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 anicraft-wrapper /app/bin/anicraft
      - install -Dm755 anicraft-cli-wrapper /app/bin/anicraft-cli
      - install -Dm644 ai.storyteller.anicraft.desktop /app/share/applications/ai.storyteller.anicraft.desktop
      - install -Dm644 ai.storyteller.anicraft.metainfo.xml /app/share/metainfo/ai.storyteller.anicraft.metainfo.xml
      - install -Dm644 ai.storyteller.anicraft.mime.xml /app/share/mime/packages/ai.storyteller.anicraft.xml
      - install -Dm644 ai.storyteller.anicraft.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.anicraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: anicraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/anicraft/releases/download/v0.3.0/anicraft-0.3.0-linux-x86_64.tar.gz
        sha256: c83b78c1293bf37920aefe8bdca4443cf1d53fec450499872fc7fe5243eb114d
        size: 35773176
      - type: extra-data
        filename: anicraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/storytold/anicraft/releases/download/v0.3.0/anicraft-0.3.0-linux-aarch64.tar.gz
        sha256: 3244bd8b26ffd96602559524a9f3a068777a0f421ce870d5c57dd578a6d30e82
        size: 33669950
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: anicraft-wrapper
      - type: file
        path: anicraft-cli-wrapper
      - type: file
        path: ai.storyteller.anicraft.desktop
      - type: file
        path: ai.storyteller.anicraft.metainfo.xml
      - type: file
        path: ai.storyteller.anicraft.mime.xml
      - type: file
        path: ai.storyteller.anicraft.png
