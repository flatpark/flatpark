id: com.motrix.next
name: MotrixNext
summary: Download manager for HTTP, FTP, BitTorrent, Magnet and ED2K links
website: https://rayburst.pages.dev
source_url: https://github.com/AnInsomniacy/rayburst
build:
  manifest: com.motrix.next.yml
  branch: stable
  mode: extra-data
catalog:
  category: Network
  upstream_approved: true
  tags:
    - Download
    - FileTransfer
    - BitTorrent
    - aria2
    - Tauri
    # Upstream renamed the project to Rayburst in v4.0.0-beta.1. The stable line
    # this package tracks is still MotrixNext (see resolve-update.sh), so the
    # name stays for now and this tag is what makes it findable by the new one.
    - Rayburst
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []
