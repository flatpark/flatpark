id: com.motrix.next
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: motrix-next
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Tauri v2 / WebKitGTK front end driving a bundled aria2-derived engine.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # dri for hardware-accelerated WebKit rendering. The app has its own GPU guard
  # that falls back to software compositing when it cannot get hardware paths.
  - --device=dri
  # The downloads themselves, plus the engine's BitTorrent/DHT/ED2K traffic and
  # its local RPC listener.
  - --share=network
  # Default destination. Flatpak maps xdg-download into the sandbox, so the app's
  # default save folder resolves to the real Downloads directory. Any other
  # location is granted per-folder through the file chooser portal, or by the
  # user with `flatpak override --filesystem=...` (documented in the metainfo).
  - --filesystem=xdg-download
  # Download-complete notifications and the tray icon.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
  # "Open containing folder" on a finished task calls
  # org.freedesktop.FileManager1.ShowItems, which is the host's file manager and
  # not a portal, so the session bus proxy hides it without this grant and the
  # menu entry does nothing at all (verified: the call returns ServiceUnknown).
  - --talk-name=org.freedesktop.FileManager1
  # No --own-name is needed for the tray. The libayatana-appindicator build this
  # app links registers its item with the watcher under its own unique connection
  # name (":1.545/org/ayatana/NotificationItem/tray_icon_tray_app_motrix_next" in
  # a live session) rather than claiming a well-known
  # org.kde.StatusNotifierItem-<pid>-<n>, so there is no name to grant and none of
  # the PID-2 contention that the older bus-name path suffers from. Verified
  # against the watcher's RegisteredStatusNotifierItems with no grant in place.
  # tauri-plugin-single-instance's own well-known name sits under the app id, so
  # Flatpak already lets the app own it; it needs no grant of its own.
modules:
  # The Tauri tray-icon dlopen-s libayatana-appindicator at startup and PANICS if
  # it is missing — and the GNOME runtime does not ship it, so the app cannot
  # even start without it.
  # Prebuilt ayatana tray stack (libdbusmenu, ayatana-ido, libayatana-indicator,
  # libayatana-appindicator) from https://github.com/flatpark/prebuilt, built
  # against org.gnome.Sdk//50; the tag's manifest records the exact sources,
  # pins and patches. One pinned archive instead of five source builds per app,
  # and no launchpad.net downloads at build time.
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v1/ayatana-stack-ayatana-v1-gnome-50-x86_64.tar.xz
        sha256: 37a91a0840b06da5319c36275fad2b1dca906152553f295944b81f202d1476fc
  - name: motrix-next
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 motrix-next-wrapper /app/bin/motrix-next
      - install -Dm644 com.motrix.next.desktop /app/share/applications/com.motrix.next.desktop
      - install -Dm644 com.motrix.next.metainfo.xml /app/share/metainfo/com.motrix.next.metainfo.xml
      - install -Dm644 com.motrix.next.png /app/share/icons/hicolor/512x512/apps/com.motrix.next.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: motrix-next.deb
        only-arches:
          - x86_64
        url: https://github.com/AnInsomniacy/motrix-next/releases/download/v3.9.8/MotrixNext_3.9.8_amd64.deb
        sha256: e7e8f5dea95b870894420edfa3b65aa38abeed27703e0dea4297294e2aa8f860
        size: 29945916
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: motrix-next-wrapper
      - type: file
        path: com.motrix.next.desktop
      - type: file
        path: com.motrix.next.metainfo.xml
      - type: file
        path: com.motrix.next.png
