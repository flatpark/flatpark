id: ai.storyteller.printcraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: printcraft
separate-locales: false
build-options:
  no-debuginfo: true
# The app id and finish-args follow upstream's own Flatpak manifest
# (packaging/linux/flatpak/ in storytold/printcraft), so this package and the
# single-file bundle upstream builds are the same application. The runtime is
# 26.08, shared with PhotoCraft; the binaries need only glibc from it.
finish-args:
  # Native Rust/egui app on winit; libwayland, libX11/xcb, xkbcommon and the
  # Vulkan/EGL loaders are dlopen()ed from the runtime.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu GPU compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save go through the file-chooser portal. Pictures is granted so
  # files passed by path from the command line keep working.
  - --filesystem=xdg-pictures
  # Deliberately not granted:
  #   --share=network          -> the optional --control automation server
  #                               listens on 127.0.0.1 inside the sandbox; the
  #                               metainfo documents the override that exposes it
  #   --filesystem=home / host -> everything else goes through the portals
modules:
  - name: printcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 printcraft-wrapper /app/bin/printcraft
      - install -Dm755 printcraft-cli-wrapper /app/bin/printcraft-cli
      - install -Dm644 ai.storyteller.printcraft.desktop /app/share/applications/ai.storyteller.printcraft.desktop
      - install -Dm644 ai.storyteller.printcraft.metainfo.xml /app/share/metainfo/ai.storyteller.printcraft.metainfo.xml
      - install -Dm644 ai.storyteller.printcraft.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.printcraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: printcraft-x86_64.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/printcraft/releases/download/v0.2.1/printcraft-0.2.1-linux-x86_64.tar.gz
        sha256: 73b2977330d73716971237f68f89cba6ad52cbfb563ad0ab6d9ad18f44d45192
        size: 43955702
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: printcraft-wrapper
      - type: file
        path: printcraft-cli-wrapper
      - type: file
        path: ai.storyteller.printcraft.desktop
      - type: file
        path: ai.storyteller.printcraft.metainfo.xml
      - type: file
        path: ai.storyteller.printcraft.png
