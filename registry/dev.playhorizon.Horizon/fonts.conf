<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The Horizon launcher is a GPUI application and draws its text with
  cosmic-text/fontdb, which builds its font database from a fontconfig file it
  parses itself: FONTCONFIG_FILE, else $XDG_CONFIG_HOME/fontconfig/fonts.conf,
  else /etc/fonts/fonts.conf. Its parser reads only the <dir> elements of that
  one file, so the runtime's configuration - which reaches the host's fonts
  through conf.d/50-flatpak.conf and a <remap-dir> - shows it nothing but the
  runtime's own fonts, and scripts those don't cover (CJK among them) come out
  as boxes. Listing every directory here makes the host's fonts reachable.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- The runtime's own fonts. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>

  <!-- The host's fonts, as Flatpak mounts them into every sandbox. -->
  <dir>/run/host/fonts</dir>
  <dir>/run/host/local-fonts</dir>
  <dir>/run/host/user-fonts</dir>

  <!-- The user's own fonts inside the sandbox. -->
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
</fontconfig>
