id: com.esearch.app
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
# The Electron base supplies zypak for Chromium's child process sandbox.
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: esearch
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # X11 display/capture and accelerated rendering; native Wayland is unsupported.
  - --share=ipc
  - --socket=x11
  - --device=dri
  # Online search, translation, and optional model downloads.
  - --share=network
  # Screen-recording audio and playback previews.
  - --socket=pulseaudio
  # Upstream's default screenshot and recording output directories.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  # Tray menu and notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: esearch
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 esearch-wrapper /app/bin/esearch
      - install -Dm644 com.esearch.app.desktop /app/share/applications/com.esearch.app.desktop
      - install -Dm644 com.esearch.app.metainfo.xml /app/share/metainfo/com.esearch.app.metainfo.xml
      - install -Dm644 com.esearch.app.png /app/share/icons/hicolor/512x512/apps/com.esearch.app.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: esearch.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-linux-x64.tar.gz
        sha256: 9d5becc2af040258925079abdf2bf9707fceb8859a758d49f11c0375614db314
        size: 372563357
      - type: extra-data
        filename: esearch.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-linux-arm64.tar.gz
        sha256: 8840274d195725f4cac7418e9311b86b35872e1aed15fe65fd7c518251efd666
        size: 166678147
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: esearch-wrapper
      - type: file
        path: com.esearch.app.desktop
      - type: file
        path: com.esearch.app.metainfo.xml
      - type: file
        path: com.esearch.app.png
