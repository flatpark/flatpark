id: com.esearch.app
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
# The Electron base supplies zypak for Chromium's child process sandbox.
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: esearch
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # X11 display/capture and accelerated rendering; native Wayland is unsupported.
  - --share=ipc
  - --socket=x11
  - --device=dri
  # Online search, translation, and optional model downloads.
  - --share=network
  # Screen-recording audio and playback previews.
  - --socket=pulseaudio
  # Upstream's default screenshot and recording output directories.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  # Tray menu and notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Keep IDE environment flags out of Electron's child processes as well.
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: esearch
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 esearch-wrapper /app/bin/esearch
      - install -Dm644 com.esearch.app.desktop /app/share/applications/com.esearch.app.desktop
      - install -Dm644 com.esearch.app.metainfo.xml /app/share/metainfo/com.esearch.app.metainfo.xml
      - install -Dm644 com.esearch.app.png /app/share/icons/hicolor/512x512/apps/com.esearch.app.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: esearch.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/xushengfeng/eSearch/releases/download/15.7.1/eSearch-15.7.1-linux-x64.tar.gz
        sha256: 5cc1901695304fde4323341d2747f385a7793cb08d89bf4678b64835bb663cf8
        size: 371311563
      - type: extra-data
        filename: esearch.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/xushengfeng/eSearch/releases/download/15.7.1/eSearch-15.7.1-linux-arm64.tar.gz
        sha256: 37f4d047671af631e2b22a3ce02b3af7fbd93e5211051998948b1fad2c8a1ab2
        size: 165428649
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: esearch-wrapper
      - type: file
        path: com.esearch.app.desktop
      - type: file
        path: com.esearch.app.metainfo.xml
      - type: file
        path: com.esearch.app.png
