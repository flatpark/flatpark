id: ai.unsloth.studio
name: Unsloth Studio
summary: Run and train local language and diffusion models
website: https://unsloth.ai/
source_url: https://github.com/unslothai/unsloth
build:
  manifest: ai.unsloth.studio.yml
  branch: stable
  mode: extra-data
  arches: [x86_64]
catalog:
  category: AI
  tags: [AI, LLM, Training, Diffusion]
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions:
    # Model inference and training read GPU device nodes, including /dev/kfd
    # on AMD and /dev/nvidia* on NVIDIA. CPU-only users can remove the grant.
    - --device=all
