# FlatPark catalog descriptor for bawkseek.
#
# FlatPark (https://flatpark.org/) is a signed Flatpak remote that repackages
# official vendor downloads as extra-data - it does not build from source. This
# file is the catalog entry; io.github.juddisjudd.bawkseek.yml is the Flatpak
# manifest it points at.
#
# read-descriptor.mjs in flatpark/flatpark is a line scanner, not a YAML parser,
# so keep the plain two-space block style below exactly as it is.
id: io.github.juddisjudd.bawkseek
name: bawkseek
summary: Soulseek client and audio player
website: https://github.com/juddisjudd/bawkseek
source_url: https://github.com/juddisjudd/bawkseek
build:
  manifest: io.github.juddisjudd.bawkseek.yml
  branch: stable
  mode: extra-data
catalog:
  category: Network
  upstream_approved: false
  tags:
    - Soulseek
    - Music
    - Audio
    - P2P
    - GPUI
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
