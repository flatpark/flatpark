id: com.abdownloadmanager.AbDownloadManager
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: abdm
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Compose Desktop (Skia over OpenGL/X11) plus a bundled JRE/AWT. The app and
  # its JRE are self-contained; only X11, libGL, fontconfig and libstdc++ are
  # resolved from the runtime. skiko's Linux backend is X11/GLX only (no
  # libwayland), so X11 is required — and --socket=x11 (not fallback-x11) is
  # used deliberately: on Wayland hosts it runs through XWayland, while
  # fallback-x11 would withhold X11 there and leave the app headless.
  - --share=ipc
  # Network for the downloads themselves, and so the browser-integration
  # extension can reach the app's local listener over the shared loopback.
  - --share=network
  - --socket=x11
  - --device=dri
  # Download-complete desktop notifications and the system-tray icon.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # The tray backend claims org.kde.StatusNotifierItem-<pid>-1 and does not
  # retry when that name is taken. abdm-wrapper pins the reported PID to 424242
  # (see the fake-getpid module) so this single name is all it ever needs;
  # without the pin every sandboxed tray app competes for the PID-2 name.
  - --own-name=org.kde.StatusNotifierItem-424242-1
  # Default download location: Flatpak maps xdg-download into the sandbox and
  # generates a matching user-dirs.dirs, so the app's ~/Downloads/ABDM tree
  # resolves to the real Downloads folder. Custom download directories outside
  # it must be granted by the user (flatpak override --filesystem=...).
  - --filesystem=xdg-download
  # ABDM stores its settings, download database and single-instance lock in
  # ~/.abdm (built from the user.home JVM property). Flatpak does not redirect
  # $HOME — it only redirects the XDG dirs — so without this grant the whole
  # directory lands in the sandbox tmpfs: settings and download history are lost
  # on exit, and a second launch cannot see the first instance's lock, so it
  # starts a duplicate app that fails to bind the browser-integration port and
  # reports "Can't run browser integration". Real-home :create (not --persist)
  # so the dir is user-accessible and shared with an existing native install.
  - --filesystem=~/.abdm:create
modules:
  - name: abdm-fakepid
    buildsystem: simple
    build-commands:
      - cc -shared -fPIC -O2 fake-getpid.c -o libfakepid.so -ldl
      - install -Dm755 libfakepid.so /app/lib/abdm/libfakepid.so
    sources:
      - type: file
        path: fake-getpid.c

  - name: ab-download-manager
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 abdm-wrapper /app/bin/abdm
      - install -Dm644 com.abdownloadmanager.AbDownloadManager.desktop /app/share/applications/com.abdownloadmanager.AbDownloadManager.desktop
      - install -Dm644 com.abdownloadmanager.AbDownloadManager.metainfo.xml /app/share/metainfo/com.abdownloadmanager.AbDownloadManager.metainfo.xml
      - install -Dm644 com.abdownloadmanager.AbDownloadManager.png /app/share/icons/hicolor/512x512/apps/com.abdownloadmanager.AbDownloadManager.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: abdm.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/amir1376/ab-download-manager/releases/download/v1.10.2/ABDownloadManager_1.10.2_linux_x64.tar.gz
        sha256: c61c039ec426df00b5f3cfcfd07b64ec62a0c35c78becbc562d4600d5a5ea9c4
        size: 98933963
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: abdm-wrapper
      - type: file
        path: com.abdownloadmanager.AbDownloadManager.desktop
      - type: file
        path: com.abdownloadmanager.AbDownloadManager.metainfo.xml
      - type: file
        path: com.abdownloadmanager.AbDownloadManager.png
