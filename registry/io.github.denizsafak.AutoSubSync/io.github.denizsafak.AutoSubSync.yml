id: io.github.denizsafak.AutoSubSync
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: autosubsync
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # PyInstaller bundle of a PyQt6 (Qt 6) app. It carries its own Qt with both
  # the Wayland and xcb platform plugins and the xdg-desktop-portal platform
  # theme, so file dialogs go through the portal.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Qt 6 picks Wayland when it is there and falls back to xcb on its own; a
  # QT_QPA_PLATFORM=wayland leaked from the host session would take that
  # fallback away, so the choice is left to Qt.
  - --unset-env=QT_QPA_PLATFORM
  - --device=dri
  # By default the synced subtitle is saved next to the input subtitle, with
  # no dialog, so the folders subtitles usually live in (next to the videos,
  # or where they were downloaded) are granted read-write. The metainfo
  # documents --filesystem=home as the override for working elsewhere.
  - --filesystem=xdg-videos
  - --filesystem=xdg-download
  # No network: the sync engines, ffmpeg and models are all in the bundle.
  # The only network use is the optional "check for updates" notice, which
  # fails silently at startup without it.
modules:
  - name: autosubsync
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 autosubsync-wrapper /app/bin/autosubsync
      - install -Dm644 io.github.denizsafak.AutoSubSync.desktop /app/share/applications/io.github.denizsafak.AutoSubSync.desktop
      - install -Dm644 io.github.denizsafak.AutoSubSync.metainfo.xml /app/share/metainfo/io.github.denizsafak.AutoSubSync.metainfo.xml
      - install -Dm644 io.github.denizsafak.AutoSubSync.png /app/share/icons/hicolor/256x256/apps/io.github.denizsafak.AutoSubSync.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: autosubsync.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/denizsafak/AutoSubSync/releases/download/v6.6/AutoSubSync-linux-amd64.tar.gz
        sha256: 3f47a4753422dc35f37b428a28bbbcde24fa97985d192e8bc7c6aff773d60a3d
        size: 178785537
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: autosubsync-wrapper
      - type: file
        path: io.github.denizsafak.AutoSubSync.desktop
      - type: file
        path: io.github.denizsafak.AutoSubSync.metainfo.xml
      - type: file
        path: io.github.denizsafak.AutoSubSync.png
