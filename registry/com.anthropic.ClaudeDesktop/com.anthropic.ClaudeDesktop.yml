id: com.anthropic.ClaudeDesktop
# Sdk, not Platform: Code shows diffs and works on repositories through git,
# which the Platform lacks; the Sdk ships it (with ssh, python3, make and
# compilers) inside the sandbox (flatpark#1523).
runtime: org.freedesktop.Sdk
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
# Electron app: use the Electron base app, which ships zypak. zypak redirects
# Chromium's SUID sandbox onto the Flatpak sandbox so the app keeps an internal
# sandbox (the wrapper runs it via zypak-wrapper) instead of --no-sandbox. The
# base is a prebuilt ref merged into the app at build time; the official
# upstream application tree is fetched as extra-data and left unmodified.
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: claude-desktop
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Electron desktop app for Claude. The official Debian package bundles the
  # Chromium/Electron application tree; the GTK3, NSS, ATK, DRM/GBM and X11
  # stacks it links come from the Freedesktop runtime.
  - --share=ipc
  # Claude account sign-in, chat, sync and desktop services.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # Chromium compositing and live previews.
  - --device=dri
  # Audio output for media embedded in conversations or previews.
  - --socket=pulseaudio
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # Tray icon. The bundled Electron registers it under the connection's unique
  # name, so it owns no StatusNotifierItem name and needs only the watcher.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Encrypt stored login credentials with the session keyring when present.
  - --talk-name=org.freedesktop.secrets
  # git identity and settings for the Sdk's git. Read-only: `git config
  # --global` writes by rename, which a bind-mounted single file can't take
  # (EBUSY), and the sandbox shouldn't rewrite host config anyway.
  - --filesystem=~/.gitconfig:ro
  - --filesystem=xdg-config/git:ro
  # git over SSH (push, fetch, submodules) with the host's agent.
  - --socket=ssh-auth
  # Strip a leaked ELECTRON_RUN_AS_NODE from the sandbox env so the binary — and
  # zypak's spawned child/zygote processes, which the wrapper's own `unset`
  # can't reach — always start as the GUI app rather than as plain Node.
  - --unset-env=ELECTRON_RUN_AS_NODE
  # Deliberately not granted by default:
  #   --filesystem=home            -> broad project/workspace access for Code
  #   --device=all, --filesystem=host-os:ro and
  #   --talk-name=org.freedesktop.Flatpak -> Cowork, an opt-in through
  #   `flatpak override` (COWORK.md); the wrapper only loads cowork-shim.so
  #   when all three are present.
  # The core desktop app starts with its data under Flatpak's redirected HOME.
modules:
  # Cowork opt-in (COWORK.md): an LD_PRELOAD library and the script that runs
  # the app's own cowork-linux-helper on the host. Unused without the overrides.
  - name: cowork
    buildsystem: simple
    build-commands:
      - cc -shared -fPIC -O2 -Wall cowork-shim.c -o cowork-shim.so -ldl
      - install -Dm755 cowork-shim.so /app/lib/cowork-shim.so
      - install -Dm755 cowork-host-helper /app/bin/cowork-host-helper
    sources:
      - type: file
        path: cowork-shim.c
      - type: file
        path: cowork-host-helper

  - name: claude-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 claude-desktop-wrapper /app/bin/claude-desktop
      - install -Dm644 com.anthropic.ClaudeDesktop.desktop /app/share/applications/com.anthropic.ClaudeDesktop.desktop
      - install -Dm644 com.anthropic.ClaudeDesktop.metainfo.xml /app/share/metainfo/com.anthropic.ClaudeDesktop.metainfo.xml
      - install -Dm644 com.anthropic.ClaudeDesktop.png /app/share/icons/hicolor/256x256/apps/com.anthropic.ClaudeDesktop.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: claude-desktop-amd64.deb
        only-arches:
          - x86_64
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_6.28899.6_amd64.deb
        sha256: 7e381601d86570149643d52e9b89c26575ab12fa788aa41ffdd4cca5b0638cf8
        size: 191718584
      - type: extra-data
        filename: claude-desktop-arm64.deb
        only-arches:
          - aarch64
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_6.28899.6_arm64.deb
        sha256: 239c20d218456cacc656d48382fd59116325ac679aa4e476377af1456ac85715
        size: 184303444
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: claude-desktop-wrapper
      - type: file
        path: com.anthropic.ClaudeDesktop.desktop
      - type: file
        path: com.anthropic.ClaudeDesktop.metainfo.xml
      - type: file
        path: com.anthropic.ClaudeDesktop.png
