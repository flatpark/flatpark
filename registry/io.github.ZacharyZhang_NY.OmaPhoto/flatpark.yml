# FlatPark catalog descriptor for OmaPhoto.
#
# The app id is upstream's own: the AppImage's desktop file, icon and MIME data
# are named io.github.ZacharyZhang_NY.OmaPhoto, and the app sets it as its
# desktop file name.
#
# read-descriptor.mjs is a line scanner, not a YAML parser; keep the plain
# two-space block style below.
id: io.github.ZacharyZhang_NY.OmaPhoto
name: OmaPhoto
summary: Layered image editor, a Linux port of Compositor
website: https://zacharyzhang.com/omaphoto
source_url: https://github.com/ELY-Open-Source/OmaPhoto
build:
  manifest: io.github.ZacharyZhang_NY.OmaPhoto.yml
  branch: stable
  mode: extra-data
catalog:
  category: Graphics
  tags:
    - ImageEditor
    - Layers
    - PSD
    - RAW
    - Omarchy
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
