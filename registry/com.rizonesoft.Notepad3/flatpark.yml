# FlatPark catalog descriptor for Notepad3.
#
# FlatPark (https://flatpark.org/) is a signed Flatpak remote that repackages
# official vendor downloads as extra-data - it does not build from source. This
# file is the catalog entry; com.rizonesoft.Notepad3.yml is the Flatpak manifest
# it points at.
#
# read-descriptor.mjs in flatpark/flatpark is a line scanner, not a YAML parser,
# so keep the plain two-space block style below exactly as it is.
id: com.rizonesoft.Notepad3
name: Notepad3
summary: Fast and light-weight Scintilla-based text editor with syntax highlighting
website: https://rizonesoft.com
source_url: https://github.com/rizonesoft/Notepad3
build:
  manifest: com.rizonesoft.Notepad3.yml
  branch: stable
  mode: extra-data
catalog:
  category: Utility
  tags:
    - Text Editor
    - Notepad
    - Syntax Highlighting
    - Wine
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions:
    - --filesystem=home
