id: org.agentseal.CodeBurn
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
# Electron app: use the Electron base app, which ships zypak. zypak redirects
# Chromium's SUID sandbox onto the Flatpak sandbox, so the app keeps an internal
# sandbox (the wrapper runs it via zypak-wrapper) instead of --no-sandbox. The
# base is a prebuilt ref merged into the app at build time; the app stays
# self-contained.
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: codeburn
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Electron (Chromium) dashboard. The prebuilt build bundles Chromium, its own
  # ffmpeg/ANGLE/SwiftShader/Vulkan and the version-matched CodeBurn CLI; the
  # GTK3, NSS, CUPS, ATK/AT-SPI, ALSA, dbus, gbm, udev and X11 stacks it links
  # come from org.freedesktop.Platform 25.08 — checked against the binary's
  # NEEDED set, 0 missing.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU-accelerated Chromium compositing.
  - --device=dri
  # Model prices are fetched from LiteLLM and exchange rates from Frankfurter,
  # both cached locally for 24 hours; the optional multi-device view pairs with
  # your other machines over the local network. Session data itself is only ever
  # read from disk.
  - --share=network
  # Strip a leaked ELECTRON_RUN_AS_NODE from the sandbox env so the binary — and
  # zypak's spawned child/zygote processes, which the wrapper's own `unset`
  # can't reach — always start as the GUI app rather than as plain Node. The app
  # sets the variable itself, deliberately, on the child it spawns to run its
  # own bundled CLI; that assignment is unaffected.
  - --unset-env=ELECTRON_RUN_AS_NODE
  # CodeBurn's own settings (currency, model aliases, price overrides) live in
  # $HOME/.config/codeburn, built from $HOME directly rather than read from
  # XDG_CONFIG_HOME, so the XDG redirect does not reach them and $HOME here is a
  # tmpfs. Granting the app its own directory keeps those settings across
  # restarts, and shares them with a codeburn CLI installed on the host.
  - --filesystem=~/.config/codeburn:create
  # What the app is for: it reads the session logs each AI coding tool already
  # writes under $HOME and prices them. Every grant below is one tool's data
  # directory, read-only, and the app resolves them from $HOME literally — so
  # the sandbox path has to be the host path. Tools not listed here simply
  # report no sessions; the metainfo carries the `flatpak override` line for
  # adding one, and upstream's provider table names the directory each uses.
  - --filesystem=~/.claude:ro
  - --filesystem=~/.codex:ro
  - --filesystem=~/.gemini:ro
  - --filesystem=~/.copilot:ro
  - --filesystem=~/.config/github-copilot:ro
  - --filesystem=~/.cursor:ro
  - --filesystem=~/.config/Cursor/User/globalStorage:ro
  # VS Code / VSCodium global storage: Cline, Roo Code, Kilo Code and GitHub
  # Copilot Chat keep their transcripts there.
  - --filesystem=~/.config/Code/User/globalStorage:ro
  - --filesystem=~/.config/VSCodium/User/globalStorage:ro
  - --filesystem=~/.cline:ro
  - --filesystem=~/.local/share/zed:ro
  # OpenCode resolves its store through XDG_DATA_HOME, which Flatpak points
  # inside the sandbox; the wrapper sets OPENCODE_DATA_DIR — OpenCode's own knob
  # — back at this directory so the grant is actually reached.
  - --filesystem=~/.local/share/opencode:ro
  - --filesystem=~/.openclaw:ro
  - --filesystem=~/.qwen:ro
  - --filesystem=~/.forge:ro
  - --filesystem=~/.pi:ro
  - --filesystem=~/.omp:ro
  # No write access to any of those directories, and no host command access:
  # the CLI that does the parsing is the one bundled in the upstream build and
  # runs inside the sandbox.
modules:
  - name: codeburn
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 codeburn-wrapper /app/bin/codeburn
      - install -Dm644 org.agentseal.CodeBurn.desktop /app/share/applications/org.agentseal.CodeBurn.desktop
      - install -Dm644 org.agentseal.CodeBurn.metainfo.xml /app/share/metainfo/org.agentseal.CodeBurn.metainfo.xml
      - install -Dm644 org.agentseal.CodeBurn.png /app/share/icons/hicolor/512x512/apps/org.agentseal.CodeBurn.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: codeburn.deb
        only-arches:
          - x86_64
        url: https://github.com/getagentseal/codeburn/releases/download/desktop-v0.9.22/codeburn-desktop_0.9.22_amd64.deb
        sha256: 3db121b6e5f2d9e402e200979877acaa979c0a5140242dcefa27815c61285d23
        size: 110024044
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: codeburn-wrapper
      - type: file
        path: org.agentseal.CodeBurn.desktop
      - type: file
        path: org.agentseal.CodeBurn.metainfo.xml
      - type: file
        path: org.agentseal.CodeBurn.png
