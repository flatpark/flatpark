id: ai.storyteller.gridcraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: gridcraft
separate-locales: false
build-options:
  no-debuginfo: true
# The app id and finish-args follow upstream's own Flatpak manifest
# (packaging/linux/flatpak/ in storytold/gridcraft), so this package and the
# single-file bundle upstream builds are the same application. The runtime is
# 26.08, shared with the other ArtCraft apps; the binaries need only glibc
# from it.
finish-args:
  # Native Rust/egui app on winit; libwayland, libX11/xcb, xkbcommon and the
  # Vulkan/EGL loaders are dlopen()ed from the runtime.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu GPU compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Printing. craft-print lists printers with lpstat, reads the default with
  # lpoptions and sends jobs with lp. The runtime has libcups and lpr, not
  # those tools, and without the CUPS socket the Print dialog stays empty.
  # cups-client below ships them. Avahi is how `lpstat -e` finds driverless
  # printers. ~/.cups is read-only: the default printer, saved options and a
  # ServerName.
  - --socket=cups
  - --system-talk-name=org.freedesktop.Avahi
  - --filesystem=~/.cups:ro
  # Open/Save go through the file-chooser portal. Documents and Downloads are
  # granted so workbooks passed by path from the command line keep working.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Deliberately not granted:
  #   --share=network          -> the optional --control automation server
  #                               listens on 127.0.0.1 inside the sandbox; the
  #                               metainfo documents the override that exposes it
  #   --filesystem=home / host -> everything else goes through the portals
modules:
  # lp, lpstat and lpoptions from FlatPark's prebuilt cups-client stack: the
  # same build as upstream's cups-client module (CUPS 2.4.20, libcups linked
  # statically) plus upstream's socket wrapper; the tag's manifest records the
  # sources. apply_extra unpacks it to /app/extra/cups-client; the links below
  # put the tools on PATH and dangle until then. Extra-data, not built here: a
  # dependency is never compiled in an app's manifest
  # (docs/packagers/prebuilt.md). Kept as its own module so the module names
  # match upstream's manifest.
  - name: cups-client
    buildsystem: simple
    build-commands:
      - for tool in lp lpoptions lpstat; do install -d /app/bin; ln -s "/app/extra/cups-client/bin/$tool" "/app/bin/$tool"; done
    sources:
      - type: extra-data
        filename: cups-client.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/cups-client-v1/cups-client-cups-client-v1-fd-26.08-x86_64.tar.xz
        sha256: a96f57051ab61c98c73d99fed4dbe05a040fb2d1dbd353e1241d79b3aefea851
        size: 266076
      - type: extra-data
        filename: cups-client.tar.xz
        only-arches:
          - aarch64
        url: https://github.com/flatpark/prebuilt/releases/download/cups-client-v1/cups-client-cups-client-v1-fd-26.08-aarch64.tar.xz
        sha256: 7005c45fe7b1ebd24ed1146c47af34f00526407015cd7cbca5f0e1bbae37d909
        size: 238968
  - name: gridcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 gridcraft-wrapper /app/bin/gridcraft
      - install -Dm755 gridcraft-cli-wrapper /app/bin/gridcraft-cli
      - install -Dm644 ai.storyteller.gridcraft.desktop /app/share/applications/ai.storyteller.gridcraft.desktop
      - install -Dm644 ai.storyteller.gridcraft.metainfo.xml /app/share/metainfo/ai.storyteller.gridcraft.metainfo.xml
      - install -Dm644 ai.storyteller.gridcraft.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.gridcraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: gridcraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/gridcraft/releases/download/v0.19.1/gridcraft-0.19.1-linux-x86_64.tar.gz
        sha256: 8d97bba2d5bb00fd69ed55064852c1fd914de40d5ecd55ca01c8df81b828946d
        size: 53007583
      - type: extra-data
        filename: gridcraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/storytold/gridcraft/releases/download/v0.19.1/gridcraft-0.19.1-linux-aarch64.tar.gz
        sha256: c05373a366e6dded3201380cb82b3a0a137569a1b122d37c1b0ecf01cbd46b75
        size: 50966013
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: gridcraft-wrapper
      - type: file
        path: gridcraft-cli-wrapper
      - type: file
        path: ai.storyteller.gridcraft.desktop
      - type: file
        path: ai.storyteller.gridcraft.metainfo.xml
      - type: file
        path: ai.storyteller.gridcraft.png
