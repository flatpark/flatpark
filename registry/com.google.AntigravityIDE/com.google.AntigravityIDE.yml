id: com.google.AntigravityIDE
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: antigravity
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --unset-env=ELECTRON_RUN_AS_NODE
  - --filesystem=home
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 antigravity-wrapper /app/bin/antigravity
      - install -Dm644 com.google.AntigravityIDE.desktop /app/share/applications/com.google.AntigravityIDE.desktop
      - install -Dm644 com.google.AntigravityIDE.metainfo.xml /app/share/metainfo/com.google.AntigravityIDE.metainfo.xml
      - install -Dm644 com.google.AntigravityIDE.png /app/share/icons/hicolor/512x512/apps/com.google.AntigravityIDE.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: Antigravity IDE.tar.gz
        only-arches:
          - x86_64
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.5.5-4923483625488384/linux-x64/Antigravity%20IDE.tar.gz
        sha256: 0c5233b297d2b3aebb61af49f8944012c2953d361a5ebb16978490636917f831
        size: 240837095
      - type: extra-data
        filename: Antigravity IDE.tar.gz
        only-arches:
          - aarch64
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.5.5-4923483625488384/linux-arm/Antigravity%20IDE.tar.gz
        sha256: 88c167108980c33a223a8d7f0aa6aaf4dec61f0cc3950235a2698e9ffc38a49e
        size: 236865493
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: antigravity-wrapper
      - type: file
        path: com.google.AntigravityIDE.desktop
      - type: file
        path: com.google.AntigravityIDE.metainfo.xml
      - type: file
        path: com.google.AntigravityIDE.png
