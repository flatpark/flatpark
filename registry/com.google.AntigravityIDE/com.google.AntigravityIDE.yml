id: com.google.AntigravityIDE
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: antigravity
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --unset-env=ELECTRON_RUN_AS_NODE
  - --filesystem=home
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 antigravity-wrapper /app/bin/antigravity
      - install -Dm644 com.google.AntigravityIDE.desktop /app/share/applications/com.google.AntigravityIDE.desktop
      - install -Dm644 com.google.AntigravityIDE.metainfo.xml /app/share/metainfo/com.google.AntigravityIDE.metainfo.xml
      - install -Dm644 com.google.AntigravityIDE.png /app/share/icons/hicolor/512x512/apps/com.google.AntigravityIDE.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: Antigravity IDE.tar.gz
        only-arches:
          - x86_64
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.6.0-5526304964083712/linux-x64/Antigravity%20IDE.tar.gz
        sha256: b060a7c7679103b2b619752f8ee7a3088dd241a7d207d4311974b56ea6f94356
        size: 195292315
      - type: extra-data
        filename: Antigravity IDE.tar.gz
        only-arches:
          - aarch64
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.6.0-5526304964083712/linux-arm/Antigravity%20IDE.tar.gz
        sha256: 4953ccb52bf909582a1711a3dd26d640efb45fe555a17ebeff8bc7e2eaa052de
        size: 193593218
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: antigravity-wrapper
      - type: file
        path: com.google.AntigravityIDE.desktop
      - type: file
        path: com.google.AntigravityIDE.metainfo.xml
      - type: file
        path: com.google.AntigravityIDE.png
