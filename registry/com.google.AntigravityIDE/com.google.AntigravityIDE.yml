id: com.google.AntigravityIDE
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: antigravity
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --unset-env=ELECTRON_RUN_AS_NODE
  - --filesystem=home
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 antigravity-wrapper /app/bin/antigravity
      - install -Dm644 com.google.AntigravityIDE.desktop /app/share/applications/com.google.AntigravityIDE.desktop
      - install -Dm644 com.google.AntigravityIDE.metainfo.xml /app/share/metainfo/com.google.AntigravityIDE.metainfo.xml
      - install -Dm644 com.google.AntigravityIDE.png /app/share/icons/hicolor/512x512/apps/com.google.AntigravityIDE.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: Antigravity IDE.tar.gz
        only-arches:
          - x86_64
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.7.0-4507555968450560/linux-x64/Antigravity%20IDE.tar.gz
        sha256: 9360a86521c3e5498846254b743b1f3203768ebadf65a178bc549395936f7a5d
        size: 195329705
      - type: extra-data
        filename: Antigravity IDE.tar.gz
        only-arches:
          - aarch64
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.7.0-4507555968450560/linux-arm/Antigravity%20IDE.tar.gz
        sha256: 70c1938815408c3d3a2acfff303e3f627a8b16b7b85dd3d572bca7571c3a5ebb
        size: 193697869
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: antigravity-wrapper
      - type: file
        path: com.google.AntigravityIDE.desktop
      - type: file
        path: com.google.AntigravityIDE.metainfo.xml
      - type: file
        path: com.google.AntigravityIDE.png
