id: com.google.AntigravityIDE
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: antigravity
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --unset-env=ELECTRON_RUN_AS_NODE
  - --filesystem=home
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 antigravity-wrapper /app/bin/antigravity
      - install -Dm644 com.google.AntigravityIDE.desktop /app/share/applications/com.google.AntigravityIDE.desktop
      - install -Dm644 com.google.AntigravityIDE.metainfo.xml /app/share/metainfo/com.google.AntigravityIDE.metainfo.xml
      - install -Dm644 com.google.AntigravityIDE.png /app/share/icons/hicolor/512x512/apps/com.google.AntigravityIDE.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: Antigravity IDE.tar.gz
        only-arches:
          - x86_64
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.9.0-4671306730438656/linux-x64/Antigravity%20IDE.tar.gz
        sha256: f0193df2558e35ff98fafe829a5c318a1ae0957942343597eb9f97098e276b23
        size: 195321688
      - type: extra-data
        filename: Antigravity IDE.tar.gz
        only-arches:
          - aarch64
        url: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/2.9.0-4671306730438656/linux-arm/Antigravity%20IDE.tar.gz
        sha256: 3a926e31e5bcdb46f9d0dace37d9ba48243427d48518b7ea779d6b875962de0a
        size: 193735586
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: antigravity-wrapper
      - type: file
        path: com.google.AntigravityIDE.desktop
      - type: file
        path: com.google.AntigravityIDE.metainfo.xml
      - type: file
        path: com.google.AntigravityIDE.png
