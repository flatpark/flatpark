id: com.google.AntigravityIDE
name: Antigravity IDE
summary: The fully-featured agentic IDE
website: https://antigravity.google
build:
  manifest: com.google.AntigravityIDE.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: AI
  tags:
    - Development
    - AI
    - IDE
update:
  command: ./resolve-update.sh
policy:
  proprietary: true
  extra_data_first: true
  dangerous_permissions:
    - --filesystem=home
