id: io.github.tracedraw.TraceDraw
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: tracedraw
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Native Rust/egui app on winit; libwayland, libX11/xcb, xkbcommon and the
  # EGL/GL loaders are dlopen()ed from the runtime.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # GPU rendering of the canvas and the interface.
  - --device=dri
  # Spelling dictionary downloads, the optional cloud AI generation and
  # Help > Updates.
  - --share=network
  # Save Drawing is the app's own window, not a file chooser portal, so it only
  # sees folders the sandbox has, and .cdr files always go through it. Documents
  # is where it starts. Open, Import and Export use the portal and need no grant.
  # Measured: a save under the sandbox's $HOME is lost on exit, and a new name
  # next to a portal-opened file is left as a hidden .xdp-* temporary. The
  # metainfo says so and gives the home override; home is not granted by default.
  - --filesystem=xdg-documents
modules:
  - name: tracedraw
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 tracedraw-wrapper /app/bin/tracedraw
      - install -Dm755 tracedraw-cli-wrapper /app/bin/tracedraw-cli
      - install -Dm644 io.github.tracedraw.TraceDraw.desktop /app/share/applications/io.github.tracedraw.TraceDraw.desktop
      - install -Dm644 io.github.tracedraw.TraceDraw.metainfo.xml /app/share/metainfo/io.github.tracedraw.TraceDraw.metainfo.xml
      - install -Dm644 io.github.tracedraw.TraceDraw.mime.xml /app/share/mime/packages/io.github.tracedraw.TraceDraw.xml
      - install -Dm644 io.github.tracedraw.TraceDraw.png /app/share/icons/hicolor/512x512/apps/io.github.tracedraw.TraceDraw.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: tracedraw.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/tracedraw/tracedraw/releases/download/v0.44.0/tracedraw-0.44.0-linux-x86_64.tar.gz
        sha256: 81b078d4a96b5727f4c05f0cd7979657091105bf8629f32edbff9876bfb58105
        size: 42494929
      - type: extra-data
        filename: tracedraw.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/tracedraw/tracedraw/releases/download/v0.44.0/tracedraw-0.44.0-linux-arm64.tar.gz
        sha256: 9315b58529d7e741382a2133277f8f53a4c175c10a6c0626f1b80a7b097297c6
        size: 41967432
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: tracedraw-wrapper
      - type: file
        path: tracedraw-cli-wrapper
      - type: file
        path: io.github.tracedraw.TraceDraw.desktop
      - type: file
        path: io.github.tracedraw.TraceDraw.metainfo.xml
      - type: file
        path: io.github.tracedraw.TraceDraw.mime.xml
      - type: file
        path: io.github.tracedraw.TraceDraw.png
