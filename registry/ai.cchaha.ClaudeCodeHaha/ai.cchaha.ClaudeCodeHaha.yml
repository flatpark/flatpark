id: ai.cchaha.ClaudeCodeHaha
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
# Electron app: use the Electron base app, which ships zypak. zypak redirects
# Chromium's SUID sandbox onto the Flatpak sandbox, so the app keeps an internal
# sandbox (the wrapper runs it via zypak-wrapper) instead of --no-sandbox. The
# base is a prebuilt ref merged into the app at build time; the app stays
# self-contained.
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: cchaha
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Electron (Chromium) agent workbench. The prebuilt build bundles Chromium,
  # its own ffmpeg/ANGLE/Vulkan, the agent CLI engine and a ripgrep binary; the
  # GTK3, NSS, CUPS, ATK, ALSA, dbus, gbm and X11 stacks it links come from
  # org.freedesktop.Platform 25.08 — verified against the binary's NEEDED set,
  # 0 missing.
  - --share=ipc
  # Talks to the model providers over HTTPS, and to a local endpoint over the
  # loopback interface. The built-in browser preview pane also loads over the
  # network.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # GPU-accelerated Chromium compositing.
  - --device=dri
  # Desktop notifications when a long-running agent session finishes.
  - --talk-name=org.freedesktop.Notifications
  # The app offers a system tray icon; Electron publishes it over the
  # StatusNotifierItem protocol, which needs the watcher name.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Encrypt stored provider credentials (Electron safeStorage) through the
  # Secret Service when a keyring is present.
  - --talk-name=org.freedesktop.secrets
  # Strip a leaked ELECTRON_RUN_AS_NODE from the sandbox env so the binary — and
  # zypak's spawned child/zygote processes, which the wrapper's own `unset`
  # can't reach — always start as the GUI app rather than as plain Node.
  - --unset-env=ELECTRON_RUN_AS_NODE
  # No filesystem grant at all. The app's own state would default to ~/.claude,
  # which is under $HOME rather than under the XDG base directories Flatpak
  # redirects; the wrapper sets CLAUDE_CONFIG_DIR — the app's own knob for that
  # path — into the per-app data directory instead, so the state persists
  # without opening any host directory. Workspaces are opened on directories the
  # user names, and by default the only one visible is the sandboxed home, so
  # pointing the app at real code is an explicit opt-in; the metainfo carries
  # the exact `flatpak override` commands, including the pair that puts the
  # config directory back on a shared ~/.claude. No host command access is
  # granted either: the bundled engine and ripgrep run inside the sandbox.
modules:
  - name: cchaha
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 cchaha-wrapper /app/bin/cchaha
      - install -Dm644 ai.cchaha.ClaudeCodeHaha.desktop /app/share/applications/ai.cchaha.ClaudeCodeHaha.desktop
      - install -Dm644 ai.cchaha.ClaudeCodeHaha.metainfo.xml /app/share/metainfo/ai.cchaha.ClaudeCodeHaha.metainfo.xml
      - install -Dm644 ai.cchaha.ClaudeCodeHaha.png /app/share/icons/hicolor/512x512/apps/ai.cchaha.ClaudeCodeHaha.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: cc-haha.deb
        only-arches:
          - x86_64
        url: https://github.com/NanmiCoder/cc-haha/releases/download/v0.5.5/Claude-Code-Haha-0.5.5-linux-amd64.deb
        sha256: 723d6ccdda8ebe983328c0667ff2748f4086c62d27c6ad2d9e5e621cc271745a
        size: 179799708
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: cchaha-wrapper
      - type: file
        path: ai.cchaha.ClaudeCodeHaha.desktop
      - type: file
        path: ai.cchaha.ClaudeCodeHaha.metainfo.xml
      - type: file
        path: ai.cchaha.ClaudeCodeHaha.png
