id: com.chipichapa.sele
name: Sele
summary: Desktop workspace for AI coding agents and local projects
website: https://github.com/Chipi-Chapa-Corp/sele
source_url: https://github.com/Chipi-Chapa-Corp/sele
build:
  manifest: com.chipichapa.sele.yml
  branch: stable
  mode: extra-data
  arches: [x86_64]
catalog:
  category: AI
  upstream_approved: true
  tags:
    - AI
    - Coding
    - Agents
    - Terminal
    - Electron
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions:
    - --filesystem=host
packaging:
  - kind: seeded-config
    detail:
      en: "Before each start the launcher creates the empty marker file Sele itself writes after its first launch (~/.t3/userdata/cli-command-first-launch). Without it, Sele links a t3 command into ~/.local/bin that points inside the sandbox and fails on the host. The t3 command can still be installed from Settings."
      zh-Hans: "每次启动前，启动脚本会创建 Sele 首次启动后自己也会写入的空标记文件（~/.t3/userdata/cli-command-first-launch）。否则 Sele 会在 ~/.local/bin 里链接一个指向沙箱内部、在宿主机上无法运行的 t3 命令。仍可在设置中手动安装 t3 命令。"
