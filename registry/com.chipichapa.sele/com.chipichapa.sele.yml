id: com.chipichapa.sele
# Sdk, not Platform: Sele 4.x runs its agents, git and terminals as child
# processes inside the sandbox (no flatpak-spawn any more), and the Platform
# has no git. The Sdk ships git, ssh, bash, python3, make and compilers there,
# as for com.openai.ChatGPT and com.anthropic.ClaudeDesktop.
runtime: org.freedesktop.Sdk
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: sele
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Provider connections, the embedded browser and remote development.
  - --share=network
  # Sele opens, reads and edits arbitrary local repositories, creates git
  # worktrees under ~/.t3, and runs the agent CLIs the user installed in their
  # home (~/.local/bin, mise, npm, bun, cargo; see sele-wrapper). Its upstream
  # Flatpak uses the same grant; see policy.dangerous_permissions and the PR.
  - --filesystem=host
  # git and agents over SSH (push, fetch, remote environments) with the host's
  # agent; the socket lives under /run, which --filesystem=host doesn't cover.
  - --socket=ssh-auth
  # Provider tokens and the Electron safeStorage key go to the login keyring
  # (org.freedesktop.secrets; KWallet on KDE, which Chromium picks there).
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  # Not granted: --talk-name=org.freedesktop.Flatpak. Sele 1.x-3.x ran its
  # tools through flatpak-spawn --host; 4.x has no Flatpak code path and runs
  # everything in the sandbox, so the grant would only widen the attack surface.
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: sele
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 sele-wrapper /app/bin/sele
      - install -Dm644 com.chipichapa.sele.desktop /app/share/applications/com.chipichapa.sele.desktop
      - install -Dm644 com.chipichapa.sele.metainfo.xml /app/share/metainfo/com.chipichapa.sele.metainfo.xml
      - install -Dm644 com.chipichapa.sele.png /app/share/icons/hicolor/512x512/apps/com.chipichapa.sele.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: sele.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/Chipi-Chapa-Corp/sele/releases/download/v4.1.0/sele-linux-x64.tar.gz
        sha256: 4734759d536f3b4d91e34b8c4835a84d04a02a0aa0efcde32b9ed9b15febfc0f
        size: 274354177
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: sele-wrapper
      - type: file
        path: com.chipichapa.sele.desktop
      - type: file
        path: com.chipichapa.sele.metainfo.xml
      - type: file
        path: com.chipichapa.sele.png
