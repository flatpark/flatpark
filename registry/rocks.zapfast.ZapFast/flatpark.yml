# FlatPark catalog descriptor for ZapFast.
#
# FlatPark (https://flatpark.org/) is a signed Flatpak remote that repackages
# official vendor downloads as extra-data - it does not build from source. This
# file is the catalog entry; rocks.zapfast.ZapFast.yml is the Flatpak manifest
# it points at.
#
# read-descriptor.mjs in flatpark/flatpark is a line scanner, not a YAML parser,
# so keep the plain two-space block style below exactly as it is.
id: rocks.zapfast.ZapFast
name: ZapFast
summary: Fast native WhatsApp client with an encrypted local archive
website: https://zapfast.rocks/
source_url: https://github.com/crmne/zapfast
build:
  manifest: rocks.zapfast.ZapFast.yml
  branch: stable
  mode: extra-data
catalog:
  category: Network
  tags:
    - WhatsApp
    - Chat
    - Messaging
    - InstantMessaging
    - Rust
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []
