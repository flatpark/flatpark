<?xml version="1.0" encoding="UTF-8"?>
<!-- BlueShell app icon. Original artwork for this project (GPL-3.0-or-later,
     same as the project). A scallop shell in GNOME blues carrying a
     terminal prompt — the "shell" both ways. -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shellFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="0.55" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="hingeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c71d8"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="64" cy="114" rx="40" ry="7" fill="#000000" opacity="0.15"/>

  <!-- scallop fan: hinge at (64,106), five arc bumps across the top -->
  <path d="M 64 106
           L 13.3 87.5
           A 15 15 0 0 1 27.9 65.9
           A 15 15 0 0 1 50.9 53.6
           A 15 15 0 0 1 77.1 53.6
           A 15 15 0 0 1 100.1 65.9
           A 15 15 0 0 1 114.7 87.5
           Z"
        fill="url(#shellFill)" stroke="#1a5fb4" stroke-width="3"
        stroke-linejoin="round"/>

  <!-- ridges radiating from the hinge -->
  <g stroke="#1a5fb4" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <path d="M 64 100 L 27.9 65.9"/>
    <path d="M 64 100 L 50.9 53.6"/>
    <path d="M 64 100 L 77.1 53.6"/>
    <path d="M 64 100 L 100.1 65.9"/>
  </g>

  <!-- hinge tab -->
  <rect x="50" y="100" width="28" height="14" rx="5" fill="url(#hingeFill)"/>

  <!-- terminal prompt: chevron + caret line -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M 47 68 L 61 80 L 47 92"/>
    <path d="M 70 92 L 85 92"/>
  </g>
</svg>
