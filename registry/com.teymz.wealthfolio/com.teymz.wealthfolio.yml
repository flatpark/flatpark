id: com.teymz.wealthfolio
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: wealthfolio
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Wealthfolio is a Tauri (Rust + React, WebKitGTK) desktop app with an
  # embedded SQLite database. dri backs accelerated WebKit rendering;
  # ipc/wayland/fallback-x11 carry the window.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Quotes, exchange rates and the add-on catalogue are fetched over the network.
  - --share=network
  # The payload stores credentials for its optional sync with the Secret
  # Service (keyring-rs). Without this the app reaches a permission error on
  # that path.
  - --talk-name=org.freedesktop.secrets
  # Importing account statements and exporting reports. The portfolio database
  # itself lives in the app's private data directory, so no wider grant is
  # needed; other locations are opt-in through the flatpak override documented
  # in the AppStream description.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # No tray: the payload has no libayatana-appindicator/StatusNotifier
  # dependency, so neither the Ayatana stack nor xdg-run/tray-icon is needed.
modules:
  - name: wealthfolio
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 wealthfolio-wrapper /app/bin/wealthfolio
      - install -Dm644 com.teymz.wealthfolio.desktop /app/share/applications/com.teymz.wealthfolio.desktop
      - install -Dm644 com.teymz.wealthfolio.metainfo.xml /app/share/metainfo/com.teymz.wealthfolio.metainfo.xml
      - install -Dm644 com.teymz.wealthfolio.png /app/share/icons/hicolor/512x512/apps/com.teymz.wealthfolio.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: wealthfolio.deb
        only-arches:
          - x86_64
        url: https://github.com/wealthfolio/wealthfolio/releases/download/v3.7.0/Wealthfolio_3.7.0_amd64.deb
        sha256: 492a7e42cdf2e8e9cae8ba7058ec81dee660fe3cd7aa4ef2cf7435dadac13235
        size: 142055552
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: wealthfolio-wrapper
      - type: file
        path: com.teymz.wealthfolio.desktop
      - type: file
        path: com.teymz.wealthfolio.metainfo.xml
      - type: file
        path: com.teymz.wealthfolio.png
