id: io.github.BenchUp3D.BenchUp
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: benchup-app
separate-locales: false
build-options:
  no-debuginfo: true
# eframe/wgpu. The binary needs libstdc++ and libudev from the runtime.
# Wayland, X11, xkbcommon, EGL and Vulkan are loaded at run time.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # No filesystem grant: Open and Save go through the file chooser portal.
modules:
  - name: benchup
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 benchup-wrapper /app/bin/benchup-app
      - install -Dm644 io.github.BenchUp3D.BenchUp.desktop /app/share/applications/io.github.BenchUp3D.BenchUp.desktop
      - install -Dm644 io.github.BenchUp3D.BenchUp.metainfo.xml /app/share/metainfo/io.github.BenchUp3D.BenchUp.metainfo.xml
      - install -Dm644 io.github.BenchUp3D.BenchUp.png /app/share/icons/hicolor/512x512/apps/io.github.BenchUp3D.BenchUp.png
    sources:
      # appimage-offset + unsquashfs, so apply_extra can open the AppImage
      # offline with no FUSE. Outside the managed block, which the updater
      # rebuilds from the resolver output.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: benchup.AppImage
        only-arches:
          - x86_64
        url: https://github.com/BenchUp3D/benchup/releases/download/v0.7.1/io.github.BenchUp3D.BenchUp-linux-x64.AppImage
        sha256: 81d78b160c1220bd8603bcb42fc7b01456782c09e3bbe491cd50392501b5051d
        size: 31590904
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: benchup-wrapper
      - type: file
        path: io.github.BenchUp3D.BenchUp.desktop
      - type: file
        path: io.github.BenchUp3D.BenchUp.metainfo.xml
      - type: file
        path: io.github.BenchUp3D.BenchUp.png
