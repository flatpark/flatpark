id: io.github.BenchUp3D.BenchUp
name: BenchUp
summary: 3D woodworking and modeling
website: https://benchup3d.github.io/editor/
source_url: https://github.com/BenchUp3D/editor
build:
  manifest: io.github.BenchUp3D.BenchUp.yml
  branch: stable
  mode: extra-data
  arches: [x86_64]
catalog:
  category: Graphics
  upstream_approved: false
  tags:
    - 3D
    - Woodworking
    - Modeling
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
packaging:
  - kind: seeded-config
    detail:
      en: "On first launch, turns off BenchUp's automatic updates; Flatpak delivers updates instead."
      zh-Hans: "首次启动时关闭 BenchUp 的自动更新，改由 Flatpak 负责更新。"
