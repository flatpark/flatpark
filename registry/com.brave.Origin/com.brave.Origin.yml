id: com.brave.Origin
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
# Brave is a Chromium browser, so it needs zypak: Flatpak refuses the namespace
# syscalls Chromium's own sandbox is built on, and zypak redirects that sandbox
# onto the Flatpak sandbox instead of falling back to --no-sandbox — which for a
# browser would leave every renderer, running arbitrary web content, unconfined
# next to the profile. The Electron base app is where zypak ships prebuilt, and
# it is the base the rest of this catalog's Chromium-family apps already use.
# org.chromium.Chromium.BaseApp does not carry zypak (only its cobalt launcher,
# krb5 and a libsecret the runtime already has), so taking that base means
# building zypak per app for no gain. What it costs: no krb5, hence no
# Kerberos/Negotiate single sign-on on intranet sites.
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: brave-origin
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # zypak spawns the sandboxed children through flatpak-spawn --expose-pids.
  - --require-version=1.8.2
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio
  - --socket=cups
  - --socket=pcsc
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.gnome.Mutter.IdleMonitor.*
  - --talk-name=org.cinnamon.ScreenSaver
  - --talk-name=org.mate.ScreenSaver
  - --talk-name=org.xfce.ScreenSaver
  - --own-name=org.mpris.MediaPlayer2.brave.*
  - --filesystem=xdg-download
  - --filesystem=xdg-run/pipewire-0
  - --persist=.pki
  - --env=CHROME_VERSION_EXTRA=stable
  # No GSettings backend is shipped, so proxy settings configured on the host
  # desktop are not read. A proxy is configured with --proxy-server in
  # ~/.var/app/com.brave.Origin/config/brave-flags.conf, which the launcher
  # reads.
  # The browser can use file chooser portals for paths outside Downloads. PWA
  # desktop integration and host policy loading are deliberately opt-in rather
  # than granting host-etc and host application/icon directories by default.
modules:
  - name: brave-origin
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 brave-origin-wrapper /app/bin/brave-origin
      - install -Dm644 com.brave.Origin.desktop /app/share/applications/com.brave.Origin.desktop
      - install -Dm644 com.brave.Origin.metainfo.xml /app/share/metainfo/com.brave.Origin.metainfo.xml
      - install -Dm644 com.brave.Origin.svg -t /app/share/icons/hicolor/scalable/apps
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: brave-origin-amd64.zip
        only-arches:
          - x86_64
        url: https://github.com/brave/brave-browser/releases/download/v1.96.59/brave-origin-1.96.59-linux-amd64.zip
        sha256: ad71abea5326d15bbe813a1e9592bcf2383f2ecc083a432313ca80b4436d3797
        size: 186384117
      - type: extra-data
        filename: brave-origin-arm64.zip
        only-arches:
          - aarch64
        url: https://github.com/brave/brave-browser/releases/download/v1.96.59/brave-origin-1.96.59-linux-arm64.zip
        sha256: 68d1fb922e0ad25099081a32a7f0611f2657345726590b697eaf6bbb820848ee
        size: 187065334
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: brave-origin-wrapper
      - type: file
        path: com.brave.Origin.desktop
      - type: file
        path: com.brave.Origin.metainfo.xml
      - type: file
        path: com.brave.Origin.svg
