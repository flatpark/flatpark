# FlatPark catalog descriptor for ElyMark, part of Ely Office.
#
# read-descriptor.mjs is a line scanner, not a YAML parser; keep the plain
# two-space block style below.
id: ely.zacharyzhang.office.mark
name: ElyMark
summary: Markdown editor with live preview, math and diagrams
website: https://office.elygpui.com
source_url: https://github.com/ELY-Open-Source/ElyOffice
build:
  manifest: ely.zacharyzhang.office.mark.yml
  branch: stable
  mode: extra-data
catalog:
  category: Office
  upstream_approved: true
  tags:
    - Markdown
    - Editor
    - Math
    - Mermaid
    - Offline
update:
  command: ./resolve-update.sh
policy:
  # MIT since 2026-10-19 (upstream LICENSE and packaging/linux/package.sh).
  proprietary: false
  dangerous_permissions: []
