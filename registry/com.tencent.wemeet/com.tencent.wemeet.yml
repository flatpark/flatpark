id: com.tencent.wemeet
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: wemeetapp
separate-locales: false
rename-icon: wemeet
rename-desktop-file: wemeet.desktop
build-options:
  # no-debuginfo alone leaves the DWARF inside the copied prebuilt libraries;
  # without strip this app exported a 42.4 MB .Debug ref.
  no-debuginfo: true
  strip: true
finish-args:
  # Tencent Meeting (腾讯会议). Repackages the official upstream .deb unmodified.
  #
  # WeMeet is forced onto XWayland (QT_QPA_PLATFORM=xcb) and its screen-sharing
  # is restored by LD_PRELOAD-ing wemeet-wayland-screenshare's libhook.so, which
  # drives the X11 SHM capture path. This is required on wlroots/Hyprland-style
  # sessions where the app's native-Wayland screenshare does not work; the hook
  # only matters once the app is on XWayland, so --socket=wayland is withheld.
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  # Camera + microphone + GPU for the call. Declared in policy.dangerous_permissions.
  - --device=all
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.gnome.Shell.Screencast
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=XDG_SESSION_TYPE=x11
  - --env=QT_QPA_PLATFORM=xcb
  - --env=LD_PRELOAD=/app/lib/wemeet/libhook.so
  - --unset-env=WAYLAND_DISPLAY
  # Hidpi scale
  - --env=QT_AUTO_SCREEN_SCALE_FACTOR=1
modules:
  # libportal + wemeet-wayland-screenshare libhook.so. OpenCV is dlopen'd, not
  # linked, so this archive ships none of it — it comes in as extra-data below.
  # Prebuilt once against org.freedesktop.Sdk//26.08 by
  # https://github.com/flatpark/prebuilt (the manifest at the release tag
  # records the exact sources and pins).
  - name: wemeet-screenshare-hook
    buildsystem: simple
    only-arches: [x86_64]
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/flatpark/prebuilt/releases/download/wemeet-screenshare-hook-v2/wemeet-screenshare-hook-wemeet-screenshare-hook-v2-fd-26.08-x86_64.tar.xz
        sha256: 3484c59fdcad59b09fa47a664afef57117984118271ffa4c209712a7e60b9231

  - name: wemeet
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 wemeet-wrapper /app/bin/wemeetapp
      - install -Dm644 com.tencent.wemeet.metainfo.xml -t /app/share/metainfo
      - install -Dm644 wemeet.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 wemeet.desktop /app/share/applications/wemeet.desktop
      # WeMeet's own launch script calls desktop-file-edit at runtime to register
      # the wemeet: URL handler; the Platform runtime has no desktop-file-utils,
      # so ship the SDK copy.
      - install -D /usr/bin/desktop-file-edit -t /app/bin/
    sources:
      # OpenCV (core + imgproc), FlatPark's audited prebuilt stack. The hook
      # dlopen()s libopencv_core.so / libopencv_imgproc.so by their UNVERSIONED
      # soname when screen sharing starts (its OpencvDLFCNSingleton), so
      # libhook.so has no OpenCV DT_NEEDED but screen sharing dies with "Failed
      # to open library libopencv_core.so" if they cannot be found.
      #
      # Extra-data rather than a build module: as an archive module the stack
      # was stored in FlatPark's repository, and WeMeet is its only consumer, so
      # content addressing had nothing to deduplicate. apply_extra unpacks it to
      # /app/extra/opencv-imgproc, which only this app's wrapper puts on
      # LD_LIBRARY_PATH, and last — nothing else in the sandbox is shadowed.
      #
      # Deliberately OUTSIDE the managed block below: update-pins.mjs rebuilds
      # that block from the resolver's sources and would drop anything else in it.
      - type: extra-data
        filename: opencv-imgproc.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/opencv-imgproc-v3/opencv-imgproc-opencv-imgproc-v3-fd-26.08-x86_64.tar.xz
        sha256: 3b5a7b1245bf6606af1c991af506402403c2011b47f42df1bb2d6f551513ce9b
        size: 4598760
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: wemeet.deb
        only-arches:
          - x86_64
        url: https://updatecdn.meeting.qq.com/cos/72e0e0023e1d1e6d4123fba28821aea1/TencentMeeting_0300000000_3.26.10.401_x86_64_default.publish.officialwebsite.deb
        sha256: 70f37b029209c0ef91be9813eebf6650c6cb9a00f7c718490158773e2fe6acaf
        size: 197268516
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: wemeet-wrapper
      - type: file
        path: com.tencent.wemeet.metainfo.xml
      - type: file
        path: wemeet.svg
      - type: file
        path: wemeet.desktop
