id: io.github.onekeepass.desktop
name: OneKeePass
summary: KeePass-compatible password manager for local .kdbx vaults
website: https://github.com/OneKeePass/desktop
source_url: https://github.com/OneKeePass/desktop
build:
  manifest: io.github.onekeepass.desktop.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: Security
  tags:
    - Passwords
    - KeePass
    - kdbx
    - Security
    - Tauri
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  extra_data_first: true
  dangerous_permissions: []
