id: io.github.francisreboucas.constructcraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: constructcraft
separate-locales: false
build-options:
  no-debuginfo: true
# Native Rust/egui/wgpu build. The binaries need only glibc from the runtime.
# Wayland, X11, xkbcommon, EGL, Vulkan and dbus are loaded at run time; the
# 26.08 platform ships them. The binary sets its window class to constructcraft.
# Upstream renamed ConstructCAD to ConstructCraft in 0.10.0; this id replaces
# io.github.francisreboucas.constructcad.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # 3D view (wgpu: Vulkan, with EGL as a fallback).
  - --device=dri
  # Updates come from FlatPark; turn off the in-app GitHub release notice.
  # The variable kept its old name through the rename.
  - --env=CONSTRUCTCAD_NO_UPDATE_CHECK=1
  # Open and Save go through the file-chooser portal. Documents is granted so
  # a project passed by path keeps working.
  - --filesystem=xdg-documents
modules:
  - name: constructcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 constructcraft-wrapper /app/bin/constructcraft
      - install -Dm755 ccad-wrapper /app/bin/ccad
      - install -Dm644 io.github.francisreboucas.constructcraft.desktop /app/share/applications/io.github.francisreboucas.constructcraft.desktop
      - install -Dm644 io.github.francisreboucas.constructcraft.metainfo.xml /app/share/metainfo/io.github.francisreboucas.constructcraft.metainfo.xml
      - install -Dm644 io.github.francisreboucas.constructcraft.mime.xml /app/share/mime/packages/io.github.francisreboucas.constructcraft.xml
      - install -Dm644 io.github.francisreboucas.constructcraft.png /app/share/icons/hicolor/512x512/apps/io.github.francisreboucas.constructcraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: constructcraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/francisreboucas/constructcraft/releases/download/v0.10.0/constructcraft-v0.10.0-x86_64-unknown-linux-gnu.tar.gz
        sha256: 1a6f6cb501805505434105ae4eb52d1c26d703796a94f10f338859a2bb59d72c
        size: 40604825
      - type: extra-data
        filename: constructcraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/francisreboucas/constructcraft/releases/download/v0.10.0/constructcraft-v0.10.0-aarch64-unknown-linux-gnu.tar.gz
        sha256: 888e5a3248af0915c63cc3f4903f1318099987ba3aa84a93e0b7215315892005
        size: 39779345
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: constructcraft-wrapper
      - type: file
        path: ccad-wrapper
      - type: file
        path: io.github.francisreboucas.constructcraft.desktop
      - type: file
        path: io.github.francisreboucas.constructcraft.metainfo.xml
      - type: file
        path: io.github.francisreboucas.constructcraft.mime.xml
      - type: file
        path: io.github.francisreboucas.constructcraft.png
