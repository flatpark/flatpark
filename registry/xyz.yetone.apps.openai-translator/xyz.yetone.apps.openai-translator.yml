id: xyz.yetone.apps.openai-translator
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: nextai-translator
separate-locales: false
build-options:
  no-debuginfo: true
  strip: true
finish-args:
  # Use X11 via XWayland by default; arboard and enigo require X11 for clipboard/input.
  - --share=ipc
  - --socket=x11
  - --device=dri
  # Configured translation providers, including local OpenAI-compatible servers.
  - --share=network
  # Measured tauri-plugin-single-instance bus name (outside the Flatpak id).
  - --own-name=org.xyz_yetone_apps_openai_translator.SingleInstance
  # The Tauri tray publishes its icon through a host-visible runtime directory.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
modules:
  # GNOME 51 does not ship the tray library or libxdo.so.3 required by enigo.
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v2/ayatana-stack-ayatana-v2-gnome-51-x86_64.tar.xz
        sha256: 1051a537f22d335eb79557b8c5a610a12c326712dac74032de8e76e78b876fdc
  - name: libxdo
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/libxdo-v2/libxdo-libxdo-v2-gnome-51-x86_64.tar.xz
        sha256: 6934f6aa6c8264575444e8b00330855b45242a455f0b4a9bff52a89bf9e3aa6a
  - name: nextai-translator
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 nextai-wrapper /app/bin/nextai-translator
      - install -Dm644 xyz.yetone.apps.openai-translator.desktop /app/share/applications/xyz.yetone.apps.openai-translator.desktop
      - install -Dm644 xyz.yetone.apps.openai-translator.metainfo.xml /app/share/metainfo/xyz.yetone.apps.openai-translator.metainfo.xml
      - install -Dm644 xyz.yetone.apps.openai-translator.png /app/share/icons/hicolor/256x256/apps/xyz.yetone.apps.openai-translator.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: nextai.deb
        only-arches: [x86_64]
        url: https://github.com/nextai-translator/nextai-translator/releases/download/v0.6.55/NextAI.Translator_0.6.55_amd64.deb
        sha256: 89fd3a90d48c06a98429c301587f8b6d5292ceaf21dc65369c61cdc48c4d06ed
        size: 28542960
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: nextai-wrapper
      - type: file
        path: xyz.yetone.apps.openai-translator.desktop
      - type: file
        path: xyz.yetone.apps.openai-translator.metainfo.xml
      - type: file
        path: xyz.yetone.apps.openai-translator.png
