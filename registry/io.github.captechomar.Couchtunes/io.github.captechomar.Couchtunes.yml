id: io.github.captechomar.Couchtunes
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
# Electron app: layer in the Electron base app, which ships zypak. zypak
# redirects Chromium's SUID sandbox onto the Flatpak sandbox so the app keeps an
# internal sandbox (the wrapper runs it via zypak-wrapper). The base is merged
# into the app at build time; the payload itself is still the vendor's own
# release, fetched as extra-data.
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: couchtunes
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Electron (Chromium) client for Navidrome / Subsonic servers. Upstream ships
  # its Linux build as an electron-builder AppImage; this repackages the AppDir
  # inside it unmodified. The grants follow what the developer asked for in
  # flatpark#1286 and what their own Flatpak of this app id sets.
  - --share=ipc
  # Everything it plays is streamed from the user's music server.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # GPU-accelerated rendering.
  - --device=dri
  # Playback.
  - --socket=pulseaudio
  # Game controllers, the app's couch mode. Chromium's Gamepad API finds them
  # through udev, whose database is read from /run/udev, and opens
  # /dev/input/event*, and /dev/hidraw* for some controllers, which
  # --device=input doesn't expose. Declared in
  # policy.dangerous_permissions.
  - --device=all
  - --filesystem=/run/udev:ro
  # Media keys and the desktop's now-playing controls: Chromium registers
  # navigator.mediaSession as org.mpris.MediaPlayer2.chromium.instance<pid>.
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  # Cursor theme from the host, so the pointer matches the desktop. Flatpak
  # exposes the system and ~/.local/share icon folders under /run/host; themes
  # installed in the older ~/.icons need that folder read-only. The wrapper puts
  # all three on XCURSOR_PATH.
  - --filesystem=~/.icons:ro
  # Strip a leaked ELECTRON_RUN_AS_NODE from the sandbox env so the binary — and
  # zypak's spawned zygote children, which the wrapper's own `unset` cannot
  # reach — always start as the GUI app rather than as plain Node.
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: couchtunes
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 couchtunes-wrapper /app/bin/couchtunes
      - install -Dm644 io.github.captechomar.Couchtunes.desktop /app/share/applications/io.github.captechomar.Couchtunes.desktop
      - install -Dm644 io.github.captechomar.Couchtunes.metainfo.xml /app/share/metainfo/io.github.captechomar.Couchtunes.metainfo.xml
      - install -Dm644 io.github.captechomar.Couchtunes.png /app/share/icons/hicolor/512x512/apps/io.github.captechomar.Couchtunes.png
    sources:
      # The offline AppImage extractor (appimage-offset + unsquashfs) from
      # https://github.com/flatpark/prebuilt. A second extra-data source rather
      # than an archive module, because apply_extra runs in a sandbox that binds
      # only the runtime /usr and /app/extra (scripts/check-apply-extra.sh
      # reproduces this). Kept OUTSIDE the managed block: update-pins.mjs
      # rebuilds that block from the resolver output and would drop anything
      # else in it.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: couchtunes.AppImage
        only-arches:
          - x86_64
        url: https://github.com/CaptechOmar/Couchtunes/releases/download/v2.16.7/Couchtunes-2.16.7-linux-x86_64.AppImage
        sha256: 52b279aa555ace86291899a247b201e8cdfc3351b76590c687587816f8dbb53b
        size: 116812280
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: couchtunes-wrapper
      - type: file
        path: io.github.captechomar.Couchtunes.desktop
      - type: file
        path: io.github.captechomar.Couchtunes.metainfo.xml
      # The developer's own icon (a derivative of a MoreWaita icon, GPL-3.0,
      # credited in upstream's README), the 512px PNG from upstream's flatpak/.
      - type: file
        path: io.github.captechomar.Couchtunes.png
