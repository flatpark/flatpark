id: io.github.pietini69.photoncam
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: photoncam
separate-locales: false
build-options:
  no-debuginfo: true
# Native Rust/egui app. The binary needs only glibc from the runtime.
# Wayland, X11, xkbcommon and EGL are loaded at run time.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # USB serial for a GRBL or Ruida controller (/dev/ttyUSB*, /dev/ttyACM*).
  # Also covers the GPU (dri) and the alignment camera (/dev/video*).
  - --device=all
  # A controller behind a Raspberry Pi running PhotonCAM Bridge (tcp, port
  # 2323) is one of the two connection types next to USB serial. The same
  # grant serves the web remote and iPad bridge, which only run after the user
  # starts them from the app; they bind 0.0.0.0 without authentication and
  # serve POST /api/system/update, a curl | bash of upstream's
  # install_pi_bridge.sh from master. Disclosed in the metainfo.
  - --share=network
  # Open and Save go through the file-chooser portal. Documents is granted
  # so a project passed by path keeps working.
  - --filesystem=xdg-documents
  # Upstream hardcodes $HOME/Documents (not the XDG dir) for the material
  # library and the traffic log, and falls back to the tmpfs $HOME without it,
  # which loses them on a localized desktop.
  - --filesystem=~/Documents:create
  # Settings, the material palette and the camera calibration go to a
  # hardcoded $HOME/.config/laser_burn, not XDG_CONFIG_HOME.
  - --filesystem=~/.config/laser_burn:create
modules:
  - name: photoncam
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 photoncam-wrapper /app/bin/photoncam
      - install -Dm644 io.github.pietini69.photoncam.desktop /app/share/applications/io.github.pietini69.photoncam.desktop
      - install -Dm644 io.github.pietini69.photoncam.metainfo.xml /app/share/metainfo/io.github.pietini69.photoncam.metainfo.xml
      - install -Dm644 io.github.pietini69.photoncam.png /app/share/icons/hicolor/512x512/apps/io.github.pietini69.photoncam.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: photoncam.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/pietini69/photoncam/releases/download/v1.2.8/PhotonCAM-1.2.8-linux-x86_64.tar.gz
        sha256: f4b76afc62d36e28e3a9a1eca9513f18986689d809dc884eaff358c09e3c386f
        size: 8104053
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: photoncam-wrapper
      - type: file
        path: io.github.pietini69.photoncam.desktop
      - type: file
        path: io.github.pietini69.photoncam.metainfo.xml
      - type: file
        path: io.github.pietini69.photoncam.png
