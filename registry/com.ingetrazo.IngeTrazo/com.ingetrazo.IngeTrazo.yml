id: com.ingetrazo.IngeTrazo
# The app id matches upstream's own Flatpak (com.ingetrazo.IngeTrazo), so this
# package and the one they publish are the same application. The payload is
# their official Linux tarball, a self-contained PyInstaller tree (Python 3.12,
# PySide6 / Qt 6, and the libraries those wheels need). Nothing Qt or Python
# comes from the runtime. ldd inside org.freedesktop.Platform//26.08 reports
# no missing libraries; libGL and libEGL are not shipped in the tarball, so
# the runtime's copies are the ones that load.
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: ingetrazo
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  # The tarball ships both the Qt 6 Wayland platform plugin and xcb. When
  # Wayland EGL cannot create the desktop-GL context the viewport asks for,
  # the app restarts itself under xcb and needs a real DISPLAY.
  # --socket=fallback-x11 withholds X11 while a compositor is present, so
  # this is a plain --socket=x11 next to Wayland.
  - --socket=wayland
  - --socket=x11
  # The OpenGL viewport is the application.
  - --device=dri
  # Base-map tiles, the elevation model and geocoding. Modelling itself is
  # local; withholding network only disables those.
  - --share=network
  # A model references textures and linked files by path, and reopening it
  # needs those paths to still be reachable. These are the standard document
  # locations. Projects kept elsewhere are an opt-in override in the
  # metainfo. Not --filesystem=home, so QStandardPaths stays under
  # ~/.var/app/com.ingetrazo.IngeTrazo.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures
modules:
  - name: ingetrazo
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 ingetrazo-wrapper /app/bin/ingetrazo
      - install -Dm644 com.ingetrazo.IngeTrazo.desktop /app/share/applications/com.ingetrazo.IngeTrazo.desktop
      - install -Dm644 com.ingetrazo.IngeTrazo.metainfo.xml /app/share/metainfo/com.ingetrazo.IngeTrazo.metainfo.xml
      - install -Dm644 com.ingetrazo.IngeTrazo.mime.xml /app/share/mime/packages/com.ingetrazo.IngeTrazo.xml
      - install -Dm644 com.ingetrazo.IngeTrazo.png /app/share/icons/hicolor/256x256/apps/com.ingetrazo.IngeTrazo.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: ingetrazo.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/ingelibre/ingetrazo/releases/download/v0.6.0/IngeTrazo-0.6.0-linux-x86_64.tar.gz
        sha256: 43d667fed14467c1fea6925ab09e2b5a49437506855e933fb9c6d96ac5e2c6e2
        size: 162380593
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: ingetrazo-wrapper
      - type: file
        path: com.ingetrazo.IngeTrazo.desktop
      - type: file
        path: com.ingetrazo.IngeTrazo.metainfo.xml
      - type: file
        path: com.ingetrazo.IngeTrazo.mime.xml
      - type: file
        path: com.ingetrazo.IngeTrazo.png
