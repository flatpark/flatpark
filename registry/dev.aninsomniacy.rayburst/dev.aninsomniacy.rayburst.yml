id: dev.aninsomniacy.rayburst
# The freedesktop base, because the app runs on the GTK 3 / WebKitGTK 4.1 stack
# its AppImage carries, not on a runtime's. On org.gnome.Platform//51, whose
# WebKitGTK is 2.54.1, the app's transparent window was drawn only where a
# frame had changed on some KWin desktops and see-through everywhere else
# (flatpark#1262), while the AppImage on the same machine drew normally. The
# AppImage is linuxdeploy-built and brings glib, GTK 3, libsoup 3, WebKitGTK
# and WebKit's helper processes from its build machine; from the runtime it
# takes only libc, X11/Wayland, fontconfig/freetype and the GPU drivers.
#
# The cost: the WebKitGTK version is whatever upstream's build machine has
# (Ubuntu 22.04's, older than the GNOME runtime's) and its security fixes
# arrive only with upstream releases, not with runtime updates. Once the GNOME
# runtime's WebKitGTK draws this window correctly on those desktops, go back
# to the .deb on org.gnome.Platform (git history has that package).
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: rayburst
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Tauri v2 / WebKitGTK 4.1 (GTK 3) front end driving a bundled aria2-derived
  # engine, Aria2 Next.
  #
  # Native Wayland with X11 as the fallback, not --socket=x11. The AppImage's
  # linuxdeploy GTK hook (apprun-hooks/linuxdeploy-plugin-gtk.sh) leaves its
  # `export GDK_BACKEND=x11` line commented out, and its bundled GTK 3 has the
  # Wayland backend, so the app opens a Wayland window like the GNOME-runtime
  # build did; X11 is only needed where there is no Wayland session.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The app decides between GPU and CPU painting itself (its "hardware
  # rendering" setting); dri lets the GPU path work.
  - --device=dri
  # The downloads themselves, the engine's BitTorrent/DHT/ED2K traffic, and the
  # loopback listeners the engine's RPC and the Extension API bind. Flatpak does
  # not isolate the network namespace, so the browser extension on the host
  # reaches the Extension API over loopback like any other local client.
  - --share=network
  # Default destination. Flatpak maps xdg-download into the sandbox, so the app's
  # default save folder resolves to the real Downloads directory. Any other
  # location is granted per-folder through the file chooser portal, or by the
  # user with `flatpak override --filesystem=...` (documented in the metainfo).
  - --filesystem=xdg-download
  # Download-complete notifications and the tray icon. The ksni tray sends its
  # icon as pixmap data over D-Bus, so it needs no icon directory shared with the
  # host (the xdg-run/tray-icon grant was for Tauri's own tray-icon backend).
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # "Open containing folder" on a finished task calls
  # org.freedesktop.FileManager1.ShowItems, which is the host's file manager and
  # not a portal, so the session bus proxy hides it without this grant and the
  # menu entry does nothing at all.
  - --talk-name=org.freedesktop.FileManager1
  # The tray is ksni (src-tauri/src/tray/linux.rs). Since 4.1.3-beta.1 it
  # registers with the watcher under the connection's unique name when
  # sandboxed (disable_dbus_name, AnInsomniacy/rayburst#825), so it needs no
  # --own-name grant; before that it owned org.kde.StatusNotifierItem-2-1
  # inside the sandbox and failed with ServiceUnknown without the grant.
  # tauri-plugin-single-instance's own well-known name sits under the app id, so
  # Flatpak already lets the app own it; it needs no grant of its own.
modules:
  # The tray is ksni over D-Bus (src-tauri/src/tray/linux.rs); the AppImage
  # also carries libayatana-appindicator3 for Tauri's TrayIconBuilder, which
  # the app does not use on Linux, so nothing tray-related is added here.
  - name: rayburst
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 rayburst-wrapper /app/bin/rayburst
      - install -Dm644 dev.aninsomniacy.rayburst.desktop /app/share/applications/dev.aninsomniacy.rayburst.desktop
      - install -Dm644 dev.aninsomniacy.rayburst.metainfo.xml /app/share/metainfo/dev.aninsomniacy.rayburst.metainfo.xml
      - install -Dm644 dev.aninsomniacy.rayburst.png /app/share/icons/hicolor/256x256/apps/dev.aninsomniacy.rayburst.png
    sources:
      # appimage-offset and unsquashfs for apply_extra, which unpacks the
      # AppImage without running it. Extra-data rather than a module in /app:
      # a system-wide install runs apply_extra with only the runtime's /usr
      # and /app/extra visible. Kept outside the managed block, which
      # update-pins rebuilds from the resolver's output.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches:
          - x86_64
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: rayburst.AppImage
        only-arches:
          - x86_64
        url: https://github.com/AnInsomniacy/rayburst/releases/download/v4.1.3/Rayburst_4.1.3_amd64.AppImage
        sha256: ad179fe9ad9296f00e29e1adbbfe27bdc2432e7c3b681f07821f312c3db7770e
        size: 104331768
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: rayburst-wrapper
      - type: file
        path: dev.aninsomniacy.rayburst.desktop
      - type: file
        path: dev.aninsomniacy.rayburst.metainfo.xml
      - type: file
        path: dev.aninsomniacy.rayburst.png
