id: dev.aninsomniacy.rayburst
name: Rayburst
summary: Download manager for HTTP, FTP, BitTorrent, ED2K and HLS/DASH media
website: https://rayburst.pages.dev
source_url: https://github.com/AnInsomniacy/rayburst
build:
  manifest: dev.aninsomniacy.rayburst.yml
  branch: stable
  mode: extra-data
catalog:
  category: Network
  # Same maintainer, same project, approval given under its former name — see the
  # row in docs/reference/upstream-approvals.md.
  upstream_approved: true
  tags:
    - Download
    - FileTransfer
    - BitTorrent
    - aria2
    - Tauri
    # Upstream's former name, kept so users looking for Motrix Next still
    # find it now that com.motrix.next is de-listed.
    - MotrixNext
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
