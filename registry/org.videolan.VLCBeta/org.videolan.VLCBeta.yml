# PPA Ubuntu 26.10 daily builds, unmodified, with their Qt 6.11 support libraries.
# The KDE 6.11 runtime's glibc 2.42 cannot load this libvlccore (GLIBC_2.43).
# freedesktop 26.08 supplies glibc 2.44 and the FFmpeg 8 ABI used by the PPA.
id: org.videolan.VLCBeta
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: vlc-beta
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Network streams and media discovery.
  - --share=network
  # Qt display backends and accelerated video output.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Native PipeWire audio playback, with PulseAudio available as a fallback.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
  # Default local media folders, read-only. Other folders are opt-in.
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-videos:ro
  # Desktop media controls and file-launch single-instance requests.
  - --own-name=org.mpris.MediaPlayer2.vlc
  - --own-name=org.mpris.MediaPlayer2.vlc.*
modules:
  - name: vlc-beta
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 vlc-beta-wrapper /app/bin/vlc-beta
      - install -Dm644 org.videolan.VLCBeta.desktop /app/share/applications/org.videolan.VLCBeta.desktop
      - install -Dm644 org.videolan.VLCBeta.metainfo.xml /app/share/metainfo/org.videolan.VLCBeta.metainfo.xml
      - install -Dm644 org.videolan.VLCBeta.png /app/share/icons/hicolor/256x256/apps/org.videolan.VLCBeta.png
