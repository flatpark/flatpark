# Community source-built release tree; exact pins are filled by update-pins.mjs.
id: org.videolan.VLCBeta
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: vlc-beta
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Local streams and network media URLs.
  - --share=network
  # Qt Wayland/X11 display and video rendering.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio output through the desktop PulseAudio-compatible service.
  - --socket=pulseaudio
  # Default media directories; other folders remain opt-in or portal-mediated.
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-videos:ro
  # VLC's actual MPRIS names, including multiple instances.
  - --own-name=org.mpris.MediaPlayer2.vlc
  - --own-name=org.mpris.MediaPlayer2.vlc.*
modules:
  - name: vlc-beta
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 vlc-beta-wrapper /app/bin/vlc-beta
      - install -Dm644 org.videolan.VLCBeta.desktop /app/share/applications/org.videolan.VLCBeta.desktop
      - install -Dm644 org.videolan.VLCBeta.metainfo.xml /app/share/metainfo/org.videolan.VLCBeta.metainfo.xml
      - install -Dm644 org.videolan.VLCBeta.png /app/share/icons/hicolor/256x256/apps/org.videolan.VLCBeta.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: vlc.tar.zst
        only-arches:
          - x86_64
        url: https://github.com/jing2uo/vlc-nightly-release/releases/download/4.0.0-dev-39767-gc13b3f29cd-r5-qt3d7ce1c6d4d40059/vlc-4.0.0-dev-39767-gc13b3f29cd-r5-qt3d7ce1c6d4d40059-x86_64.tar.zst
        sha256: b9cdaff0d5cf2ea0b415581b5499e437d79a163dd67cddf7a866f002a3427970
        size: 47182570
      - type: extra-data
        filename: vlc.tar.zst
        only-arches:
          - aarch64
        url: https://github.com/jing2uo/vlc-nightly-release/releases/download/4.0.0-dev-39767-gc13b3f29cd-r5-qt3d7ce1c6d4d40059/vlc-4.0.0-dev-39767-gc13b3f29cd-r5-qt3d7ce1c6d4d40059-aarch64.tar.zst
        sha256: 33a4b8d7fda1ee65e60d1bef959c14bfb2c3d570628d3b9d47a6f21740862db3
        size: 45925949
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: vlc-beta-wrapper
      - type: file
        path: org.videolan.VLCBeta.desktop
      - type: file
        path: org.videolan.VLCBeta.metainfo.xml
      - type: file
        path: org.videolan.VLCBeta.png
