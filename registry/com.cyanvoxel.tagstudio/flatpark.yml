id: com.cyanvoxel.tagstudio
name: TagStudio
summary: Organize photos and files with tags and custom metadata
website: https://docs.tagstud.io/
source_url: https://github.com/TagStudioDev/TagStudio
build:
  manifest: com.cyanvoxel.tagstudio.yml
  branch: stable
  mode: extra-data
  arches: [x86_64]
catalog:
  category: Graphics
  tags: [Photos, Files, Tags, Metadata]
  upstream_approved: false
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
