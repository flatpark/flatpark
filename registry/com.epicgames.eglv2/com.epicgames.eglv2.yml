id: com.epicgames.eglv2
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: epic-games-launcher
separate-locales: false
build-options:
  no-debuginfo: true
# The app id is the launcher's own Tauri identifier, com.epicgames.eglv2.
# Since 0.111.0 Epic ships Linux only as a .deb (the AppImage, which bundled
# its own GTK and WebKit, is gone, #980). The .deb's binary links against the
# system's WebKitGTK 4.1, GTK 3 and libsoup 3, all in org.gnome.Platform, and
# carries only the EOS SDK beside it. GNOME 51 is built on freedesktop 26.08,
# so the 26.08 i386 extensions below still match. Windows games run through GE-Proton, which
# the launcher downloads into its data dir the first time one is launched
# (pinned by SHA-512 in Epic's linux-manifest.txt); Proton's 32-bit half needs
# the i386 compat extensions below.
finish-args:
  - --share=ipc
  # Store, downloads, sign-in, Epic Online Services.
  - --share=network
  # Proton games draw through Wine's X11 driver, so X11 is always needed; the
  # launcher window itself can use Wayland where there is one.
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  # Where games are installed: the launcher's default install directory is
  # ~/Games. Without the grant it would write them into the sandbox's
  # throwaway home and lose them on exit. Other locations are an override
  # documented in the metainfo.
  - --filesystem=~/Games:create
  # GPU, game controllers and other input devices the games read directly.
  - --device=all
  # Proton runs 32-bit Windows code and 32-bit Linux libraries.
  - --allow=multiarch
  # Tray icon (libayatana-appindicator from the ayatana-stack module). The
  # vendored Tauri tray-icon writes the icon PNG to $XDG_RUNTIME_DIR/tray-icon
  # and hands the tray host that path; the grant makes it the same directory
  # outside the sandbox, or the host draws a placeholder.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
  - --talk-name=org.freedesktop.Notifications
  # The sign-in token is kept in the desktop keyring.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.kde.kwalletd5
add-extensions:
  # 32-bit runtime libraries and GL drivers for Proton.
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: "26.08"
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: "1.4"
    versions: 26.08;1.4
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;OpenCL/vendors;lib/dri;lib/d3d;vulkan/explicit_layer.d;vulkan/implicit_layer.d
    download-if: active-gl-driver
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver
modules:
  # The launcher's Tauri tray-icon dlopen-s libayatana-appindicator3.so.1 and
  # the GNOME runtime does not ship it. Prebuilt ayatana tray stack from
  # https://github.com/flatpark/prebuilt, built against org.gnome.Sdk//51.
  - name: ayatana-stack
    buildsystem: simple
    build-commands:
      - cp -a ./. /app/
    sources:
      - type: archive
        url: https://github.com/flatpark/prebuilt/releases/download/ayatana-v2/ayatana-stack-ayatana-v2-gnome-51-x86_64.tar.xz
        sha256: 1051a537f22d335eb79557b8c5a610a12c326712dac74032de8e76e78b876fdc
  - name: epic-games-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 epic-games-launcher-wrapper /app/bin/epic-games-launcher
      - install -Dm644 com.epicgames.eglv2.desktop /app/share/applications/com.epicgames.eglv2.desktop
      - install -Dm644 com.epicgames.eglv2.metainfo.xml /app/share/metainfo/com.epicgames.eglv2.metainfo.xml
      - install -Dm644 com.epicgames.eglv2.png /app/share/icons/hicolor/256x256/apps/com.epicgames.eglv2.png
      # Mount points for the i386 extensions, and the loader path to them.
      - mkdir -p /app/lib/i386-linux-gnu/GL
      - install -Dm644 ld.so.conf /app/etc/ld.so.conf
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: epic.deb
        only-arches:
          - x86_64
        url: https://content-download-egs.distro.on.epicgames.com/Builds/EGLv2/0.113.1%2Bg311e678/Linux/EpicGamesLauncher-x86_64.deb
        sha256: 637283be11eaefab644917abd16b70c48aed8527c05629062c8882fcd30cea43
        size: 87807714
      # END MANAGED EXTRA-DATA
      - type: file
        path: ld.so.conf
      - type: file
        path: apply_extra.sh
      - type: file
        path: epic-games-launcher-wrapper
      - type: file
        path: com.epicgames.eglv2.desktop
      - type: file
        path: com.epicgames.eglv2.metainfo.xml
      - type: file
        path: com.epicgames.eglv2.png
