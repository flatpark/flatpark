id: com.analog.LTspice
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
# Wine is org.winehq.Wine as the user installed it from Flathub, not bundled
# (flatpark.yml requires it; the launcher says how to install it when it is
# missing). The launcher is cellar's static CLI: it builds the user's Wine
# prefix from /app/share/cellar/cellar.toml, runs the vendor's installer there
# on first launch (and again when the package brings a newer one), then starts
# LTspice.
command: cellar
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  - --share=ipc
  # Model library downloads and the vendor updater.
  - --share=network
  # Wine draws through its X11 driver (XWayland on Wayland desktops).
  - --socket=x11
  - --device=dri
  # Circuit schematics, models and simulation output. cellar.toml shows the
  # accessible home folders as H:. Desktop-opened files use the document portal.
  - --filesystem=xdg-documents
  # New-WoW64 Wine runs 32-bit Windows code with no 32-bit Linux libraries, but
  # Flatpak's default seccomp filter still kills it without this.
  - --allow=multiarch
  # org.winehq.Wine where flatpak installs it, per user and system-wide: the
  # Wine cellar runs. An app, so it can't be mounted as an extension.
  - --filesystem=~/.local/share/flatpak/app/org.winehq.Wine:ro
  - --filesystem=/var/lib/flatpak/app/org.winehq.Wine:ro
modules:
  - name: ltspice
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - ln -s /app/extra/cellar /app/bin/cellar
      - install -Dm644 cellar.toml /app/share/cellar/cellar.toml
      - install -Dm644 com.analog.LTspice.desktop /app/share/applications/com.analog.LTspice.desktop
      - install -Dm644 com.analog.LTspice.metainfo.xml /app/share/metainfo/com.analog.LTspice.metainfo.xml
      - install -Dm644 com.analog.LTspice.png /app/share/icons/hicolor/256x256/apps/com.analog.LTspice.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: LTspice64.msi
        only-arches:
          - x86_64
        url: https://ltspice.analog.com/software/LTspice64.msi
        sha256: f22163f15420e43a2d5c66440e038ef031a9f019a181f396b95edcef5eebc357
        size: 144698880
      # END MANAGED EXTRA-DATA
      # cellar's static CLI (github.com/jing2uo/cellar), the launcher shared by
      # FlatPark's Wine packages. Pinned by hand, outside the managed block.
      - type: extra-data
        filename: cellar-cli-x86_64
        only-arches:
          - x86_64
        url: https://github.com/jing2uo/cellar/releases/download/v0.5.1/cellar-cli-x86_64
        sha256: bddea0982c458ababdac841c5b9c7685fd782cc9979dbd01c1f1ac7a36b2b9cb
        size: 9691296
      - type: file
        path: apply_extra.sh
      - type: file
        path: cellar.toml
      - type: file
        path: com.analog.LTspice.desktop
      - type: file
        path: com.analog.LTspice.metainfo.xml
      - type: file
        path: com.analog.LTspice.png
