id: org.audacityteam.Audacity
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: audacity
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Audacity forces the xcb platform itself and ignores QT_QPA_PLATFORM; only
  # AU_QT_QPA_PLATFORM=wayland switches it, so Wayland is an override (metainfo).
  - --socket=x11
  - --share=ipc
  # Qt Quick renders the editor with OpenGL.
  - --device=dri
  # Playback and recording through the desktop audio server.
  - --socket=pulseaudio
  # Default projects use Documents/Audacity4; audio files also use Music.
  - --filesystem=xdg-documents
  - --filesystem=xdg-music
modules:
  - name: audacity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 audacity-wrapper /app/bin/audacity
      - install -Dm644 org.audacityteam.Audacity.desktop /app/share/applications/org.audacityteam.Audacity.desktop
      # The AppImage's own MIME file lives in extra-data, which Flatpak never exports.
      - install -Dm644 org.audacityteam.Audacity.mime.xml /app/share/mime/packages/org.audacityteam.Audacity.xml
      - install -Dm644 org.audacityteam.Audacity.metainfo.xml /app/share/metainfo/org.audacityteam.Audacity.metainfo.xml
      - install -Dm644 org.audacityteam.Audacity.png /app/share/icons/hicolor/128x128/apps/org.audacityteam.Audacity.png
    sources:
      # Extraction tools must be extra-data: apply_extra cannot see /app/bin
      # during system-wide installation. This pin stays outside the app updates.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches: [x86_64]
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: audacity.AppImage
        only-arches: [x86_64]
        url: https://github.com/audacity/audacity/releases/download/Audacity-4.0.1/audacity-linux-4.0.1-x86_64.AppImage
        sha256: ca2f04f172124d1f18ac608749854c5d31f04ab266a758c348190c05d9b2087c
        size: 73755128
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: audacity-wrapper
      - type: file
        path: org.audacityteam.Audacity.desktop
      - type: file
        path: org.audacityteam.Audacity.mime.xml
      - type: file
        path: org.audacityteam.Audacity.metainfo.xml
      - type: file
        path: org.audacityteam.Audacity.png
