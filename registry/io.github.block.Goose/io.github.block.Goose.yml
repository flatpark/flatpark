id: io.github.block.Goose
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
# Electron app: use the Electron base app, which ships zypak. zypak redirects
# Chromium's SUID sandbox onto the Flatpak sandbox, so the app keeps an internal
# sandbox (the wrapper runs it via zypak-wrapper) instead of --no-sandbox. The
# base is a prebuilt ref merged into the app at build time; the app stays
# self-contained.
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: goose
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Electron (Chromium) agent desktop. The prebuilt build bundles Chromium, its
  # own ffmpeg/ANGLE/Vulkan, the goose CLI and its MCP shims; the GTK3, NSS,
  # CUPS, ATK, ALSA, dbus, gbm and X11 stacks it links come from
  # org.freedesktop.Platform 25.08 — verified against the binary's NEEDED set,
  # 0 missing.
  - --share=ipc
  # Talks to the model providers over HTTPS, to a local Ollama over the loopback
  # interface, and fetches the MCP toolchain and extensions on first use.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # GPU-accelerated Chromium compositing.
  - --device=dri
  # Desktop notifications when a long-running agent session needs attention or
  # finishes.
  - --talk-name=org.freedesktop.Notifications
  # Store provider API keys in the keyring through the Secret Service when one
  # is present.
  - --talk-name=org.freedesktop.secrets
  # Strip a leaked ELECTRON_RUN_AS_NODE from the sandbox env so the binary — and
  # zypak's spawned child/zygote processes, which the wrapper's own `unset`
  # can't reach — always start as the GUI app rather than as plain Node.
  - --unset-env=ELECTRON_RUN_AS_NODE
  # MCP extensions start through the app's bundled node/npx/uvx shims, which
  # provision their toolchain with hermit, and hermit clones its package
  # registry with git. The runtime ships none, so /app/lib/goose carries a `git`
  # that reaches the user's own installation on the host. That costs the Flatpak
  # portal name below: commands this app runs can leave the sandbox. It is
  # declared in flatpark.yml under policy.dangerous_permissions and spelled out
  # in the metainfo. Same shape as com.openai.ChatGPT.
  - --talk-name=org.freedesktop.Flatpak
  # The shims resolve their config directory as $HOME/.config/goose — under
  # $HOME rather than under the XDG base directories Flatpak redirects, and
  # $HOME here is a tmpfs, so the provisioned toolchain would otherwise be
  # discarded at every exit. It is granted as a real host directory rather than
  # persisted privately for a second reason: the git above runs on the host and
  # writes to the paths hermit names, so the path the sandbox sees and the path
  # the host writes to have to be the same one. :create keeps a fresh install
  # working before the directory exists.
  - --filesystem=~/.config/goose:create
  # No other filesystem grant. The agent's own file and shell tools act inside
  # the sandbox; letting them work on a real directory is an explicit opt-in,
  # and the metainfo carries the exact `flatpak override` commands.
modules:
  - name: goose
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 goose-wrapper /app/bin/goose
      - install -Dm755 goose-git-shim /app/lib/goose/git
      - install -Dm644 io.github.block.Goose.desktop /app/share/applications/io.github.block.Goose.desktop
      - install -Dm644 io.github.block.Goose.metainfo.xml /app/share/metainfo/io.github.block.Goose.metainfo.xml
      - install -Dm644 io.github.block.Goose.png /app/share/icons/hicolor/512x512/apps/io.github.block.Goose.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: goose.deb
        only-arches:
          - x86_64
        url: https://github.com/aaif-goose/goose/releases/download/v1.47.0/goose_1.47.0_amd64.deb
        sha256: da7d91f376e962a0ed9284ddd6708961605b8315cf3eb496cf77dfcc6a8579cd
        size: 172653646
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: goose-wrapper
      - type: file
        path: goose-git-shim
      - type: file
        path: io.github.block.Goose.desktop
      - type: file
        path: io.github.block.Goose.metainfo.xml
      - type: file
        path: io.github.block.Goose.png
