id: com.surrealdb.Studio
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
# Electron app: use the Electron base app, which ships zypak. zypak redirects
# Chromium's SUID sandbox onto the Flatpak sandbox, so the app keeps an internal
# sandbox (the wrapper runs it via zypak-wrapper) instead of --no-sandbox.
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: surrealdb-studio
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Electron client for SurrealDB (the successor to Surrealist). The prebuilt
  # build bundles Chromium plus its own ffmpeg/ANGLE/SwiftShader; the GTK3, NSS,
  # ALSA, dbus, gbm and X11 stacks it links come from the runtime.
  - --share=ipc
  # Connects to local and remote SurrealDB instances and SurrealDB Cloud.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # No filesystem grant: connections and saved queries stay in the private
  # per-app directory, and files go through the file chooser portal. The local
  # database runner starts the `surreal` CLI, which is not part of the package;
  # granting ~/.surrealdb read-only, where SurrealDB's installer puts it and
  # which the runner already searches, is an opt-in override in the metainfo.
  # Strip a leaked ELECTRON_RUN_AS_NODE from the sandbox env so the binary — and
  # zypak's spawned child/zygote processes, which the wrapper's own `unset`
  # cannot reach — always start as the GUI app rather than as plain Node.
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: surrealdb-studio
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 surrealdb-studio-wrapper /app/bin/surrealdb-studio
      - install -Dm644 com.surrealdb.Studio.desktop /app/share/applications/com.surrealdb.Studio.desktop
      - install -Dm644 com.surrealdb.Studio.metainfo.xml /app/share/metainfo/com.surrealdb.Studio.metainfo.xml
      - install -Dm644 com.surrealdb.Studio.svg /app/share/icons/hicolor/scalable/apps/com.surrealdb.Studio.svg
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: app.deb
        only-arches:
          - x86_64
        url: https://download.surrealdb.com/studio/v1.12.1/surrealdb-studio_1.12.1_amd64.deb
        sha256: d1a0bc0641cabf008e3fcb0a99b0b7f887a027c6896efcf4a3357d7e5b2dc8d6
        size: 109313520
      - type: extra-data
        filename: app.deb
        only-arches:
          - aarch64
        url: https://download.surrealdb.com/studio/v1.12.1/surrealdb-studio_1.12.1_arm64.deb
        sha256: 54b9b719a43cfddfa4174d876913aa35bdc377767303dce55c4308d3a1b63c4b
        size: 104196964
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: surrealdb-studio-wrapper
      - type: file
        path: com.surrealdb.Studio.desktop
      - type: file
        path: com.surrealdb.Studio.metainfo.xml
      - type: file
        path: com.surrealdb.Studio.svg
