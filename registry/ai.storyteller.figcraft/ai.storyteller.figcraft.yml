id: ai.storyteller.figcraft
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: figcraft
separate-locales: false
build-options:
  no-debuginfo: true
# The app id, runtime and finish-args follow upstream's own Flatpak manifest
# (packaging/linux/flatpak/ in storytold/figcraft), so this package and the
# single-file bundle upstream attaches to each release are the same
# application. The binaries need only glibc from the runtime.
finish-args:
  # Native Rust/egui app on winit; libwayland, libX11/xcb, xkbcommon and the
  # Vulkan/EGL loaders are dlopen()ed from the runtime.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM) for the X11 fallback.
  - --share=ipc
  # wgpu GPU compositor (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save go through the file-chooser portal. Pictures and Documents are
  # granted so files passed by path (command line, Open Recent, saving next to
  # the original) keep working there.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  # Deliberately not granted, as upstream:
  #   --share=network          -> online and local-network sharing (live
  #                               sessions) and the --control automation
  #                               server; the metainfo documents the override
  #   --filesystem=home / host -> everything else goes through the portals
modules:
  - name: figcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 figcraft-wrapper /app/bin/figcraft
      - install -Dm755 figcraft-cli-wrapper /app/bin/figcraft-cli
      - install -Dm644 ai.storyteller.figcraft.desktop /app/share/applications/ai.storyteller.figcraft.desktop
      - install -Dm644 ai.storyteller.figcraft.metainfo.xml /app/share/metainfo/ai.storyteller.figcraft.metainfo.xml
      - install -Dm644 ai.storyteller.figcraft.mime.xml /app/share/mime/packages/ai.storyteller.figcraft.xml
      - install -Dm644 ai.storyteller.figcraft.png /app/share/icons/hicolor/512x512/apps/ai.storyteller.figcraft.png
    sources:
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: figcraft.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/storytold/figcraft/releases/download/v0.13.1/figcraft-0.13.1-linux-x86_64.tar.gz
        sha256: 865cf29c75a737cd859d93fa48e9d4aa8dc6023f258aa127e88b97d887f90d27
        size: 101537246
      - type: extra-data
        filename: figcraft.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/storytold/figcraft/releases/download/v0.13.1/figcraft-0.13.1-linux-aarch64.tar.gz
        sha256: 14c6a5a782b5eebb356a232d9ea5a5a013f19c92c4f37056efbbfcecdbd0d935
        size: 98017980
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: figcraft-wrapper
      - type: file
        path: figcraft-cli-wrapper
      - type: file
        path: ai.storyteller.figcraft.desktop
      - type: file
        path: ai.storyteller.figcraft.metainfo.xml
      - type: file
        path: ai.storyteller.figcraft.mime.xml
      - type: file
        path: ai.storyteller.figcraft.png
