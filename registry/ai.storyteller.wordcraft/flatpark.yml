id: ai.storyteller.wordcraft
name: WordCraft
summary: Open-source word processor in the Word mould
website: https://getartcraft.com/apps/wordcraft
source_url: https://github.com/storytold/wordcraft
build:
  manifest: ai.storyteller.wordcraft.yml
  branch: stable
  mode: extra-data
  arches: [x86_64, aarch64]
catalog:
  category: Office
  tags:
    - WordProcessor
    - Office
    - Rust
update:
  command: ./resolve-update.sh
policy:
  proprietary: false
  dangerous_permissions: []
# The update sweep fetches this file from source_url's default branch and opens
# an issue when its finish-args or modules differ. It does not edit this package.
upstream:
  manifest: packaging/linux/flatpak/ai.storyteller.wordcraft.yml
  accept_missing_permissions:
    # Update checks and the --control server stay opt-in. The metainfo documents
    # the override. A local CUPS queue does not need the network.
    - --share=network
    # The ArtCraft launcher reads version pins from here. This package does not
    # ship that launcher.
    - --filesystem=xdg-data/ArtCraft/versions:ro
    # Upstream's shared updater inspects and updates its own installation through
    # flatpak-spawn --host, which is a full sandbox escape. FlatPark ships updates
    # from its own repository, so that updater has nothing to do here.
    - --talk-name=org.freedesktop.Flatpak
