id: io.github.shadstoneofficial.BobWallet
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: bob-wallet
separate-locales: false
build-options:
  no-debuginfo: true
finish-args:
  # Desktop display and graphics.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Handshake node and wallet services.
  - --share=network
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: bob-wallet
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm755 bob-wallet-wrapper /app/bin/bob-wallet
      - install -Dm644 io.github.shadstoneofficial.BobWallet.desktop /app/share/applications/io.github.shadstoneofficial.BobWallet.desktop
      - install -Dm644 io.github.shadstoneofficial.BobWallet.metainfo.xml /app/share/metainfo/io.github.shadstoneofficial.BobWallet.metainfo.xml
      - install -Dm644 io.github.shadstoneofficial.BobWallet.png /app/share/icons/hicolor/512x512/apps/io.github.shadstoneofficial.BobWallet.png
    sources:
      # Extractor is available during system-wide extra-data installation.
      - type: extra-data
        filename: appimage-tools.tar.xz
        only-arches: [x86_64]
        url: https://github.com/flatpark/prebuilt/releases/download/appimage-tools-v2/appimage-tools-appimage-tools-v2-fd-26.08-x86_64.tar.xz
        sha256: 01ff0b363031060c3d9877bc61b026a1a7422308fd9e5cfda53cc24971b12304
        size: 57220
      # BEGIN MANAGED EXTRA-DATA
      - type: extra-data
        filename: bob.AppImage
        only-arches: [x86_64]
        url: https://github.com/shadstoneofficial/bob-wallet/releases/download/v2.3.21/Bob.LearnHNS-2.3.21.AppImage
        sha256: 6f257de4045d82b1107e1cb817cdc0fe1593693c313748771be77bf60a372737
        size: 175019846
      # END MANAGED EXTRA-DATA
      - type: file
        path: apply_extra.sh
      - type: file
        path: bob-wallet-wrapper
      - type: file
        path: io.github.shadstoneofficial.BobWallet.desktop
      - type: file
        path: io.github.shadstoneofficial.BobWallet.metainfo.xml
      - type: file
        path: io.github.shadstoneofficial.BobWallet.png
