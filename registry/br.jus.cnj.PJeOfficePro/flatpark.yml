id: br.jus.cnj.PJeOfficePro
name: PJeOffice Pro
summary: Digital signer for the Brazilian PJe judicial system
website: https://pjeoffice.trf3.jus.br/pjeoffice-pro/
build:
  manifest: br.jus.cnj.PJeOfficePro.yml
  branch: stable
  mode: extra-data
catalog:
  category: Office
  upstream_approved: false
  tags:
    - Brazil
    - PJe
    - DigitalSignature
    - ICP-Brasil
    - Legal
update:
  command: ./resolve-update.sh
policy:
  proprietary: true
  extra_data_first: true

# What this package does around the vendor's build; shown on the site as the
# packaging level. See docs/packaging-playbook.md (golden rule 1).
packaging:
  - kind: injected-code
    detail:
      en: "A small PKCS#11 module, which PJeOffice Pro loads through its own PKCS11_DRIVER setting, passes A3 token calls to the host's p11-kit, so the token driver runs on the host."
      zh-Hans: "一个小型 PKCS#11 模块，由 PJeOffice Pro 通过它自己的 PKCS11_DRIVER 设置加载，把 A3 令牌的调用转给宿主的 p11-kit，令牌驱动在宿主上运行。"
