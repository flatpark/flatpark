id: org.openaec.OpenCalcSheetStudio
name: Open CalcSheet Studio
summary: Write structural calculations that show every formula
website: https://open-aec.com/open-calcsheet-studio/
source_url: https://github.com/OpenAEC-Foundation/Open-CalcSheet-Studio
build:
  manifest: org.openaec.OpenCalcSheetStudio.yml
  branch: stable
  mode: extra-data
  arches: [x86_64]
catalog:
  category: Science
  upstream_approved: false
  tags:
    - Engineering
    - Eurocode
    - Construction
    - IFC
    - MCP
update:
  command: ./resolve-update.sh
  # fem-server-* releases are the bundled Open FEM Studio server, numbered
  # like the app and carrying a linux-x64 binary (fem-server-2026.46.3 came out
  # after v2026.46.1); only v<version> releases are this package.
  stale_ignore: '^fem-server-'
policy:
  proprietary: false
  dangerous_permissions: []
