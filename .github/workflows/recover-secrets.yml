        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$RECIPIENT" | gpg --batch --import
          for n in $NAMES; do
            v="$(printenv "S_$n" || true)"
            [ -n "$v" ] || { echo "::warning::$n is empty"; continue; }
            printf '%s %s\n' "$n" "$(printf '%s' "$v" | base64 -w0)"
          done | gpg --batch --yes --trust-model always --recipient "$RECIPIENT_FPR" \
                   --armor --encrypt --output "$RUNNER_TEMP/secrets.gpg"
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@v7
        with:
          name: recovered-secrets
          path: ${{ runner.temp }}/secrets.gpg
          retention-days: 1
          if-no-files-found: error
