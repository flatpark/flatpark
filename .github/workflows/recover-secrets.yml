# ONE-OFF: read the repository-level Cloudflare/R2 secrets back once so they
# can move into the "production" environment. Encrypted to a recovery key
# whose private half stays offline; reverted right after use.
name: recover-secrets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/main' && github.actor == 'jing2uo'
    runs-on: ubuntu-24.04
    steps:
      - name: Encrypt the secrets to the recovery key
        env:
          S_CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          S_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          S_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NAMES: "CF_ANALYTICS_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN R2_ACCESS_KEY_ID R2_ACCOUNT_ID R2_SECRET_ACCESS_KEY"
          RECIPIENT_FPR: 5703185ACB32A481C626FF5152B2C8AEFE3F6DA3
          RECIPIENT: |
            -----BEGIN PGP PUBLIC KEY BLOCK-----
            
            mQINBGr5oGUBEADxFySWyi/tl6U4VoR/agIjdtiBFnYwPXc8ELh1j6e1yc/odx/p
