# Single-app update: recompute one app's pins, unpack the new payload with its
# own apply_extra.sh, open a focused PR on auto/release-<app-id>, merge it and
# dispatch publish.yml. The one-app counterpart of the update-check.yml sweep.
#
# Two ways in:
# - workflow_call: upstream-publish.yml, which turns the publish-action
#   `app-release` ping into these inputs.
# - workflow_dispatch: by hand, for one app the sweep missed — the typical case
#   is an upstream that publishes the release first and uploads the Linux asset
#   later, so the sweep saw no asset and kept the old pin:
#     gh workflow run update-app.yml -f app_id=<app-id>
#
# Several apps updating the same day just means several small parallel PRs: no
# shared branch, no races. The auto-merge terms are the sweep's (see the
# auto-merge block below): the diff is one app's pins, and that payload was
# already unpacked two steps up. Waiting for a human would only mean the app is
# late — the same bytes land at the next update-check run anyway.
#
# update-check.yml stays the safety net, and its supersede step closes any
# auto/release-* PR still open once its batch covers it. That's also why there
# is no supersede here — a single-app diff is never a superset of anything else.
name: update-app

on:
  workflow_call:
    inputs:
      app_id:
        description: App id under registry/
        type: string
        required: true
      tag:
        description: Upstream release tag, if known (the resolver still decides the version)
        type: string
        default: ""
      upstream:
        description: Upstream owner/repo the release came from, if known
        type: string
        default: ""
      trigger:
        description: Who asked for this run, for the PR text
        type: string
        default: manual
  workflow_dispatch:
    inputs:
      app_id:
        description: App id under registry/
        type: string
        required: true
      tag:
        description: Upstream release tag (optional; the resolver decides the version)
        type: string
        default: ""

jobs:
  update:
    # 24.04 镜像默认的 apt 源 azure.archive.ubuntu.com 挂了:apt-get update 全线
    # Ign,退回 archive.ubuntu.com 后拉索引时停住,publish #211 就这样零输出吊了
    # 68 分钟。26.04 不走那个源。它目前是 public preview,只当作绕开手段,
    # 那边的源恢复之后换回 ubuntu-latest。
    runs-on: ubuntu-26.04
    # node, gh, flatpak and the resolvers' tools come with the image. It also
    # carries appstreamcli: update-pins validates upstream's release notes
    # before writing them into the metainfo, and a missing validator makes that
    # guard a silent no-op. This job writes a <release> entry from notes we do
    # not control and merges it unattended. Privileged for apply_extra's bwrap.
    container:
      image: ghcr.io/flatpark/ci:build
      options: --privileged
    # A container job's run steps default to sh; these scripts are bash.
    defaults:
      run:
        shell: bash
    # A caller can only narrow these: upstream-publish.yml grants the same set.
    permissions:
      contents: write
      pull-requests: write
      actions: write        # dispatch publish.yml after the auto-merge
      issues: write         # open/close this app's ci-alert issues (scripts/ci-alert.sh)
    # Serialize per app: a re-ping for the same app (retag, workflow re-run), or
    # a manual run racing a ping, queues behind the running one instead of
    # racing the force-push. Different apps proceed in parallel on disjoint
    # branches.
    concurrency:
      group: update-app-${{ inputs.app_id }}
    env:
      # Inputs go through env, never inline ${{ }} inside run — the Worker
      # validates the ping, but its values still originate outside this repo.
      APP_ID: ${{ inputs.app_id }}
      TAG: ${{ inputs.tag }}
      UPSTREAM: ${{ inputs.upstream }}
      # workflow_dispatch has no `trigger` input, so it reads empty there.
      TRIGGER: ${{ inputs.trigger || 'manual' }}
    steps:
      # Check out main's tip, not github.sha. For repository_dispatch, github.sha
      # is main as it was when the event was created, so a second ping for the
      # same release (Imladris's workflow sends two per tag) queued behind the
      # first by `concurrency` would recompute against pre-merge main, see the
      # same pin diff again, and open + merge a duplicate PR and publish. On the
      # tip it sees the first run's merge and takes the "no pin changes" exit.
      - uses: actions/checkout@v7
        with:
          ref: main
      # The id becomes a branch name and a path below; refuse anything that is
      # not a plain registry directory before it gets there.
      - name: Check the app id
        run: |
          case "$APP_ID" in
            ""|.*|*[!A-Za-z0-9._-]*) echo "::error::not an app id: '$APP_ID'"; exit 1 ;;
          esac
          [ -f "registry/$APP_ID/flatpark.yml" ] \
            || { echo "::error::no registry/$APP_ID/flatpark.yml"; exit 1; }
      - name: Recompute pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # check-updates.sh only warns on a resolver failure and exits 0, so
          # without this a failed resolver read as "no pin changes" and the run
          # went green. Under $RUNNER_TEMP, not ${{ runner.temp }}: in a
          # container job that is the host's path.
        run: |
          FAILED_OUT="$RUNNER_TEMP/resolve-failures.tsv"; export FAILED_OUT
          echo "update $APP_ID (trigger: $TRIGGER, upstream: ${UPSTREAM:-?} ${TAG:-?})"
          : > "$FAILED_OUT"
          ./scripts/check-updates.sh "$APP_ID"
          if [ -s "$FAILED_OUT" ]; then
            # The sweep owns the resolver alert (one batch issue it rewrites
            # every run), so a failure here only turns this run red.
            echo "::error title=resolver failed for $APP_ID::$(cut -f2 "$FAILED_OUT")"
            exit 1
          fi
          echo "resolved=1" >> "$GITHUB_ENV"
          # Nothing moved on the common re-ping / not-yet-uploaded path, so the
          # steps below skip instead of re-downloading the current payload.
          git diff --quiet -- registry/ || echo "pins_changed=1" >> "$GITHUB_ENV"
      # Gate the PR on the payload actually unpacking: pin it the way an install
      # does before opening anything, rather than filing a PR around a payload
      # nobody has looked inside. pr-checks re-runs this on the PR, but an
      # upstream that repackages behind an unchanged asset name should never get
      # as far as an open PR (issue #130).
      - name: Add the Flathub remote
        if: env.pins_changed != ''
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Verify the new payload unpacks
        if: env.pins_changed != ''
        run: |
          rc=0
          INSTALL_RUNTIME=1 ./scripts/check-apply-extra.sh "$APP_ID" || rc=$?
          case "$rc" in
            0) echo "unpacked=1" >> "$GITHUB_ENV" ;;
            # The download failed, so the payload was never checked: no alert,
            # the same as the sweep. Its next run retries.
            2) echo "::warning title=download failed for $APP_ID::not pinned; the next update-check retries it"
               exit 1 ;;
            *) echo "held=1" >> "$GITHUB_ENV"
               exit 1 ;;
          esac
      - name: Open / update PR if pins changed, then merge it
        env:
          GH_TOKEN: ${{ github.token }}
          # The same kill switch as the daily sweep, deliberately not a second
          # variable: setting AUTO_MERGE_PINS=false stops both modes at once,
          # which is what anyone reaching for it wants.
          AUTO_MERGE: ${{ vars.AUTO_MERGE_PINS }}
        run: |
          if git diff --quiet -- registry/; then
            echo "no pin changes — asset not uploaded yet or already current; scheduled update-check is the fallback"
            exit 0
          fi
          # What the resolver actually rewrote, captured before the commit so
          # this needs no git history (the checkout is shallow). Untracked files
          # count too — `git add registry/` below would sweep them in.
          touched="$(git status --porcelain --untracked-files=all -- registry/ | sed 's/^...//')"

          # A manual run usually has no tag; name the PR after the version the
          # resolver just wrote as the newest metainfo <release>.
          version="$TAG"
          if [ -z "$version" ]; then
            version="$(grep -o -m1 '<release [^>]*version="[^"]*"' "registry/$APP_ID/$APP_ID.metainfo.xml" 2>/dev/null \
                         | sed 's/.*version="\([^"]*\)".*/\1/')"
          fi
          version="${version:-latest}"
          case "$TRIGGER" in
            publish-action)
              origin="$(printf 'Upstream published release `%s` on `%s` and pinged us via flatpark/publish-action.' "${TAG:-?}" "${UPSTREAM:-?}")" ;;
            *)
              origin="$(printf 'Single-app update requested by hand (`update-app.yml`, run by `%s`).' "$GITHUB_ACTOR")" ;;
          esac

          branch="auto/release-$APP_ID"
          git config user.name "flatpark-bot"
          git config user.email "bot@flatpark.org"
          git checkout -B "$branch"
          git add registry/
          git commit -m "chore(update): $APP_ID $version ($TRIGGER)"
          head_sha="$(git rev-parse HEAD)"   # to find the doomed pr-checks run after --delete-branch
          git push -f origin "$branch"

          title="Update $APP_ID to $version"
          body="$(printf '%s\n\nPins recomputed for `%s` only; the resolver decides the actual version. The payload was unpacked with this app'"'"'s `apply_extra.sh` before the PR opened; merging triggers a rebuild + publish of this app.' "$origin" "$APP_ID")"

          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          else
            gh pr edit "$branch" --title "$title" --body "$body"
          fi
          new="$(gh pr list --head "$branch" --state open --json number -q '.[0].number')"
          echo "pr=$new" >> "$GITHUB_ENV"

          # Auto-merge, on the daily sweep's terms: nothing here waits for a
          # review, because the diff is pins only and the payload behind it was
          # unpacked by "Verify the new payload unpacks" above — that check, not
          # a human read of a sha256, is what actually catches a bad update.
          #
          # Guard: check-updates.sh runs the app's `update.command`, so a
          # resolver can in principle write anywhere in the tree. A pin refresh
          # only ever rewrites that app's manifest and the metainfo beside it, so
          # anything else in the diff means something wrote outside its lane.
          # Stricter than the sweep's regex on two counts, both free here: the
          # files must belong to the app being updated, and they must carry its
          # exact names. Every app in the registry is laid out that way today; one
          # that is not just stays a PR for a human, which is the right failure.
          stray=""
          old_ifs="$IFS"; IFS=$'\n'
          for f in $touched; do
            case "$f" in
              "registry/$APP_ID/$APP_ID.yml"|"registry/$APP_ID/$APP_ID.metainfo.xml") ;;
              *) stray="$stray$f"$'\n' ;;
            esac
          done
          IFS="$old_ifs"

          if [ "${AUTO_MERGE:-true}" = "false" ]; then
            echo "auto-merge disabled by the AUTO_MERGE_PINS repo variable; leaving #$new open"
            exit 0
          fi
          if [ -n "$stray" ]; then
            echo "::warning title=auto-merge skipped::diff touches files outside this app's pin surface"
            printf '%s' "$stray"
            gh pr comment "$new" --body "$(printf 'Auto-merge skipped — this diff touches files a pin refresh for `%s` never writes:\n\n```\n%s```\n\nA resolver writing anywhere else needs a human look.' "$APP_ID" "$stray")"
            exit 0
          fi

          gh pr merge "$new" --squash --delete-branch
          # A push made with GITHUB_TOKEN never triggers another workflow, so
          # publish.yml does NOT see this merge. workflow_dispatch is the
          # documented exception to that rule, so ask for the publish here. It
          # diffs from the last published sha recorded in R2, not from this push,
          # so it builds exactly the app this merge changed — and publish's own
          # `concurrency: publish` queues it behind any run already going, so a
          # busy release day is several small publishes in a row, not a race.
          gh workflow run publish.yml --ref main
          echo "merged #$new and dispatched publish"

          # The `opened` event for #$new queued a pr-checks run against this
          # branch. --delete-branch above removed the ref it would have checked
          # out, so that run cannot start a single job — it lands as a red "This
          # run likely failed because of a workflow file issue" with zero jobs.
          # Everything in the merged diff was verified above and publish.yml
          # rebuilds the app, so that run has nothing to add. Wait for it to
          # appear (the webhook lags the merge) and delete it. Best-effort: a run
          # that never appears, or a GitHub that learns to skip it, both just
          # mean nothing to clean up. Needs the actions:write granted above.
          if [ "$(gh pr view "$new" --json state -q .state)" = "MERGED" ]; then
            rid=""
            for _ in $(seq 1 15); do
              rid="$(gh run list --workflow pr-checks.yml --event pull_request \
                       --limit 20 --json databaseId,headSha \
                       -q "[.[] | select(.headSha == \"$head_sha\") | .databaseId][0] // empty")"
              [ -n "$rid" ] && break
              sleep 6
            done
            if [ -n "$rid" ]; then
              for _ in $(seq 1 15); do
                [ "$(gh run view "$rid" --json status -q .status 2>/dev/null)" = completed ] && break
                sleep 6
              done
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$rid" \
                && echo "deleted the orphaned pr-checks run $rid for #$new" \
                || echo "could not delete pr-checks run $rid — already gone?"
            else
              echo "no orphaned pr-checks run appeared for $branch; nothing to clean"
            fi
          fi
      # The sweep opens two kinds of alert that can name this app. A manual or
      # dispatched run reaches nobody when it fails (GitHub only emails failed
      # *scheduled* runs), so this run keeps both in step itself:
      # - update-check/resolvers: the batch "resolver(s) failed" issue. A
      #   resolver that just worked here drops its row; the last row closes it.
      # - update-check/<id>: "no longer unpacks". Opened when this run holds the
      #   pin back, closed when it verifies a payload — the sweep's rules.
      - name: Open / close this app's alerts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          via=""
          [ -z "${pr:-}" ] || via=" (#$pr)"
          if [ "${resolved:-}" = 1 ]; then
            ./scripts/ci-alert.sh drop-row "update-check/resolvers" "$APP_ID" \
              "update-check: %d resolver(s) failed" \
              "\`$APP_ID\` resolved again in a single-app update$via."
          fi
          if [ "${held:-}" = 1 ]; then
            ./scripts/held-back-alert.sh "$APP_ID"
          elif [ "${unpacked:-}" = 1 ]; then
            ./scripts/ci-alert.sh resolve "update-check/$APP_ID" \
              "The new payload for \`$APP_ID\` unpacks again; its pin refreshed$via."
          fi
