# Destructive: reclaim R2 space. Delists apps whose registry/<id>/ is gone,
# drops extension refs their app no longer declares, prunes every ref to its
# current commit, re-signs, republishes, then
# deletes ONLY the pruned objects from R2 (prune-diff targeted delete — never a
# blind mirror). Kept separate from the additive publish; runs weekly because
# publish never deletes, so superseded versions accumulate in R2 until pruned.
name: delist-prune

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 6"   # Saturday 02:00 UTC (10:00 Beijing)

concurrency:
  group: publish   # share the publish lock so prune never races a publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    # 24.04 镜像默认的 apt 源 azure.archive.ubuntu.com 挂了:apt-get update 全线
    # Ign,退回 archive.ubuntu.com 后拉索引时停住,publish #211 就这样零输出吊了
    # 68 分钟。26.04 不走那个源。它目前是 public preview,只当作绕开手段,
    # 那边的源恢复之后换回 ubuntu-latest。
    runs-on: ubuntu-26.04
    env:
      OUT_DIR: ${{ github.workspace }}/out
      REPO_DIR: ${{ github.workspace }}/out/repo
      GNUPGHOME_DIR: ${{ github.workspace }}/.gnupg-flatpark
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      # Full history, not the default depth-1: this job rebuilds and redeploys
      # the site, and the "Recently added" order is read out of git (the commit
      # that first added registry/<id>/). A shallow clone dates every app to the
      # single grafted commit, so the homepage silently falls back to scan order.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Import signing subkey
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p "$GNUPGHOME_DIR"; chmod 700 "$GNUPGHOME_DIR"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" \
            | GNUPGHOME="$GNUPGHOME_DIR" gpg --batch --import
      - name: Pull current repo from R2
        run: |
          mkdir -p "$REPO_DIR"
          rclone copy "r2:$R2_BUCKET" "$REPO_DIR" --fast-list
      # First: refs whose commit is already gone (a de-list from an earlier run
      # whose ref file lingered in R2). They would break the prune below, and
      # the sweep truncates the reclaim-refs list the prune then appends to.
      - name: Drop dangling refs
        run: RECLAIM_REFS="$OUT_DIR/reclaim-refs.txt" ./scripts/drop-dangling-refs.sh
      - name: Delist + prune to current commit
        run: |
          export RECLAIM_LIST="$OUT_DIR/reclaim-objects.txt"
          export RECLAIM_REFS="$OUT_DIR/reclaim-refs.txt"
          ./scripts/prune-and-reclaim.sh
      - name: Re-sign + rebuild discovery and site
        run: |
          ./scripts/publish-repo.sh
          while IFS= read -r id; do ./scripts/gen-discovery.sh "$id"; done < <(./scripts/scan-registry.sh --ids)
          ./scripts/gen-site.sh $(./scripts/scan-registry.sh --ids | tr '\n' ' ')
      - name: Sync new summary first, then delete stale refs and orphaned objects
        run: |
          RECLAIM_LIST="$OUT_DIR/reclaim-objects.txt" \
          RECLAIM_REFS="$OUT_DIR/reclaim-refs.txt" ./scripts/sync-r2.sh
      - name: Redeploy site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy "$OUT_DIR/site" --project-name="$CF_PAGES_PROJECT" --branch=main
