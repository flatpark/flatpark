# `/claim` and `/unclaim` on app requests and scan candidates, so two people
# don't package the same app at once. The claim is the issue's assignee: it
# shows in the issue list and needs no write access, because GitHub lets a
# public repository assign anyone who has commented on the issue, and the
# command is that comment.
#
# An app request is one app, so one claim per issue: a second /claim while
# someone holds it gets a reply naming them instead of a second assignee. A
# scan issue ([App Discover] Scan ...) is a table of apps, so a claim there
# names its row, by app or number (`/claim <App>`, `/claim 2`); several
# people can hold rows at once, and a second claim on the same row gets the
# reply instead. A maintainer releases a
# stale claim by unassigning by hand. Nothing from the repository is checked out
# and the comment text only reaches the shell through env, so this is safe on
# comments from anyone.
#
# The issue forms can't put fixed text in the issue body, and the body is the
# reporter's to write, so the pointer for whoever reads the issue later is a
# bot comment: posted once, when the issue first gets one of the two labels
# (the app request form sets it; a scan sets it on its [App Discover] issue).
name: claim

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

# Two /claim comments seconds apart must not both see the issue unassigned.
concurrency:
  group: claim-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write

# GitHub can't filter issue_comment by text, so every comment anywhere starts
# a run; the job conditions turn the ones that aren't a command into a
# skipped run without a runner. contains() is a cheap prefilter (it also
# matches /unclaim); the step below decides what counts as the command.
jobs:
  hint:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      (github.event.label.name == 'app-request' ||
       github.event.label.name == 'app-discover')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      LABEL: ${{ github.event.label.name }}
    steps:
      - name: Thank and point to /claim
        run: |
          set -euo pipefail
          marker='<!-- claim-hint -->'
          # Once per issue: a second label, or one removed and added back,
          # must not post it again.
          if gh issue view "$ISSUE" --json comments -q '.comments[].body' | grep -qF "$marker"; then
              exit 0
          fi
          claim='If you would like to package it yourself, comment `/claim` and the issue is assigned to you, so nobody else starts on the same app; `/unclaim` gives it back. If it is already assigned, ask that person here before starting.'
          if [ "$LABEL" = app-discover ]; then
              claim='To package one of them, comment `/claim <App>` or `/claim <#>` with the name or row number from the table: you are added to the assignees and nobody else starts on the same app. `/unclaim` gives back every row you hold. If someone already claimed that app, ask them here before starting.'
          fi
          agent='An AI agent can do most of the packaging: see [package an app with your agent](https://github.com/flatpark/flatpark#package-an-app-with-your-agent).'
          # A request comes from someone outside; a discover issue is one of
          # our own scans, where a thank-you would read oddly.
          if [ "$LABEL" = app-request ]; then
              lead="Thanks for the request! We'll look the app up and reply here with what we find."
          else
              lead="Every app in this scan is open for anyone to package."
          fi
          printf '%s %s ([Claims](https://flatpark.org/docs/reviewers/issues/#claims)) %s\n\n%s\n' \
              "$lead" "$claim" "$agent" "$marker" > body.md
          gh issue comment "$ISSUE" --body-file body.md >/dev/null

  claim:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/claim') &&
      (contains(github.event.issue.labels.*.name, 'app-request') ||
       contains(github.event.issue.labels.*.name, 'app-discover'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ACTOR: ${{ github.event.comment.user.login }}
      BODY: ${{ github.event.comment.body }}
      DISCOVER: ${{ contains(github.event.issue.labels.*.name, 'app-discover') }}
    steps:
      - name: Handle /claim or /unclaim
        run: |
          set -euo pipefail
          # The command is the comment's first line on its own; "/claim" in
          # the middle of a sentence is someone talking about it.
          # On a scan issue the rest of that line names the row: its app
          # (`/claim <App>`) or its number (`/claim 2`).
          first() { printf '%s\n' "$1" | head -n1 | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//; s/[[:space:]][[:space:]]*/ /g'; }
          line="$(first "$BODY")"
          cmd="${line%% *}"
          app=""
          [ "$cmd" != "$line" ] && app="${line#* }"
          case "$cmd" in
              /claim|/unclaim) ;;
              *) exit 0 ;;
          esac
          # Off a scan issue, "/claim" must stand alone, as before.
          if [ "$DISCOVER" != true ] && [ -n "$app" ]; then
              exit 0
          fi

          react() {
              gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" \
                  -f content="$1" >/dev/null
          }
          reply() { gh issue comment "$ISSUE" --body "$1" >/dev/null; }

          # Read fresh, not from the event: an earlier run in this
          # concurrency group may have just assigned someone.
          mapfile -t holders < <(gh issue view "$ISSUE" --json assignees -q '.assignees[].login')
          mine=false
          for h in "${holders[@]}"; do [ "$h" = "$ACTOR" ] && mine=true; done

          if [ "$cmd" = /claim ] && [ "$DISCOVER" = true ]; then
              if [ -z "$app" ]; then
                  reply "@$ACTOR Say which row you're taking: \`/claim <App>\` or \`/claim <#>\`, as the table gives it."
                  react "confused"
                  exit 0
              fi
              # The scan table's rows, "<#>\t<app>": `| 2 | [Name](url) | ...`.
              rows="$(gh issue view "$ISSUE" --json body -q .body | tr -d '\r' \
                  | sed -n 's/^|[[:space:]]*\([0-9][0-9]*\)[[:space:]]*|[[:space:]]*\[\{0,1\}\([^]|]*\).*/\1\t\2/p' \
                  | tr '[:upper:]' '[:lower:]' | sed 's/[[:space:]]*$//')"
              # A row number for an app name or a number, or nothing.
              row_of() {
                  awk -F'\t' -v a="$1" '$1 == a || $2 == a { print $1; exit }' <<<"$rows"
              }
              want="$(row_of "$app")"
              if [ -z "$want" ]; then
                  reply "@$ACTOR There is no row \`$app\` in this scan's table. Use the app's name or its number, as the table gives it."
                  react "confused"
                  exit 0
              fi
              # Who else holds this row: a current assignee whose own comment
              # claimed it, by name or by number.
              taken=""
              while IFS=$'\t' read -r who body; do
                  [ "$who" = "$ACTOR" ] && continue
                  held=false
                  for h in "${holders[@]}"; do [ "$h" = "$who" ] && held=true; done
                  $held || continue
                  theirs="$(first "$body")"
                  case "$theirs" in "/claim "*) ;; *) continue ;; esac
                  [ "$(row_of "${theirs#/claim }")" = "$want" ] && taken="$who"
              done < <(gh api --paginate "repos/$GH_REPO/issues/$ISSUE/comments" \
                          -q '.[] | [.user.login, (.body | split("\n")[0])] | @tsv')
              if [ -n "$taken" ]; then
                  reply "Row $want is already claimed by @$taken. Ask them here before starting, or a maintainer can release the claim if it has gone quiet."
                  react "confused"
              elif $mine || gh issue edit "$ISSUE" --add-assignee "$ACTOR" >/dev/null; then
                  react "+1"
              else
                  reply "@$ACTOR GitHub refused to assign this issue to you. A maintainer will sort it out."
                  react "confused"
              fi
          elif [ "$cmd" = /claim ]; then
              if $mine; then
                  react "+1"
              elif [ "${#holders[@]}" -gt 0 ]; then
                  list="$(printf '@%s, ' "${holders[@]}")"
                  reply "This is already claimed by ${list%, }. Ask them here before starting, or a maintainer can release the claim if it has gone quiet."
                  react "confused"
              elif gh issue edit "$ISSUE" --add-assignee "$ACTOR" >/dev/null; then
                  gh issue edit "$ISSUE" --remove-label "help wanted" >/dev/null 2>&1 || true
                  react "+1"
              else
                  reply "@$ACTOR GitHub refused to assign this issue to you. A maintainer will sort it out."
                  react "confused"
              fi
          else
              if $mine; then
                  gh issue edit "$ISSUE" --remove-assignee "$ACTOR" >/dev/null
                  if [ "${#holders[@]}" -eq 1 ]; then
                      gh issue edit "$ISSUE" --add-label "help wanted" >/dev/null
                  fi
                  react "+1"
              else
                  react "confused"
              fi
          fi
