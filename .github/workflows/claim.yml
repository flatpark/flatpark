# `/claim` and `/unclaim` on app requests and scan candidates, so two people
# don't package the same app at once. The claim is the issue's assignee: it
# shows in the issue list and needs no write access, because GitHub lets a
# public repository assign anyone who has commented on the issue, and the
# command is that comment.
#
# One claim per issue. A second /claim while someone holds it gets a reply
# naming them instead of a second assignee; a maintainer releases a stale
# claim by unassigning by hand. Nothing from the repository is checked out
# and the comment text only reaches the shell through env, so this is safe on
# comments from anyone.
#
# The issue forms can't put fixed text in the issue body, and the body is the
# reporter's to write, so the pointer for whoever reads the issue later is a
# bot comment: posted once, when the issue first gets one of the two labels
# (the app request form sets it; a scan sets it on its [App Discover] issue).
name: claim

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

# Two /claim comments seconds apart must not both see the issue unassigned.
concurrency:
  group: claim-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write

# GitHub can't filter issue_comment by text, so every comment anywhere starts
# a run; the job conditions turn the ones that aren't a command into a
# skipped run without a runner. contains() is a cheap prefilter (it also
# matches /unclaim); the step below decides what counts as the command.
jobs:
  hint:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      (github.event.label.name == 'app-request' ||
       github.event.label.name == 'app-discover')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      LABEL: ${{ github.event.label.name }}
    steps:
      - name: Thank and point to /claim
        run: |
          set -euo pipefail
          marker='<!-- claim-hint -->'
          # Once per issue: a second label, or one removed and added back,
          # must not post it again.
          if gh issue view "$ISSUE" --json comments -q '.comments[].body' | grep -qF "$marker"; then
              exit 0
          fi
          claim='If you would like to package it yourself, comment `/claim` and the issue is assigned to you, so nobody else starts on the same app; `/unclaim` gives it back. If it is already assigned, ask that person here before starting.'
          # A request comes from someone outside; a discover issue is one of
          # our own scans, where a thank-you would read oddly.
          if [ "$LABEL" = app-request ]; then
              lead="Thanks for the request! We'll look the app up and reply here with what we find."
          else
              lead="This app is open for anyone to package."
          fi
          printf '%s %s ([Claims](https://flatpark.org/docs/reviewers/issues/#claims))\n\n%s\n' \
              "$lead" "$claim" "$marker" > body.md
          gh issue comment "$ISSUE" --body-file body.md >/dev/null

  claim:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/claim') &&
      (contains(github.event.issue.labels.*.name, 'app-request') ||
       contains(github.event.issue.labels.*.name, 'app-discover'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ACTOR: ${{ github.event.comment.user.login }}
      BODY: ${{ github.event.comment.body }}
    steps:
      - name: Handle /claim or /unclaim
        run: |
          set -euo pipefail
          # The command is the comment's first line on its own; "/claim" in
          # the middle of a sentence is someone talking about it.
          cmd="$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          case "$cmd" in
              /claim|/unclaim) ;;
              *) exit 0 ;;
          esac

          react() {
              gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" \
                  -f content="$1" >/dev/null
          }
          reply() { gh issue comment "$ISSUE" --body "$1" >/dev/null; }

          # Read fresh, not from the event: an earlier run in this
          # concurrency group may have just assigned someone.
          mapfile -t holders < <(gh issue view "$ISSUE" --json assignees -q '.assignees[].login')
          mine=false
          for h in "${holders[@]}"; do [ "$h" = "$ACTOR" ] && mine=true; done

          if [ "$cmd" = /claim ]; then
              if $mine; then
                  react "+1"
              elif [ "${#holders[@]}" -gt 0 ]; then
                  list="$(printf '@%s, ' "${holders[@]}")"
                  reply "This is already claimed by ${list%, }. Ask them here before starting, or a maintainer can release the claim if it has gone quiet."
                  react "confused"
              elif gh issue edit "$ISSUE" --add-assignee "$ACTOR" >/dev/null; then
                  gh issue edit "$ISSUE" --remove-label "help wanted" >/dev/null 2>&1 || true
                  react "+1"
              else
                  reply "@$ACTOR GitHub refused to assign this issue to you. A maintainer will sort it out."
                  react "confused"
              fi
          else
              if $mine; then
                  gh issue edit "$ISSUE" --remove-assignee "$ACTOR" >/dev/null
                  if [ "${#holders[@]}" -eq 1 ]; then
                      gh issue edit "$ISSUE" --add-label "help wanted" >/dev/null
                  fi
                  react "+1"
              else
                  react "confused"
              fi
          fi
