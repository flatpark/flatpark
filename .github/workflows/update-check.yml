# Scheduled upstream-update detection. Runs each app's update resolver, recomputes
# the extra-data pins, and opens a PR when anything moved. No signing key or R2
# creds here — it only reads public URLs and opens a PR, which it then merges
# itself (see the auto-merge block below) and dispatches publish.yml for.
#
# This is the pull-mode safety net. The fast path is release-dispatch.yml:
# upstream CI pings us on release and a single-app PR opens within minutes.
# This full sweep still catches everything push mode can't — apps whose
# upstream never adopted the action, releases whose Linux asset was uploaded
# after the ping, and resolver hiccups — and its supersede step below cleans
# up any per-app release PR still open.
name: update-check

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write         # open/close the held-back alert (scripts/ci-alert.sh)
  actions: write        # dispatch publish.yml after the auto-merge

jobs:
  check:
    # 24.04 镜像默认的 apt 源 azure.archive.ubuntu.com 挂了:apt-get update 全线
    # Ign,退回 archive.ubuntu.com 后拉索引时停住,publish #211 就这样零输出吊了
    # 68 分钟。26.04 不走那个源。它目前是 public preview,只当作绕开手段,
    # 那边的源恢复之后换回 ubuntu-latest。
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # update-pins validates any upstream release notes before writing them
      # into a metainfo. Without appstreamcli that guard silently no-ops, so
      # install it up front rather than leaving the check off in the one place
      # it actually runs unattended.
      - name: Install appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
      - name: Recompute pins from upstream
        run: |
          ids="$(./scripts/check-updates.sh | tr '\n' ' ')"
          echo "changed=$ids" >> "$GITHUB_ENV"
          echo "changed apps: ${ids:-<none>}"
      # A PR opened with the default GITHUB_TOKEN does not trigger pr-checks, so
      # nothing downstream of this job looks inside the artifact it just pinned.
      # That is how a repackaged upstream reaches users: com.tldraw.Offline v1.12.0
      # renamed the launcher inside its .deb, the pin refresh sailed through, and
      # every install failed with `apply_extra script failed, exit status 256`
      # (issue #130). Unpack each new payload here, the way an install does, and
      # hold back the pins that no longer unpack instead of shipping them.
      - name: Install flatpak
        if: env.changed != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak bubblewrap
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Verify the new payloads unpack
        if: env.changed != ''
        run: |
          held=""
          kept=""
          for id in $changed; do
            echo "::group::apply_extra $id"
            if INSTALL_RUNTIME=1 ./scripts/check-apply-extra.sh "$id"; then
              kept="$kept $id"
            else
              echo "::warning title=apply_extra failed for $id::holding back this pin; the new upstream artifact does not unpack"
              # Drop this app's recomputed pin, keeping it on the last version
              # known to install. check-updates.sh only touches the working tree.
              git checkout -- "registry/$id/"
              held="$held $id"
            fi
            echo "::endgroup::"
          done
          echo "changed=${kept# }" >> "$GITHUB_ENV"
          echo "held=${held# }" >> "$GITHUB_ENV"
          echo "held back: ${held:-<none>}"
      - name: Open / update PR if pins changed, then merge it
        env:
          GH_TOKEN: ${{ github.token }}
          # Kill switch: set the repo variable AUTO_MERGE_PINS=false to go back
          # to opening the PR and leaving it for a human, without editing this.
          AUTO_MERGE: ${{ vars.AUTO_MERGE_PINS }}
        run: |
          if git diff --quiet -- registry/; then
            echo "no pin changes"; exit 0
          fi
          # What the resolvers actually rewrote, captured before the commit so
          # this needs no git history (the checkout is shallow). Untracked files
          # count too — `git add registry/` below would sweep them in.
          touched="$(git status --porcelain --untracked-files=all -- registry/ | sed 's/^...//')"
          date="$(date -u +%Y-%m-%d)"
          branch="auto/update-pins-$date"
          git config user.name "flatpark-bot"
          git config user.email "bot@flatpark.org"
          git checkout -B "$branch"
          git add registry/
          git commit -m "chore(update): refresh extra-data pins (${changed:-apps})"
          git push -f origin "$branch"

          # One app id per line, as a markdown list
          apps_md="$(for id in ${changed:-}; do printf -- '- `%s`\n' "$id"; done)"
          [ -n "$apps_md" ] || apps_md='- (see diff)'
          title="Update extra-data pins ($date)"
          body="$(printf 'Automated extra-data pin refresh — %s\n\n**Updated apps:**\n\n%s\n\nEach payload was unpacked with the app'"'"'s `apply_extra.sh` before being pinned here.\n\nMerging triggers a rebuild + publish of the changed app(s).' "$date" "$apps_md")"
          if [ -n "${held:-}" ]; then
            held_md="$(for id in $held; do printf -- '- `%s`\n' "$id"; done)"
            body="$(printf '%s\n\n**Held back — the new upstream artifact does not unpack:**\n\n%s\n\nThese keep their current pin. Their `apply_extra.sh` needs a look before the update can ship.' "$body" "$held_md")"
          fi

          # Create today's PR, or refresh it if this branch already opened one earlier today
          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          else
            gh pr edit "$branch" --title "$title" --body "$body"
          fi

          # Supersede older open auto-update PRs and per-app release PRs
          # (release-dispatch.yml, auto/release-*): today's batch is recomputed
          # against main, so it's a superset of any unmerged earlier one — keep
          # a single open PR.
          new="$(gh pr list --head "$branch" --state open --json number -q '.[0].number')"
          for n in $(gh pr list --state open --json number,headRefName \
                       -q ".[] | select((.headRefName | startswith(\"auto/update-pins-\")) or (.headRefName | startswith(\"auto/release-\"))) | select(.headRefName != \"$branch\") | .number"); do
            echo "superseding older auto-update PR #$n"
            gh pr close "$n" --comment "Superseded by #$new ($date pin refresh)." --delete-branch || true
          done

          # Auto-merge. Nothing here waits for a review: the diff is pins only,
          # and every payload still in it was unpacked with the app's own
          # apply_extra.sh above — that check, not a human read of a sha256, is
          # what actually catches a bad update.
          #
          # Guard: check-updates.sh `eval`s each app's `update.command`, so a
          # resolver can in principle write anywhere in the tree. A pin refresh
          # only ever rewrites the manifest (`registry/<id>/<id>.yml`, where the
          # url/sha256 live) and the metainfo next to it, so anything else in the
          # diff means something wrote outside its lane — an apply_extra.sh, a
          # wrapper, a file outside registry/. Leave that one for a human.
          stray="$(printf '%s\n' "$touched" \
                     | grep -vE '^registry/[^/]+/[^/]+\.(yml|metainfo\.xml)$' || true)"
          if [ "${AUTO_MERGE:-true}" = "false" ]; then
            echo "auto-merge disabled by the AUTO_MERGE_PINS repo variable; leaving #$new open"
          elif [ -n "$stray" ]; then
            echo "::warning title=auto-merge skipped::diff touches files outside the pin surface"
            printf '%s\n' "$stray"
            gh pr comment "$new" --body "$(printf 'Auto-merge skipped — this diff touches files a pin refresh never writes:\n\n```\n%s\n```\n\nA resolver writing anywhere else needs a human look.' "$stray")"
          else
            gh pr merge "$new" --squash --delete-branch
            # A push made with GITHUB_TOKEN never triggers another workflow, so
            # publish.yml does NOT see this merge. workflow_dispatch is the
            # documented exception to that rule, so ask for the publish here.
            # It diffs from the last published sha recorded in R2, not from this
            # push, so it builds exactly the apps the merge changed.
            gh workflow run publish.yml --ref main
            echo "merged #$new and dispatched publish"
          fi
      # A red run is not a notification. It sits in the Actions tab, and GitHub
      # only emails failures of *scheduled* runs — a manual dispatch, or the
      # publish that follows the auto-merge, reaches nobody. Mirror the held-back
      # state into an issue, which does notify, and close it again on recovery.
      - name: Open / close the held-back alerts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in ${held:-}; do
            ./scripts/ci-alert.sh open "update-check/$id" \
              "update-check: $id no longer unpacks" <<EOF
          The payload upstream is serving for \`$id\` fails this app's
          \`apply_extra.sh\`, so the pin refresh was held back and the app stays on
          the last version known to install. Users are not affected until this is
          fixed and the new version ships.

          Usually upstream repackaged — a renamed launcher, a relocated binary — and
          \`registry/$id/apply_extra.sh\` needs to follow. Reproduce with:

          \`\`\`
          ./scripts/check-apply-extra.sh $id
          \`\`\`

          This issue closes itself once that payload unpacks again.
          EOF
          done

          # Apps whose new payload verified this run are healthy by definition.
          for id in ${changed:-}; do
            ./scripts/ci-alert.sh resolve "update-check/$id" \
              "The new payload for \`$id\` unpacks again; its pin refreshed."
          done

          # An app fixed by hand is in neither list: the fix PR usually carries
          # the corrected pin too, so the next run finds it up to date and never
          # re-runs the gate. Re-check whatever is still alerting — normally
          # nothing, so this costs a single `gh issue list` on a healthy day.
          stale=""
          for key in $(./scripts/ci-alert.sh list "update-check/"); do
            id="${key#update-check/}"
            case " ${held:-} " in *" $id "*) continue ;; esac
            stale="$stale $id"
          done
          if [ -n "$stale" ]; then
            command -v flatpak >/dev/null || \
              sudo apt-get install -y flatpak bubblewrap
            flatpak remote-add --user --if-not-exists flathub \
              https://dl.flathub.org/repo/flathub.flatpakrepo
            for id in $stale; do
              if INSTALL_RUNTIME=1 ./scripts/check-apply-extra.sh "$id"; then
                ./scripts/ci-alert.sh resolve "update-check/$id" \
                  "The pinned payload for \`$id\` unpacks again."
              fi
            done
          fi

      # Last, so a held-back app still gets its PR opened for the apps that passed.
      # A red daily run is the point: an upstream that repackaged needs a human.
      - name: Fail if any pin was held back
        if: env.held != ''
        run: |
          echo "held back — apply_extra failed against the new payload:$held" >&2
          exit 1
