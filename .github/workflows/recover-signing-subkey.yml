        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::FLATPAK_GPG_PRIVATE_KEY is empty"; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$RECIPIENT" | gpg --batch --import
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --yes --trust-model always \
            --recipient "$RECIPIENT_FPR" --armor --encrypt --output "$RUNNER_TEMP/subkey.asc.gpg"
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@v7
        with:
          name: recovered-subkey
          path: ${{ runner.temp }}/subkey.asc.gpg
          retention-days: 1
          if-no-files-found: error
