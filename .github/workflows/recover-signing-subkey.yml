# ONE-OFF: recover the live repo signing subkey (FLATPAK_GPG_PRIVATE_KEY) so it
# can move into the "production" environment. Its only other copy was lost.
# The secret is encrypted to a recovery public key whose private half never
# leaves the owner's machine, so the artifact is useless to anyone else.
# Delete this workflow, its run and its artifact right after use.
name: recover-signing-subkey
on: workflow_dispatch
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/main' && github.actor == 'jing2uo'
    runs-on: ubuntu-24.04
    steps:
      - name: Encrypt the signing subkey to the recovery key
        env:
          SIGNING_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          RECIPIENT_FPR: BC5E52641E8165764BD17F1254C622864E84E99A
          RECIPIENT: |
