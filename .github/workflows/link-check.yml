# Daily full-catalog dead-link sweep. PR checks only fail on links the PR
# itself adds (scripts/check-links-pr.sh), so this is where links that rot
# while nobody is editing the app — screenshots, websites, docs, license and
# source URLs — get noticed. It also checks every extra-data pin in the
# manifests: the download must answer and still be the pinned size, or new
# installs of the app fail. The broken list is mirrored into one ci-alert
# issue, rewritten every run and closed once the catalog is clean.
name: link-check

on:
  schedule:
    - cron: "43 5 * * *"   # daily, 05:43 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write         # open/rewrite/close the broken-links alert (scripts/ci-alert.sh)

jobs:
  links:
    # 24.04 镜像默认的 apt 源 azure.archive.ubuntu.com 挂了:apt-get update 全线
    # Ign,退回 archive.ubuntu.com 后拉索引时停住,publish #211 就这样零输出吊了
    # 68 分钟。26.04 不走那个源。它目前是 public preview,只当作绕开手段,
    # 那边的源恢复之后换回 ubuntu-latest。
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check every hotlinked URL and extra-data pin across the catalog
        env:
          LINK_CHECK_JSON_OUT: ${{ runner.temp }}/links.json
        run: ./scripts/check-links.sh
      # A red scheduled run only emails whoever last touched the cron line.
      # One issue for the whole batch, rewritten with each run's list, so the
      # fixes go out together in one PR.
      - name: Open / update / close the broken-links alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/links.json
        run: |
          [ -s "$REPORT" ] || { echo "no report; the sweep died before checking"; exit 0; }
          n="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).broken)' "$REPORT")"
          if [ "$n" -eq 0 ]; then
            ./scripts/ci-alert.sh resolve "link-check" "Every hotlinked URL answered in this run."
            exit 0
          fi
          {
            echo "These links failed the latest daily sweep. They are not blocking any PR"
            echo "(PR checks only fail on links a PR adds), but the site shows them broken."
            echo "An \`extra-data\` row is a pinned download that is gone or no longer the"
            echo "pinned size: installing that app fails until the pin is refreshed."
            echo
            echo "| App | Type | Status | URL |"
            echo "|---|---|---|---|"
            node -e '
              const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const esc = (s) => String(s).replace(/\|/g, "\\|");
              for (const r of d.results.filter((x) => !x.ok))
                console.log(`| \`${r.app}\` | ${r.type} | ${esc(r.status || r.error)} | ${esc(r.url)} |`);
            ' "$REPORT"
            echo
            echo "Reproduce with \`./scripts/check-links.sh <app-id>\`. This issue is"
            echo "rewritten every run and closes itself once every link answers."
          } | ./scripts/ci-alert.sh sync "link-check" "link-check: $n broken link(s)"
