# Upstream maintainers who may merge their own app's PRs with a `/merge`
# comment (.github/workflows/self-merge.yml). The check itself lives in
# scripts/self-merge-check.mjs; what a self-merge may and may not touch is
# documented there and in the site guide (site/src/content/pages/contributing.md).
#
# Who belongs here: the app's own upstream developer — someone with a real
# commit history in the upstream repo — who has already sent PRs for it. A
# third-party packager does not, however many PRs they send. The app should
# carry the developer-approved shield (docs/upstream-approvals.md).
#
# `id` is the GitHub numeric user id (`gh api users/<login> --jq .id`) and is
# the only field the check trusts: a login can be renamed and re-registered by
# someone else. `login` is for humans.
#
# This file is outside registry/, so a self-merge can never edit it.

